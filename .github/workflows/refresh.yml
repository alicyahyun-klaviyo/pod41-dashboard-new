name: Refresh Dashboard

on:
  # Runs Mon–Fri at 9:00 AM AEST (= 11:00 PM UTC the night before)
  schedule:
    - cron: "0 23 * * 0-4"

  # Lets you also trigger a manual refresh from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate index.html from Slack
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: python generate.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Only commit if index.html actually changed
          git diff --staged --quiet || git commit -m "chore: refresh dashboard $(date +'%Y-%m-%d %H:%M AEST')"
          git push
