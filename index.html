<title>Pod 41 · Questions Dashboard</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; font-size: 14px; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .channel-badge { background: #4A154B; color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; letter-spacing: 0.3px; white-space: nowrap; }
  header h1 { font-size: 16px; font-weight: 700; color: #1d1d1f; }
  .last-updated { font-size: 11px; color: #8e8e93; margin-top: 2px; }
  .main { padding: 20px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 14px 16px; border: 1px solid #e5e5ea; }
  .stat-card .stat-label { font-size: 11px; font-weight: 500; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; line-height: 1; color: #1d1d1f; }
  .stat-card.purple .stat-value { color: #4A154B; }
  .stat-card.green  .stat-value { color: #34c759; }
  .stat-card.orange .stat-value { color: #ff9500; }
  .stat-card.blue   .stat-value { color: #007aff; }
  .filter-bar { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap input { width: 100%; border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px 7px 30px; font-size: 13px; color: #1d1d1f; outline: none; transition: border-color 0.15s; }
  .search-wrap input:focus { border-color: #4A154B; }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #8e8e93; font-size: 13px; }
  .filter-select { border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #1d1d1f; background: #fff; outline: none; cursor: pointer; min-width: 140px; }
  .filter-select:focus { border-color: #4A154B; }
  .filter-count { font-size: 12px; color: #8e8e93; white-space: nowrap; }
  .table-wrap { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #f5f5f7; border-bottom: 1px solid #e5e5ea; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: #4A154B; }
  tbody tr { border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf5fb; }
  tbody tr.expanded-row { background: #faf5fb; }
  td { padding: 11px 14px; vertical-align: top; }
  .td-date { color: #8e8e93; font-size: 12px; white-space: nowrap; }
  .td-requester { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .td-ka { font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: #4A154B; white-space: nowrap; }
  .td-summary { font-size: 13px; color: #3a3a3c; max-width: 320px; line-height: 1.4; }
  .td-summary-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ticket-link { color: #4A154B; text-decoration: none; font-size: 12px; font-weight: 500; }
  .ticket-link:hover { text-decoration: underline; }
  .area-tag { display: inline-block; background: #f0e8f1; color: #4A154B; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 500; max-width: 180px; word-break: break-word; }
  .expand-row td { padding: 0; background: #fdf8fe; border-bottom: 2px solid #e5d6e8; }
  .expand-content { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .expand-section h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #4A154B; margin-bottom: 6px; }
  .expand-section p { font-size: 13px; color: #3a3a3c; line-height: 1.5; }
  .expand-section p + p { margin-top: 3px; }
  .expand-section ul { padding-left: 16px; }
  .expand-section li { font-size: 13px; color: #3a3a3c; line-height: 1.5; margin-bottom: 4px; }
  .expand-full { grid-column: 1 / -1; }
  .expand-suggestion-box { grid-column: 1 / -1; background: #f0faf4; border: 1.5px solid #34c759; border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .expand-suggestion-box .suggestion-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
  .expand-suggestion-box .suggestion-body h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #1a7f37; margin-bottom: 5px; }
  .expand-suggestion-box .suggestion-body p { font-size: 13px; color: #1d3826; line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px; color: #8e8e93; font-size: 13px; }
  .no-suggestions { color: #8e8e93; font-size: 12px; font-style: italic; }
  .chart-section { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .chart-section h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #8e8e93; margin-bottom: 2px; width: 100%; }
  .donut-wrap { position: relative; width: 160px; height: 160px; flex-shrink: 0; }
  .donut-chart { width: 160px; height: 160px; border-radius: 50%; }
  .donut-hole { position: absolute; top: 20px; left: 20px; width: 120px; height: 120px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-hole .donut-total { font-size: 22px; font-weight: 700; color: #1d1d1f; line-height: 1; }
  .donut-hole .donut-total-label { font-size: 10px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
  .donut-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; flex: 1; min-width: 240px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #3a3a3c; cursor: pointer; padding: 3px 6px; border-radius: 6px; transition: background 0.1s; }
  .legend-item:hover { background: #f5f5f7; }
  .legend-item.active { background: #f0e8f1; font-weight: 600; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { font-weight: 700; color: #1d1d1f; }
  .legend-pct { color: #8e8e93; font-size: 11px; }
</style>

<script>
const QUESTIONS=[{"date": "2026-10-09", "requester": "Ash Arraiza", "ka": "Y8WinC", "area": "Integrations", "summary": "• Salesforce CRM • Customer’s Salesforce opportunity (stage “Working”) is not syncing into Klaviyo.", "tried": ["Mapped email field Email__c is empty; email sits in Owner_Email__c. Customer wants one setup that works for both. Asking correct team to escalate to."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4223378", "replies": 25, "has_files": false, "suggestion_summary": "Alicya and Ash agreed this likely needs escalation to SE since the KB doesn't cover it; Alicya also suggested (from Glean, unverified) a Salesforce Formula → Text field such as BLANKVALUE(Email__c, Owner_Email__c) so one mapped field works whether the email is in Email__c or Owner_Email__c.", "standardized_area": "Integrations"}, {"date": "2026-10-08", "requester": "Ash Arraiza", "ka": "U22HGZ", "area": "Integrations", "summary": "• Shopify - Klaviyo says the app embed is turned off, but it is on in the customer's Shopify theme.", "tried": ["Followed IKB guide; reset app embed metafields; Staffside shows old theme ID. Can theme ID be manually updated in SS or escalate?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4223308", "replies": 6, "has_files": true, "suggestion_summary": "Advised escalating since manually updating the stale theme ID in Staffside isn't documented and should be automatic; also comment on the similar Linear (IEC-1036). A new Linear, IEC-1543, was created for the same Shopify app embed issue.", "standardized_area": "Integrations"}, {"date": "2026-10-06", "requester": "Ash Arraiza", "ka": "UiVFQf", "area": "Campaigns", "summary": "Customer's SMS campaigns skipped almost all recipients for \"Quiet Hours.\" Both campaigns were sent before Quiet Hours started.", "tried": ["Checked HC article and IKB checklist; account uses Eastern time zone quiet hours setting not Profile location. Other reasons for early skips?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4208646", "replies": 13, "has_files": true, "suggestion_summary": "Thread found no clear cause: the customer's 9pm quiet-hours setting appeared to be obeyed alongside the default 8pm smart-sending window, which still doesn't explain why 8:30pm and 8:57pm sends were skipped. Quiet hours were updated on 16 Sept, and the case was escalated.", "standardized_area": "Campaigns"}, {"date": "2026-09-30", "requester": "Chris Yinfoo", "ka": "UhkRaC", "area": "Integrations", "summary": "Wix Ecommerce 'Abandoned Checkout' metric does not work", "tried": ["Anything else to check through before escalation?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4200887", "replies": 11, "has_files": false, "suggestion_summary": "The team suspected the issue stemmed from the customer using a customized Wix checkout rather than Wix's default checkout, since the KB's Splunk check only covers the default flow; advised confirming with the customer whether they use a customized checkout before escalating to SE, and noted the default checkout may be the only supported option.", "standardized_area": "Integrations"}, {"date": "2026-09-29", "requester": "Ash Arraiza", "ka": "Rj7bYZ", "area": "Lists & Segments", "summary": "• Shopify tags are syncing, but there are many that are unable to be used as segment conditions or filters.", "tried": ["resync, verified tag in SS, tried text and list types, manual typing."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4204856", "replies": 55, "has_files": true, "suggestion_summary": "The team traced it to Klaviyo's 512-value display limit for property dropdowns (linked to bug PROPLAT-491) — the Shopify tag values existed on the profile but wouldn't populate in the segment/flow filter dropdown; typing the exact tag text (contains) worked for the segment condition, though the flow trigger profile filter still didn't show it as an option.", "standardized_area": "Lists & Segments"}, {"date": "2026-09-25", "requester": "Meher Gambhir", "ka": "W4AQdY", "area": "Flows", "summary": "Acc is showing £0 attributed revenue across flows and campaigns for September 16–23, 2026, despite continued Shopify placed order events and normal email activity.", "tried": ["CX moved templates to Custom HTML; link tracking works. Second opinion needed."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4196873", "replies": 37, "has_files": false, "suggestion_summary": "Alicya and Meher found the affected profiles all placed their order before opening or clicking the email, so they didn't meet Klaviyo's attribution rules despite the Placed Order events firing; separately, a click-tracking-off HTML snippet that had appeared in one template seemed to have resolved itself (likely a stale version), and they advised the customer to have their developer double check the custom HTML isn't malformed.", "standardized_area": "Flows"}, {"date": "2026-09-24", "requester": "Meher Gambhir", "ka": "TBT56L", "area": "Campaigns", "summary": "The email template appears shifted to the left in mobile view, with an uneven background strip visible along the right side.", "tried": ["Confirmed width 600px, mobile optimization on, set margins/padding to 0, matched backgrounds, size 55KB. Only mobile view. Looks buggy."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4196968", "replies": 1, "has_files": false, "suggestion_summary": "Discussed in the office - turning off mobile optimization on the template resolved the rendering issue better than keeping it enabled.", "standardized_area": "Campaigns"}, {"date": "2026-09-23", "requester": "Chris Yinfoo", "ka": "VpVCCs", "area": "Catalogs & Feeds", "summary": "Customer has three Salesforce Commerce Cloud catalog items for the same product, all sharing the same Item ID and SKU. Their Price Drop email is defaulting to the Default catalog item instead of polk_us; reduced price mapped to Default's original price.", "tried": ["Customer told updating the cartridge would let Klaviyo differentiate catalogs (past ticket 4083895). Customer clarified payload price attributes were incorrect."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4184010", "replies": 10, "has_files": false, "suggestion_summary": "Alicya explained that Price Drop flows can only source pricing from one catalog and don't pull from the live website; for SFCC, catalog-triggered flows need version 25.4.0+ so a catalog identifier (external id + store id) can distinguish items sharing the same ID across catalogs. She found the correct price was actually set on the variant product rather than the parent product, and suggested asking the customer what that variant product is.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-22", "requester": "Chris Yinfoo", "ka": "SewLA5", "area": "Lists & Segments", "summary": "The customer wants to know the origin of a custom property found on profiles page", "tried": ["Checked dev logs, tried segment (key doesn't appear), not in SS. Anywhere else to check?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4188820", "replies": 12, "has_files": true, "suggestion_summary": "Chris found the custom property was added via an API call that touched only profile attributes with no visible integration in the dev logs, likely from an automation using a private API key; Alicya recommended checking with the SE team to trace where it originated.", "standardized_area": "Lists & Segments"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "RhX2C9", "area": "Integrations", "summary": "The Shopify Checkout URL does not load checkout page but rather goes to the home page. No Placed Order events.", "tried": ["Pasted checkout url in browser; Postman Abandoned URL shows same URL. Am I missing something?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189545", "replies": 15, "has_files": true, "suggestion_summary": "Alicya explained this is a known issue where Shopify checkout URLs take about 15 minutes to sync to Klaviyo, so testing immediately after the event shows the homepage instead of the checkout page; she pointed Chris to the internal KB troubleshooting guide for checkout URL redirect issues.", "standardized_area": "Integrations"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "S9Qc5f", "area": "Flows", "summary": "The customer is noticing a number of recipients skipped in a flow due to 'Unable to Send Email'. Would like more detail into the reason.", "tried": ["Debugger. Same in other flows too."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189533", "replies": 21, "has_files": true, "suggestion_summary": "Chris identified two similar Linear bugs about flow emails skipped due to 'Unable to Send Email'; the team concluded the closest match is FP-3896 (Unable to Send Email due to UNKNOWN_SEND_EXCEPTION).", "standardized_area": "Flows"}, {"date": "2026-09-14", "requester": "Chris Yinfoo", "ka": "V458YQ", "area": "Flows", "summary": "Customer noticed lack of flow emails sending", "tried": ["Debugger shows nothing; no skipped emails; last profile to receive email 1A in June 2026."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4174764", "replies": 6, "has_files": true, "suggestion_summary": "Alicya ran Chronosphere queries and found the profiles never entered the date-triggered flow at all (not just delayed), matching a known bug (FP-3599: profiles failing to enter date-triggered flow); she recommended escalating to Backline.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "Vbxg9f", "area": "Flows", "summary": "Flow webhook activity showing many skipped", "tried": ["Compared worked vs didn't; any other logs to check?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165180", "replies": 6, "has_files": true, "suggestion_summary": "Alicya identified the webhook was a non-Klaviyo (customer-owned) webhook, suggesting the skipped activity was likely due to an issue on the receiving end, and recommended checking in with the webhook owner directly.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "ThEqHV", "area": "Sign Up Forms", "summary": "Customer has one parent account (SINGER) with multiple child accounts. WooCommerce child setup transitioned to BigCommerce Multi-Storefront; unable to configure flows. SINGER form shown on Ricoma site.", "tried": ["Advised customer to use form targeting; form shows no targeting."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115668", "replies": 12, "has_files": true, "suggestion_summary": "Confirmed the JavaScript/integration setup was correct on the parent account, and identified that the customer's sign-up form was missing the targeting needed to limit the Singer form to the Singer site; Alicya and Chris planned to huddle to walk through the full BigCommerce multi-storefront migration (forms, flows, list structure) together.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "PDQku2", "area": "Catalogs & Feeds", "summary": "• Unable to save new product feed  • Existing product feed is not available to select when adding a product block into email", "tried": ["Tested with clone and new campaign; can't replicate in test account"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4166614", "replies": 20, "has_files": true, "suggestion_summary": "Found a 403 error in the network tab when creating a new product feed and adding a product block to the campaign, which appeared to be unexpected behaviour; Alicya recommended escalating the issue to Backline.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-08", "requester": "Ash Arraiza", "ka": "UJFV9p", "area": "Flows", "summary": "• Profiles are processed through the conditional split, but then they aren't being queued for the message afterwards.", "tried": ["Checked skipped/scheduled; debugger queuing complete; no filters; similar bugs FP-3307, FP-3662."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164569", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found the split action shared the same action ID as another block, which didn't match any known flow bugs, so she recommended escalating to have engineering create a new bug ticket.", "standardized_area": "Flows"}, {"date": "2026-09-08", "requester": "Meher Gambhir", "ka": "KSMVzB", "area": "Email Deliverability", "summary": "Legitimate profiles are being suppressed by BOT_PROTECTION through consent webhooks from unrelated accounts", "tried": ["WooCommerce integration; consent events with no IP/UA; maybe ICM-1282."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165362", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed the profiles were suppressed by subscription protection (visible via Splunk calls from multiple account IDs) and, since the customer confirmed they were legitimate, advised linking the known ICM-1282 bot-protection bug ticket.", "standardized_area": "Email Deliverability"}, {"date": "2026-09-08", "requester": "Chris Yinfoo", "ka": "VyhTNh", "area": "Integrations", "summary": "Prestashop integration is enabled however the customer is not seeing added to cart events. Klaviyo.js script does not appear to be present.", "tried": ["Other events work; Set Up Web Tracking > Add does nothing; Prestashop 1.7.8.8, module 1.12.9."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164460", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found no Klaviyo JS injected on the site at all and pointed to the PrestaShop troubleshooting guide; since the previous agent had already followed it without success, she advised escalating.", "standardized_area": "Integrations"}, {"date": "2026-09-03", "requester": "Ash Arraiza", "ka": "XsDESE", "area": "Templates", "summary": "• Smart translation for Swedish and Swiss High German changes complete images in the template during a live send.", "tried": ["Web view shows correct images; no Linear bugs found; saved template changes not applied on live send."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4145150", "replies": 14, "has_files": true, "suggestion_summary": "Alicya explained that the web view doesn't always reflect what was actually delivered, and pointed Ash to the Staffside template-rendering-artifacts tool (or having the customer forward the actual received email) to confirm which image version was truly sent; since the staff tool failed to load, the plan was to ask the customer to forward screenshots of the received email instead.", "standardized_area": "Templates"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "<https://klaviyo.zendesk.com/agent/tickets/4151819>", "area": "Sign Up Forms", "summary": "The customer is running into HTTP 503 errors when trying to sign up to their pop up form", "tried": ["Unable to replicate; requested more info."], "ticket_url": "", "replies": 23, "has_files": false, "suggestion_summary": "Alicya traced the reported 503s to the client/profiles (identify) and onsite/track-analytics calls rather than the client/subscriptions (subscribe) endpoint, and since the team couldn't reproduce the issue and the customer had no screenshot or HAR file confirming the failure, they escalated the ticket to Backline as a sign-up form issue.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "WZcvhJ", "area": "Sign Up Forms", "summary": "Customer is unable to publish their form (There are stats which means it was possible previously)", "tried": ["Unable to clone the form either; ruled out side image and notification percentage. Anything else?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4150949", "replies": 5, "has_files": false, "suggestion_summary": "Alicya and Chris found the form also couldn't be cloned and had a buggy image-block deletion, point y": "Customer is trying to complete AU branded sender ID registration; after submitting they are redirected to a Google Forms page showing \"Something went wrong.\" AU sender ID stays Incomplete so they cannot send SMS to AU numbers.", "tried": ["Confirmed Incomplete; resubmit still fails across Chrome logins, laptop and phone; no further frontline fixes. Possible bug."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3777579", "replies": 17, "has_files": false, "suggestion_summary": "Ash explained that 'Incomplete' status on the SMS carrier form is expected — it stays that way until the carrier starts reviewing (Klaviyo can't update it). She also suggested escalating to the SMS Delivery & Compliance team.", "standardized_area": "Compliance"}, {"date": "2026-02-17", "requester": "Ash Arraiza", "ka": "Swtn9V", "area": "Compliance", "summary": "• Customer has a paraphernalia (weed) store and is being rejected for US and Canadian TFN.  • Unsure which team to send to Compliance, D&C or SMS Activations.", "tried": ["Followed IKB but unclear which team to escalate to."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3765499", "replies": 4, "has_files": false, "suggestion_summary": "Alicya identified this as a Compliance team escalation, as the SHAFT policy rejection for cannabis-related businesses falls under their purview.", "standardized_area": "Compliance"}, {"date": "2026-02-17", "requester": "Chris Yinfoo", "ka": "P47R2f", "area": "Flows", "summary": "The customer updated their ecomm store from Woo to Shopify. Cloned price drop flow should reference Shopify products only.", "tried": ["Report still shows Woo products; Woo disabled 17 Feb. How to confirm Shopify going forward?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3764988", "replies": 12, "has_files": false, "suggestion_summary": "Alicya found the account was still mapped to the old BigCommerce integration, causing the Price Drop flow to behave unexpectedly. She recommended removing the BigCommerce integration, purging the catalog, and resyncing solely from Shopify.", "standardized_area": "Flows"}, {"date": "2026-02-13", "requester": "Ash Arraiza", "ka": "UksXRm", "area": "Campaigns", "summary": "• Cx cannot clone campaign to another account (from AU to NZ accounts)", "tried": ["Admin on both; cleared cache; incognito; page frozen 1+ hours."], "ticket_url": "", "replies": 2, "has_files": false, "suggestion_summary": "The campaign clone freeze between AU and NZ accounts resolved itself without intervention — Ash confirmed it fixed with patience and linked related bug reports BUGPORT-10542 and BUGPORT-10575 for reference.", "standardized_area": "Campaigns"}, {"date": "2026-02-11", "requester": "Chris Yinfoo", "ka": "UxmzeY", "area": "Integrations", "summary": "Historical sync appears stalled at 98%", "tried": ["Earlier 500 error; failed historical sync with one retry; will re-queue help?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3734262", "replies": 15, "has_files": false, "suggestion_summary": "Alicya suggested increasing the integration's connection_timeout setting (to around 50) to resolve the 503 timeout errors, then waiting until the expected sync completion date to see if it succeeds.", "standardized_area": "Integrations"}, {"date": "2026-02-09", "requester": "Chris Yinfoo", "ka": "TVPP9H", "area": "Lists & Segments", "summary": "The customer believes they meet the criteria for CLV however they notice a message when looking into a profile", "tried": ["Checked predictive analytics criteria; seems met. Anything missed?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3736907", "replies": 9, "has_files": false, "suggestion_summary": "Alicya found the issue was caused by incorrect metric mapping — Placed Order was mapped to an individual item metric, so revenue couldn't be calculated. She recommended the customer remap their metrics following the predictive analysis guide.", "standardized_area": "Lists & Segments"}, {"date": "2026-02-04", "requester": "Chris Yinfoo", "ka": "MBqXVi", "area": "Campaigns", "summary": "The customer would like SMS usage figures for Jan - Dec 2025; the current view only does last 12 months", "tried": ["Checked IKB on usage for contracts over 12 months; not sure it fits."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3720575", "replies": 8, "has_files": false, "suggestion_summary": "Alicya suggested escalating to the Billing team to get the customer a usage report, and noted that a custom report on API usage may also be possible.", "standardized_area": "Campaigns"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "VGeZHB", "area": "Integrations", "summary": "Same request works via curl (201) but fails from n8n Cloud with a Cloudflare block page; blocked IP 20.79.32.39.", "tried": ["Asked for API call details. Is IP blocking usual and can we do anything?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3688264", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed this is a standard IP whitelisting issue and directed the customer to follow the relevant steps.", "standardized_area": "Integrations"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "Wqcbfr", "area": "Catalogs & Feeds", "summary": "The customer updated inventory for an item and wonders why the BIS report still says queued for some products with the same name", "tried": ["SKU ID differs from Shopify ID; found a custom catalog sync too; customer unaware of it."], "ticket_url": "", "replies": 24, "has_files": false, "suggestion_summary": "Alicya walked through the options: either fix the custom catalog feed with developer help, or delete it entirely and resync using the Shopify catalog (noting this would affect Back-in-Stock). She recommended clarifying with the customer which path they prefer.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "X6M5Pn", "area": "Catalogs & Feeds", "summary": "• Localised product feed links", "tried": ["A lot of back and forth already, need advice on next best approach"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3642269", "replies": 16, "has_files": false, "suggestion_summary": "Alicya identified that the product URL in the customer's custom catalog feed was syncing with the incorrect URL, and recommended they fix it in their feed. She also suggested looping in the CSM to alert them to the situation.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "sqUwG2", "area": "Integrations", "summary": "The customer's Shopify Onsite Tracking says Turned Off, but Shopify says Activated", "tried": ["Get App Embed Metafields shows false; would Reset App Embed Metafields be suitable?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3659792", "replies": 2, "has_files": false, "suggestion_summary": "Alicya suggested following the existing guide carefully and making sure the Save button is clicked, then asking the customer for a screen recording if the issue persists.", "standardized_area": "Integrations"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "3670894", "area": "Integrations", "summary": "Custom website API to Klaviyo; discount codes all have same expiry date; need evergreen codes with different periods for sunset flow. Can Klaviyo call an endpoint to request number of coupons and duration?", "tried": ["Still trying to understand their situation"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3670894", "replies": 15, "has_files": false, "suggestion_summary": "Alicya explained that coupon expiry must be set as a fixed date (not a relative period like '14 days'), but leaving it blank defaults to 1-year expiry from when the profile enters the flow. She suggested asking in #ask-apis about adding a relative expiry option.", "standardized_area": "Integrations"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
const CHART_COLORS=["#4A154B","#007aff","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#ffcc00","#8e8e93","#30b0c7","#ff2d55","#5856d6"];
function getAreaCounts(){const counts={};QUESTIONS.forEach(q=>{counts[q.area]=(counts[q.area]||0)+1;});return Object.entries(counts).sort((a,b)=>b[1]-a[1]);}
function filterByArea(area){const sel=document.getElementById("areaFilter");sel.value=sel.value===area?"":area;renderTable();}
function renderChart(){
  const counts=getAreaCounts();
  const total=QUESTIONS.length;
  const activeArea=document.getElementById("areaFilter")?document.getElementById("areaFilter").value:"";
  let cumulative=0;
  const gradientParts=counts.map(([area,count],i)=>{
    const pct=total?count/total*100:0;
    const start=cumulative;
    cumulative+=pct;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    return `${color} ${start}% ${cumulative}%`;
  });
  document.getElementById("donutChart").style.background=gradientParts.length?`conic-gradient(${gradientParts.join(",")})`:"#e5e5ea";
  document.getElementById("donutTotal").textContent=total;
  document.getElementById("donutLegend").innerHTML=counts.map(([area,count],i)=>{
    const color=CHART_COLORS[i%CHART_COLORS.length];
    const pct=total?((count/total)*100).toFixed(1):"0.0";
    const isActive=activeArea===area;
    return `<div class="legend-item${isActive?" active":""}" onclick="filterByArea('${area.replace(/'/g,"\\'")}')"><span class="legend-swatch" style="background:${color}"></span><span class="legend-label">${esc(area)}</span><span class="legend-count">${count}</span><span class="legend-pct">${pct}%</span></div>`;
  }).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  renderChart();
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderChart();renderTable();
</script>
