const QUESTIONS=[{"date": "2026-06-02", "requester": "Ash Arraiza", "ka": "QCN2d7", "area": "Back in Stock Reports (Bug?)", "summary": "Back in stock reports tab loads indefinitely.", "tried": ["Did not replicate this issue in 2 test accounts", "Cecilia's Basecamp (XDLpgg) paid account, Ash A Test Account (UvCpx3) free account", "User attempting the action is an Admin (kate.leveille@bycharlotte.com.au)", "Re-attempted from incognito window.", "Can I esco to BL"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3995864", "replies": 17, "has_files": false, "suggestion_summary": "Alicya confirmed the same 500 internal server error in the customer's account (Back in Stock Reports tab) but could not replicate it in test accounts. She recommended escalating to Business Licensing."}, {"date": "2026-06-02", "requester": "Meher Gambhir", "ka": "WKMDP9", "area": "Flow Internal Alert not working", "summary": "Customer states they have not received any internal alert notifications from this flow since 21st May. Alerts should be sending if there has been more than 20mins since since checkout started (with amount higher than $1000). They were receiving multiple alerts in a day on the 21st of May and prior but it suddenly stopped.", "tried": ["Toggled the alert from Live to Draft and back to Live. No other changes made in history", "Appears could be similar to FP-1788 bug", "Tried to spot check profiles but could not find an example where there was a 20min gap between checkout started and placed order and it was post 21st May"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3991689", "replies": 12, "has_files": false, "suggestion_summary": "Alicya found many recent skips in the flow evaluation due to 'No recipients', visible even on the day of the query. She suggested asking the customer to check their internal alert recipient details (consent status), and linked Linear bug FP-1817 as a likely cause if profiles show a green checkmark but still aren't receiving alerts."}, {"date": "2026-05-27", "requester": "Ash Arraiza", "ka": "PaDxZ9", "area": "Profiles - Bulk Suppression", "summary": "Customer cannot bulk suppress this segment.", "tried": ["Drafted a new segment within their account and found that only 99 profiles were suppressed in the last 90 days.", "User is an admin, so they should be able to suppress this segment.", "Checked Linear for any related tix."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3985709", "replies": 4, "has_files": false, "suggestion_summary": "Alicya checked Splunk and confirmed the bulk suppression job was accepted but not yet processed; she suggested waiting a few hours to see if profiles update, and if still not suppressed, to comment on the related Linear ticket ICM-599. Ash later confirmed profiles were still not suppressed after several hours and added the ticket to Linear."}, {"date": "2026-05-26", "requester": "Meher Gambhir", "ka": "Rmwb2z", "area": "K-Social Instagram Connection", "summary": "CX is trying to connect their Instagram account to the new Social feature, but the connection is not sticking.", "tried": ["Looks like data is in place but the segment isn't picking this up", "Tried didn't conditions which match the profile", "Waited some time after creating the segment to see if results were delayed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3983038", "replies": 4, "has_files": false, "suggestion_summary": "Alicya suggested verifying the customer has Admin/Editor/Full Control on their Facebook/Meta assets for the Instagram Business account, and asked Meher to collect screenshots of both Facebook Page Advanced Messaging settings (Connected Apps > Klaviyo-IG) and Instagram Website Permissions to confirm all required permissions are enabled. If the issue persists after confirming permissions, the recommendation was to link the similar ticket and escalate to BL."}, {"date": "2026-05-18", "requester": "Ash Arraiza", "ka": "V6acte", "area": "Metrics - Shopify Added to Cart", "summary": "Shopify Added to Cart is not firing on this customer's account.", "tried": ["Cleared cache and cookies", "Checked dev tools and fired from test profile"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3962610", "replies": 10, "has_files": false, "suggestion_summary": "Alicya tested on desktop and mobile but couldn't replicate the issue, and noted that incognito browsing should always trigger fresh cookie acceptance. She advised telling the customer the issue is likely on their end since it can't be replicated, and to escalate to the BL team."}, {"date": "2026-05-14", "requester": "Chris Yinfoo", "ka": "Y9yRLy", "area": "Custom Object", "summary": "Customer is trying to track a custom Started Checkout metric via GTM on their Shopify checkout page. However it is not firing.", "tried": ["Looked into the setup but not sure what is wrong"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3957250", "replies": 28, "has_files": false, "suggestion_summary": "Alicya created a test segment and noted it can take up to 20 minutes to populate per the KB. If it still doesn't work, she linked a known Linear issue (GPLAT-425) and advised asking the SA (Bella) to follow up directly in the Linear ticket to flag urgency, since the bug is in backlog with no ETA."}, {"date": "2026-05-12", "requester": "Chris Yinfoo", "ka": "VD2Qzs", "area": "Flow delays", "summary": "The customer has observed that emails are taking longer than 1-2mins to send from the flow (No delay step however maybe conditional split steps)", "tried": ["Checked flow settings", "Reviewed profile examples"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3954968", "replies": 7, "has_files": false, "suggestion_summary": "Alicya noted she had a similar delay issue that gradually improved, and that 3 minutes is still within the acceptable grace period per an existing Slack thread. She recommended sending the customer David's example response about expected flow send times."}, {"date": "2026-05-08", "requester": "Meher Gambhir", "ka": "LnETuM", "area": "Klaviyo Helpdesk", "summary": "The customer noticed a large drop in their segment growth which was out of the norm from their observations", "tried": ["Reviewed segment conditions", "Checked profile examples"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3952094", "replies": 2, "has_files": false, "suggestion_summary": "Alicya advised following the internal KB troubleshooting steps for 'Failed' vs 'Verified' status, and suggested temporarily changing the forwarding destination to reset the connection. If it still shows Failed after that, escalate to the BL team."}, {"date": "2026-05-04", "requester": "Ash Arraiza", "ka": "L2xQqw", "area": "Metrics - Custom Started Checkout", "summary": "Customer is trying to track a custom Started Checkout metric via GTM on their Shopify checkout page. However it is not firing.", "tried": ["Reviewed GTM setup", "Checked dev logs"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3949525", "replies": 4, "has_files": false, "suggestion_summary": "Alicya found an SA wiki page confirming custom Started Checkout events can work with GTM, and advised gathering more details from the customer (code snippets, exact setup) before escalating to the SE team — including the wiki doc in the escalation note for context."}, {"date": "2026-04-29", "requester": "Chris Yinfoo", "ka": "LWjHvK", "area": "Segment Growth", "summary": "The customer noticed a large drop in their segment growth which was out of the norm from their observations", "tried": ["Customer says that they have not made any recent changes to the segment", "When looking at profile examples we can see a mix of Unsubscribed and Never Subscribed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3951847", "replies": 12, "has_files": false, "suggestion_summary": "Alicya flagged that profiles going from 'Subscribed' to 'Never Subscribed' is unusual and may indicate a bug. She suggested escalating to Business Licensing for further investigation."}, {"date": "2026-04-24", "requester": "Ash Arraiza", "ka": "RfkAhB", "area": "Campaigns - Link Activity (possible related bug?)", "summary": "Logic is correct but block stays hidden even if condition is true.", "tried": ["Checked template conditions", "Reviewed profile properties"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3930031", "replies": 9, "has_files": false, "suggestion_summary": "Ellie confirmed based on the help article that UTM-tracked links and `?link=` links should be tracked separately. She suggested testing with the `?link=` parameter format to verify, and noted it did work when tested."}, {"date": "2026-04-21", "requester": "Ash Arraiza", "ka": "SchJmc", "area": "M2 - Hotlinking", "summary": "The custom has a Fulfilled Order flow email, where they would like for the dynamic content to display in a collage layout rather than the traditional a single column table.", "tried": ["The previous agent used the HTML block to produce what looks to be the customers want", "However, when you send the email as a preview, no images are actually retained", "Tried to update the code to get it to work however no joy so far"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3927296", "replies": 15, "has_files": false, "suggestion_summary": "Dmytro suggested pointing the customer to Cloudflare's official WAF custom rules guide for hotlink protection, and if their implementation is still causing issues, to contact Cloudflare support directly."}, {"date": "2026-04-20", "requester": "Ash Arraiza", "ka": "Je8TME", "area": "Dynamic Content", "summary": "The issue is that the data-privacy-deletion-jobs endpoint only works with a private Klaviyo API key, but the actual requests are still being sent with OAuth Bearer authentication, so they keep getting a 401 authentication_failed error.", "tried": ["Asked them to use a private Klaviyo API key as they were not before", "Confirmed their new request used a private one", "Checked request against the guide"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3924802", "replies": 2, "has_files": false, "suggestion_summary": "Alicya asked about display rules on the template sections. Liam found the section had display logic set on it that was preventing it from showing, which was the root cause."}, {"date": "2026-04-20", "requester": "Chris Yinfoo", "ka": "RxSiLW", "area": "Email Dynamic Content", "summary": "Running into timeout/server unavailable (10x, 503) for historical syncs", "tried": ["Reviewed error logs", "Attempted to re-sync"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3920198", "replies": 5, "has_files": false, "suggestion_summary": "Alicya noted the customer is using the correct `item.productVariantPlatformId` variable but the Shopify catalog may not support dynamic variant image lookups. She suggested trying the approach from the related method guide, and asking in #ask-apis if it's achievable."}, {"date": "2026-04-15", "requester": "Chris Yinfoo", "ka": "XNZdR9", "area": "Sign Up Forms", "summary": "Price of products within a static product block are not showing the correct compare at price when viewing as an Australian profile", "tried": ["Tested with AU profile", "Verified product block settings"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3914014", "replies": 8, "has_files": false, "suggestion_summary": "Alicya suggested not going too deep on the HTML troubleshooting — instead, refer the customer to Klaviyo's product block extension guide or use AI to help achieve the layout, with the vertical display guide as a fallback."}, {"date": "2026-04-15", "requester": "Ash Arraiza", "ka": "QPH4G3", "area": "API call showing error in response", "summary": "The customer is finding their product feed images showing up as broken when email received", "tried": ["Checked catalog images", "Reviewed product feed URLs"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3912407", "replies": 5, "has_files": false, "suggestion_summary": "Jeremy suggested the duplicate Shopify integration as a likely cause. Alicya investigated and found the profile was subscribed via Shopify login (triggered by Shopify's webhook), and that a second integration account also had this profile."}, {"date": "2026-04-10", "requester": "Meher Gambhir", "ka": "LtZARu", "area": "Integration - Prestashop v9.0.", "summary": "The customer is trying to understand the error report further, for the rows showing Email address is invalid (Email), which do not have an email address in the row", "tried": ["For the rows which do not have an email address, it does have a PhoneNumber is tied to the profile", "An email address doesn't need to be in the email row as long as they have unique phone number?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3917839", "replies": 10, "has_files": false, "suggestion_summary": "The data-privacy-deletion-jobs endpoint requires a private API key and not OAuth Bearer auth — though the customer switched to a private key the 401 persisted. Dmytro linked to a Slack thread (Apr 16) that appears to contain the follow-up resolution."}, {"date": "2026-04-10", "requester": "Ash Arraiza", "ka": "V9XDbW", "area": "Metric Triggered Flow", "summary": "The customer had some initial issues with the MailChimp integration and some advice has been given to assist with the remainder of the sync", "tried": ["We can disregard the WooComm details as that should be dealt with", "Read through the previous chats information", "Are we in the best position to help given all the context discussed so far?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3909623", "replies": 3, "has_files": false, "suggestion_summary": "Dmytro confirmed PrestaShop v9.0 is not currently supported by Klaviyo. He suggested posting in the docs channel to get the help article updated, and submitting a feature request for Presta 9 support."}, let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
</body>
</html>
