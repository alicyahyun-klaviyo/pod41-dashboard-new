<script>
const QUESTIONS=[{"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "• Customer sent multiple campaigns, however the recipient count does not match/is significantly lower than the expected count.", "tried": ["Followed this IKB", "RAST is not enabled", "Smart Sending turned off", "No Excluded segments or lists", "Reputation repair disabled", "No Audience filter applied since this is not an omnichannel campaign", "segment was not newly created.", "SS does not show any info on the dropped profiles (as far as I can see), may need help with Splunk logs."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4082512", "replies": 34, "has_files": true, "suggestion_summary": "Root cause was that the segment definition was changed (grew from ~1.6k to 27k+ profiles) after the campaign was scheduled; since RAST was disabled, the campaign only sent to the segment snapshot taken at schedule time. Recommended verifying timing via the segment growth report and account activity logs, and enabling RAST going forward if audience updates made after scheduling should be captured in the send.", "standardized_area": "Campaigns"}, {"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow  Debugger - https://www.klaviyo.com/staff/flows/debug/flows2/canvas?fesEndDate=2026-07-15&fesSta[…]2026-06-30&flowId=RDyjaJ&profileId=01KWCK2XW4Y5EMF3ESJC4PZ4ZC", "tried": ["No recent changes to flow", "No filters to trigger or emails", "Fairly straightforward setup", "Debugger suggests its stuck?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4070534", "replies": 9, "has_files": true, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account does have the custom action step The Nile AU (VjxEiY), however their other account The Nile NZ (RiJWfQ) does not  They are under the same family billing", "tried": ["Between the two accounts they have over 400k active profiles", "Came across this, which looks similar and slack thread", "What is the best way to check an account is on Flows 2 and if so, can I give the same explanation as Ellie in the case or should I ask in the slack first?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4071307", "replies": 13, "has_files": true, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "• Onsite JS crashes on every page load on mreatwell.com with the Error: undefined reading 'customerHubOnboarded'. • Comes from build-preview/commit-55449364d6d533811c1ff6d9c2ca2e8339925a83/atlas.js. • Customer Hub is not enabled on this account. • Customer's HAR shows fast.a.klaviyo.com/atlas/api/public/settings/Vdbaf7 returns 404.", "tried": ["this customer is requesting a lot of information that I'm not sure how to source.", "I've already told the customer the `build-preview/commit-{hash}` path is part of our standard rolling deployment process, not a beta or preview environment.", "ty team :sadge-sip:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": true, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-24", "requester": "Chris Yinfoo", "ka": "XEPuyw", "area": "Integrations", "summary": "The customer is seeing the site  setup for their integration however they no longer use this and their site is now   Is it possible to see if they did have the .co.uk site there at some point?", "tried": ["Noticed the customer reaching out did make some changes and asked for clarification"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4032066", "replies": 21, "has_files": true, "suggestion_summary": "Alicya suggested using PostmanLite system_status to check the WooCommerce integration URL, which appeared to be pointing to the old .wp1.sh staging site rather than the new .co.uk domain. The recommendation was to advise the customer about the 526 error and suggest removing and re-integrating to fix the URL mismatch.", "standardized_area": "Integrations"}, {"date": "2026-06-23", "requester": "Chris Yinfoo", "ka": "UuFRx3", "area": "Flows", "summary": "The third-party connector Funnel is encountering repeated 500 Internal Server Error responses from Klaviyo when attempting to access GET /api/flows/QYZ4DT/flow-actions/", "tried": ["Flow does exist", "Can see a similar request for a different flow which did work (See screenshot)", "Did come across this which has similar -", "Anything else to check here?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4035222", "replies": 8, "has_files": true, "suggestion_summary": "Alicya identified the 500 errors from Funnel's GET /api/flows/{id}/flow-actions/ are tied to a known bug (FLOW-660) where emails not being set up causes the endpoint to return 500 instead of returning other flow actions. Chris was advised to comment on the Linear ticket that this customer is also affected.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Chris Yinfoo", "ka": "Rn572y", "area": "Flows", "summary": "It appears 'Viewed Product' log is appearing twice for once instance of viewing the item on their site", "tried": ["The two instances would therefore appear in their flow setup when they only expect one", "Confirmed with the customer, they only recall setting up the integration via Klaviyo and have never encountered this before with other brands", "In this previous case it was deemed that there was two different scripts and the customer was instructed to remove the duplicate script", "However, the customer today mentioned \"I'm concerned that removing it may cause complications or affect other functionalities within the store.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4020964", "replies": 11, "has_files": true, "suggestion_summary": "Alicya identified the duplicate 'Viewed Product' events as coming from two sources — one client-side via Klaviyo and one server-side via a third-party app (WeTracked). She suggested the customer contact the third-party app to remove their tracking script if they want to eliminate the duplicate events from their flow.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Ash Arraiza", "ka": "UrbgMW", "area": "Templates", "summary": "• Previewing the template as your own profile does not show dynamic content. Example: • Person A previews the template with Person A's email. • Person A does not see any dynamic content. • Person B previews the same template as Person A • Person B can see Person A's dynamic content", "tried": ["Had the customer clear cache and cookies from all time", "Got them to log out and log back in", "Got them to try in a private browser", "Got them to try in a different browser (edge and chrome)", "verified we're working in the same account and same template", "Cloned the template and still seeing the issue", "User is an Admin", "I've observed and clarified with the customer, that in the loom, the customer is not able to see the \"custom properties\" section in the preview and test page only when previewing with her own test profile.", "I don't believe that's expected behaviour, however would like to clarify before potentially esco'ing this to :garfield_b: :garfield_l:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001172", "replies": 23, "has_files": true, "suggestion_summary": "Alicya explained that simply seeing their name pre-filled in the preview pane doesn't mean their profile is selected — the user needs to actively retype their email address and select it from the dropdown. She recommended Ash create a Loom to demonstrate the correct preview steps to the customer.", "standardized_area": "Templates"}, {"date": "2026-06-10", "requester": "Meher Gambhir", "ka": "an79Sm", "area": "Campaigns", "summary": "CX is concerned the footer banner in many of their emails is rendering much wider than expected on desktop in Gmail, Chrome for test sends. It appears aligned correctly in preview.", "tried": ["CX said their emails often clip in Gmail, but they have not normally had footer issues from that before, so clipping does not seem to fully explain this case.", "I checked the footer table/ image sizing. The image cell had a 400px max width, but reducing that to 200 did not resolve the issue on CX end.", "Ran a test with my test gmail acc. Both through preview and test option and actually sending a clone of the campaign to myself. Could not replicate issue on my end.", "CX plans to send campaign out in around 6 hours from now, so wanted to confirm if there is anything else I can do for them to try fix this."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4012844", "replies": 15, "has_files": true, "suggestion_summary": "Alicya suggested the issue could be Gmail clipping or related to the new template editor migration, and advised that since the issue could not be replicated on their end, Meher should reply using the Gmail clipping angle.", "standardized_area": "Campaigns"}, {"date": "2026-06-09", "requester": "Ash Arraiza", "ka": "KwJYB2", "area": "Campaigns", "summary": "• Customer created an A/B test campaign, however no one received the variation B. • The A/B test results tab does not show variation B at all.", "tried": ["Created a segment for the customer to use, however they are expecting this to be closer to 6k profiles.", "When I clone the campaign, it shows 21k estimated recipients. So I'm unsure where the missing 6k profiles went.", "there are only 4 skipped profiles and 27 bounced profiles in recipient activity", "verified with customer that the campaigns were not made recently, and she's been using them consistently.", "Creating a segment for profiles who have received variation B yields 0 profiles.", "Creating a segment for profiles who have received variation A yields 14551 profiles.", "Basically, I'm unsure if this is related to the incident this morning.", "I've already linked the bug for the A/B test UI issue."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4010450", "replies": 11, "has_files": true, "suggestion_summary": "Alicya checked the Staffside campaign view and confirmed variation B was never sent, then recommended escalating to Business Licensing as it was unclear whether the issue stemmed from a platform incident or the linked UI bug (EXP-392).", "standardized_area": "Campaigns"}, {"date": "2026-06-04", "requester": "Ash Arraiza", "ka": "tNPZ9N", "area": "Lists & Segments", "summary": "• cloning segments between accounts is successful, however the segment conditions are not copied.", "tried": ["ensured user is an Admin in all accounts.", "ensured the matching custom properties do exist in the UK account", "checked linear for any known bugs.", "checked/followed this guide:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001556", "replies": 8, "has_files": true, "suggestion_summary": "Alicya clarified that 'contains text' conditions are not necessarily advanced operators, and recommended escalating to Business Licensing for confirmation while also requesting an update to the internal KB article on cross-account segment cloning.", "standardized_area": "Lists & Segments"}, {"date": "2026-06-02", "requester": "Ash Arraiza", "ka": "QCN2d7", "area": "Catalogs & Feeds", "summary": "• Back in stock reports tab loads indefinitely.", "tried": ["Did not replicate this issue in 2 test accounts", "*Cecilia's Basecamp* (XDLpgg) paid account, *Ash A Test Account* (UvCpx3) free account", "User attempting the action is an Admin (kate.leveille@bycharlotte.com.au)", "Re-attempted from incognito window.", "Can I esco to BL :eyes2:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3995864", "replies": 17, "has_files": true, "suggestion_summary": "Alicya confirmed the same 500 internal server error in the customer's account (Back in Stock Reports tab) but could not replicate it in test accounts. She recommended escalating to Business Licensing.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-06-02", "requester": "Meher Gambhir", "ka": "WKMDP9", "area": "Flows", "summary": "Customer states they have not received any internal alert notifications from this flow since 21st May. Alerts should be sending if there has been more than 20mins since since checkout started (with amount higher than $1000). They were receiving multiple alerts in a day on the 21st of May and prior but it suddenly stopped.", "tried": ["Toggled the alert from Live to Draft and back to Live. No other changes made in history", "Appears could be similar to FP-1788 bug", "Tried to spot check profiles but could not find an example where there was a 20min gap between checkout started and placed order and it was post 21st May"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3991689", "replies": 12, "has_files": true, "suggestion_summary": "Alicya found many recent skips in the flow evaluation due to 'No recipients', visible even on the day of the query. She suggested asking the customer to check their internal alert recipient details (consent status), and linked Linear bug FP-1817 as a likely cause if profiles show a green checkmark but still aren't receiving alerts.", "standardized_area": "Flows"}, {"date": "2026-05-27", "requester": "Ash Arraiza", "ka": "PaDxZ9", "area": "Accounts", "summary": "• Customer cannot bulk suppress this segment.", "tried": ["Drafted a new segment within their account and found that only 99 profiles were suppressed in the last 90 days.", "User is an admin, so they should be able to suppress this segment.", "Checked Linear for any related tix."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3985709", "replies": 4, "has_files": true, "suggestion_summary": "Alicya checked Splunk and confirmed the bulk suppression job was accepted but not yet processed; she suggested waiting a few hours to see if profiles update, and if still not suppressed, to comment on the related Linear ticket ICM-599. Ash later confirmed profiles were still not suppressed after several hours and added the ticket to Linear.", "standardized_area": "Accounts"}, {"date": "2026-05-26", "requester": "Meher Gambhir", "ka": "Rmwb2z", "area": "K-Social", "summary": "CX is trying to connect their Instagram account to the new Social feature, but the connection is not sticking.", "tried": ["Asked CX to follow the reconnect flow from the Klaviyo error message. They completed it, including the prompt saying they had already connected to Klaviyo and could continue allowing access, but the error remained.", "Verified the Instagram permissions and they look all good against our guide.", "Checked Developer Tools logs and found no related API errors. I also found a similar ticket where Cecilia saw Instagram API Error 10: ry using strip_html/truncate liquid", "Tested in multiple browsers, clicking Save gives \"Network Error – Request failed with status code 500\", changes not saved"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3780453", "replies": 7, "has_files": false, "suggestion_summary": "Cecilia corrected the Jinja template syntax, explained that `&nbsp;` is a space encoding (suggesting a Django filter to strip it), and recommended always verifying the event property name using the actual event in Klaviyo.", "standardized_area": "Flows"}, {"date": "2026-02-26", "requester": "Meher Gambhir", "ka": "VwwAGD", "area": "Lists & Segments", "summary": "Customer reports a segment used as exclusion in campaigns has disappeared, no one on team deleted it. Restore Deleted Groups tool shows no deleted groups in last 90 days, but backend view shows segment as Inactive, created Oct 30 2025, deleted Nov 5 2025.", "tried": ["Searched Lists & Segments, no results, no Deleted view in UI", "Opened Restore Deleted Groups staff tool, no deleted groups shown", "Checked backend view, segment exists marked Inactive", "Verified segment was used in Excluded lists in campaigns within last 90 days"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3788822", "replies": 8, "has_files": false, "suggestion_summary": "Alicya noted that edit access to the account is required to view the inactive segment — the customer should check if the profile appears there. Liam flagged a potentially related Jeremy ticket on the same issue.", "standardized_area": "Lists & Segments"}, {"date": "2026-02-24", "requester": "Ash Arraiza", "ka": "TdFebw", "area": "Accounts", "summary": "• Customer is stuck in a loop where the page continuously asks to login to continue after session expiration.", "tried": ["got customer to clear cache and cookies", "no login errors appearing on the back end, account not disabled/suspended", "Using current Chrome version and macOS Monterey", "confirmed doesn't log in from other device or share accounts"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3749831", "replies": 17, "has_files": false, "suggestion_summary": "Alicya suggested clearing cookies/cache for at least 7 days and having the customer log into Klaviyo directly rather than via Shopify. Stephanie provided context on the 'Session Expired' error behaviour.", "standardized_area": "Accounts"}, {"date": "2026-02-23", "requester": "Meher Gambhir", "ka": "V97Ddi", "area": "Compliance", "summary": "Customer trying to complete AU branded sender ID registration, after submitting form redirected to Google Forms page showing \"Something went wrong. Please try again.\" Happens across multiple logins/devices, AU sender ID stays Incomplete.", "tried": ["Confirmed AU branded sender ID Incomplete under Settings", "Guided customer to resubmit, still shows error", "Confirmed tried multiple logins on laptop and phone, same error", "Asked to verify URL/fields/phone formats and retry on different network", "Reviewed HC and IKB, found no additional frontline fixes"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3777579", "replies": 17, "has_files": false, "suggestion_summary": "Ash explained that 'Incomplete' status on the SMS carrier form is expected — it stays that way until the carrier starts reviewing (Klaviyo can't update it). She also suggested escalating to the SMS Delivery & Compliance team.", "standardized_area": "Compliance"}, {"date": "2026-02-17", "requester": "Ash Arraiza", "ka": "Swtn9V", "area": "Compliance", "summary": "• Customer has a paraphernalia (weed) store and is being rejected for US and Canadian TFN. • Unsure which team to send to Compliance, D&C or SMS Activations.", "tried": ["Followed IKB but unclear which team this needs to go to, would like to clarify before escalating."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3765499", "replies": 4, "has_files": false, "suggestion_summary": "Alicya identified this as a Compliance team escalation, as the SHAFT policy rejection for cannabis-related businesses falls under their purview.", "standardized_area": "Compliance"}, {"date": "2026-02-17", "requester": "Chris Yinfoo", "ka": "P47R2f", "area": "Flows", "summary": "Customer updated ecomm store from Woo to Shopify. Price drop flow cloned from original still shows Woo products in report.", "tried": ["Clicking Price drop report link, still see woo products", "Tried updating timeframe and saving, still present", "Woo disabled as of 17th Feb, Shopify active", "Asking how to confirm it will reference Shopify going forward"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3764988", "replies": 12, "has_files": false, "suggestion_summary": "Alicya found the account was still mapped to the old BigCommerce integration, causing the Price Drop flow to behave unexpectedly. She recommended removing the BigCommerce integration, purging the catalog, and resyncing solely from Shopify.", "standardized_area": "Flows"}, {"date": "2026-02-13", "requester": "Ash Arraiza", "ka": "UksXRm", "area": "Campaigns", "summary": "• Cx cannot clone campaign to another account (from AU to NZ accounts)", "tried": ["Confirmed customer is Admin on both accounts", "Cleared cache, tried incognito", "page gets to loading screen then stays frozen for 1+ hours", "tried adding list into recipients with/without profile", "cloned campaign to try cloning, issue persists"], "ticket_url": "", "replies": 2, "has_files": false, "suggestion_summary": "The campaign clone freeze between AU and NZ accounts resolved itself without intervention — Ash confirmed it fixed with patience and linked related bug reports BUGPORT-10542 and BUGPORT-10575 for reference.", "standardized_area": "Campaigns"}, {"date": "2026-02-11", "requester": "Chris Yinfoo", "ka": "UxmzeY", "area": "Integrations", "summary": "Historical sync appears stalled at 98%.", "tried": ["Noticed a 500 error initially, supplied information", "Looks to have progressed but now close to 98% , "tried": ["Asked for more info about the API call being made, customer provided details", "Asking if this is usual for IP to be blocked and what can be done"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3688264", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed this is a standard IP whitelisting issue and directed the customer to follow the relevant steps.", "standardized_area": "Integrations"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "Wqcbfr", "area": "Catalogs & Feeds", "summary": "Customer updated inventory for an item, wondering why BIS report still says queued for some products with the same name.", "tried": ["Looked at BIS report examples, SKU ID different from Shopify ID", "Found customer has a custom catalog sync too, asked if aware of it", "Customer responded unaware of custom catalog, asked if API catalog can be disconnected"], "ticket_url": "", "replies": 24, "has_files": false, "suggestion_summary": "Alicya walked through the options: either fix the custom catalog feed with developer help, or delete it entirely and resync using the Shopify catalog (noting this would affect Back-in-Stock). She recommended clarifying with the customer which path they prefer.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "X6M5Pn", "area": "Catalogs & Feeds", "summary": "• Localised product feed links", "tried": ["A lot of back and forth already, needs advice on next best approach"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3642269", "replies": 16, "has_files": false, "suggestion_summary": "Alicya identified that the product URL in the customer's custom catalog feed was syncing with the incorrect URL, and recommended they fix it in their feed. She also suggested looping in the CSM to alert them to the situation.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "sqUwG2", "area": "Integrations", "summary": "Customer's Shopify Onsite Tracking says 'Turned Off', but Shopify shows message that it's Activated.", "tried": ["Used Get App Embed Metafields, confirmed actually false", "Considering Reset App Embed Metafields per IKB guide"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3659792", "replies": 2, "has_files": false, "suggestion_summary": "Alicya suggested following the existing guide carefully and making sure the Save button is clicked, then asking the customer for a screen recording if the issue persists.", "standardized_area": "Integrations"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "3670894", "area": "Integrations", "summary": "Custom website's discount codes all have same expiry date. For sunset flow needs codes to be evergreen with varying time periods. Asking if Klaviyo can tell website via API how many codes needed and duration.", "tried": ["Still trying to wrap head around their situation"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3670894", "replies": 15, "has_files": false, "suggestion_summary": "Alicya explained that coupon expiry must be set as a fixed date (not a relative period like '14 days'), but leaving it blank defaults to 1-year expiry from when the profile enters the flow. She suggested asking in #ask-apis about adding a relative expiry option.", "standardized_area": "Integrations"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
