<title>Pod 41 · Questions Dashboard</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; font-size: 14px; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .channel-badge { background: #4A154B; color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; letter-spacing: 0.3px; white-space: nowrap; }
  header h1 { font-size: 16px; font-weight: 700; color: #1d1d1f; }
  .last-updated { font-size: 11px; color: #8e8e93; margin-top: 2px; }
  .main { padding: 20px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 14px 16px; border: 1px solid #e5e5ea; }
  .stat-card .stat-label { font-size: 11px; font-weight: 500; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; line-height: 1; color: #1d1d1f; }
  .stat-card.purple .stat-value { color: #4A154B; }
  .stat-card.green  .stat-value { color: #34c759; }
  .stat-card.orange .stat-value { color: #ff9500; }
  .stat-card.blue   .stat-value { color: #007aff; }
  .filter-bar { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap input { width: 100%; border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px 7px 30px; font-size: 13px; color: #1d1d1f; outline: none; transition: border-color 0.15s; }
  .search-wrap input:focus { border-color: #4A154B; }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #8e8e93; font-size: 13px; }
  .filter-select { border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #1d1d1f; background: #fff; outline: none; cursor: pointer; min-width: 140px; }
  .filter-select:focus { border-color: #4A154B; }
  .filter-count { font-size: 12px; color: #8e8e93; white-space: nowrap; }
  .table-wrap { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #f5f5f7; border-bottom: 1px solid #e5e5ea; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: #4A154B; }
  tbody tr { border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf5fb; }
  tbody tr.expanded-row { background: #faf5fb; }
  td { padding: 11px 14px; vertical-align: top; }
  .td-date { color: #8e8e93; font-size: 12px; white-space: nowrap; }
  .td-requester { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .td-ka { font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: #4A154B; white-space: nowrap; }
  .td-summary { font-size: 13px; color: #3a3a3c; max-width: 320px; line-height: 1.4; }
  .td-summary-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ticket-link { color: #4A154B; text-decoration: none; font-size: 12px; font-weight: 500; }
  .ticket-link:hover { text-decoration: underline; }
  .area-tag { display: inline-block; background: #f0e8f1; color: #4A154B; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 500; max-width: 180px; word-break: break-word; }
  .expand-row td { padding: 0; background: #fdf8fe; border-bottom: 2px solid #e5d6e8; }
  .expand-content { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .expand-section h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #4A154B; margin-bottom: 6px; }
  .expand-section p { font-size: 13px; color: #3a3a3c; line-height: 1.5; }
  .expand-section p + p { margin-top: 3px; }
  .expand-section ul { padding-left: 16px; }
  .expand-section li { font-size: 13px; color: #3a3a3c; line-height: 1.5; margin-bottom: 4px; }
  .expand-full { grid-column: 1 / -1; }
  .expand-suggestion-box { grid-column: 1 / -1; background: #f0faf4; border: 1.5px solid #34c759; border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .expand-suggestion-box .suggestion-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
  .expand-suggestion-box .suggestion-body h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #1a7f37; margin-bottom: 5px; }
  .expand-suggestion-box .suggestion-body p { font-size: 13px; color: #1d3826; line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px; color: #8e8e93; font-size: 13px; }
  .no-suggestions { color: #8e8e93; font-size: 12px; font-style: italic; }
  .chart-section { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .chart-section h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #8e8e93; margin-bottom: 2px; width: 100%; }
  .donut-wrap { position: relative; width: 160px; height: 160px; flex-shrink: 0; }
  .donut-chart { width: 160px; height: 160px; border-radius: 50%; }
  .donut-hole { position: absolute; top: 20px; left: 20px; width: 120px; height: 120px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-hole .donut-total { font-size: 22px; font-weight: 700; color: #1d1d1f; line-height: 1; }
  .donut-hole .donut-total-label { font-size: 10px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
  .donut-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; flex: 1; min-width: 240px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #3a3a3c; cursor: pointer; padding: 3px 6px; border-radius: 6px; transition: background 0.1s; }
  .legend-item:hover { background: #f5f5f7; }
  .legend-item.active { background: #f0e8f1; font-weight: 600; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { font-weight: 700; color: #1d1d1f; }
  .legend-pct { color: #8e8e93; font-size: 11px; }
</style>

<script>
const QUESTIONS=[{"date": "2026-10-09", "requester": "Ash Arraiza", "ka": "Y8WinC", "area": "Integrations", "summary": "• Salesforce CRM • Customer’s Salesforce opportunity (stage “Working”) is not syncing into Klaviyo.", "tried": ["Mapped email field Email__c is empty; email sits in Owner_Email__c."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4223378", "replies": 25, "has_files": false, "suggestion_summary": "Alicya and Ash agreed this likely needs escalation to SE since the KB doesn't cover it; Alicya also suggested (from Glean, unverified) a Salesforce Formula → Text field such as BLANKVALUE(Email__c, Owner_Email__c) so one mapped field works whether the email is in Email__c or Owner_Email__c.", "standardized_area": "Integrations"}, {"date": "2026-10-08", "requester": "Ash Arraiza", "ka": "U22HGZ", "area": "Integrations", "summary": "• Shopify - Klaviyo says the app embed is turned off, but it is on in the customer's Shopify theme.", "tried": ["Followed IKB guide, reset app embed metafields; Staffside shows old theme ID."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4223308", "replies": 6, "has_files": false, "suggestion_summary": "Advised escalating since manually updating the stale theme ID in Staffside isn't documented and should be automatic; also comment on the similar Linear (IEC-1036). A new Linear, IEC-1543, was created for the same Shopify app embed issue.", "standardized_area": "Integrations"}, {"date": "2026-10-06", "requester": "Ash Arraiza", "ka": "UiVFQf", "area": "Campaigns", "summary": "Customer's SMS campaigns skipped almost all recipients for \"Quiet Hours.\" Both campaigns were sent before Quiet Hours started.", "tried": ["Account uses \"Eastern time zone\" quiet hours setting, not \"Profile location.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4208646", "replies": 13, "has_files": false, "suggestion_summary": "Thread found no clear cause: the customer's 9pm quiet-hours setting appeared to be obeyed alongside the default 8pm smart-sending window, which still doesn't explain why 8:30pm and 8:57pm sends were skipped. Quiet hours were updated on 16 Sept, and the case was escalated.", "standardized_area": "Campaigns"}, {"date": "2026-09-30", "requester": "Chris Yinfoo", "ka": "UhkRaC", "area": "Integrations", "summary": "Wix Ecommerce 'Abandoned Checkout' metric does not work", "tried": ["Anything else to check through before escalation?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4200887", "replies": 11, "has_files": false, "suggestion_summary": "The team suspected the issue stemmed from the customer using a customized Wix checkout rather than Wix's default checkout, since the KB's Splunk check only covers the default flow; advised confirming with the customer whether they use a customized checkout before escalating to SE, and noted the default checkout may be the only supported option.", "standardized_area": "Integrations"}, {"date": "2026-09-29", "requester": "Ash Arraiza", "ka": "Rj7bYZ", "area": "Lists & Segments", "summary": "• Shopify tags are syncing, but many are unable to be used as segment conditions or filters.", "tried": ["resynced profile; tag appears in SS."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4204856", "replies": 55, "has_files": false, "suggestion_summary": "The team traced it to Klaviyo's 512-value display limit for property dropdowns (linked to bug PROPLAT-491) — the Shopify tag values existed on the profile but wouldn't populate in the segment/flow filter dropdown; typing the exact tag text (contains) worked for the segment condition, though the flow trigger profile filter still didn't show it as an option.", "standardized_area": "Lists & Segments"}, {"date": "2026-09-25", "requester": "Meher Gambhir", "ka": "W4AQdY", "area": "Flows", "summary": "Acc is showing £0 attributed revenue across flows and campaigns for September 16–23, 2026, despite continued Shopify placed order events and normal email activity.", "tried": ["CX recently changed flow logic and moved templates to Custom HTML."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4196873", "replies": 37, "has_files": false, "suggestion_summary": "Alicya and Meher found the affected profiles all placed their order before opening or clicking the email, so they didn't meet Klaviyo's attribution rules despite the Placed Order events firing; separately, a click-tracking-off HTML snippet that had appeared in one template seemed to have resolved itself (likely a stale version), and they advised the customer to have their developer double check the custom HTML isn't malformed.", "standardized_area": "Flows"}, {"date": "2026-09-24", "requester": "Meher Gambhir", "ka": "TBT56L", "area": "Campaigns", "summary": "The email template appears shifted to the left in mobile view, with an uneven background strip visible along the right side.", "tried": ["Confirmed template width 600 px, mobile optimization on, reproduced in Gmail mobile. Looks buggy to me"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4196968", "replies": 1, "has_files": false, "suggestion_summary": "Discussed in the office - turning off mobile optimization on the template resolved the rendering issue better than keeping it enabled.", "standardized_area": "Campaigns"}, {"date": "2026-09-23", "requester": "Chris Yinfoo", "ka": "VpVCCs", "area": "Catalogs & Feeds", "summary": "Customer has three Salesforce Commerce Cloud catalog items for the same product, all sharing the same Item ID and SKU. Price Drop email defaults to the Default catalog item instead of polk_us.", "tried": ["Customer was told updating the cartridge would allow Klaviyo to differentiate catalogs."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4184010", "replies": 10, "has_files": false, "suggestion_summary": "Alicya explained that Price Drop flows can only source pricing from one catalog and don't pull from the live website; for SFCC, catalog-triggered flows need version 25.4.0+ so a catalog identifier (external id + store id) can distinguish items sharing the same ID across catalogs. She found the correct price was actually set on the variant product rather than the parent product, and suggested asking the customer what that variant product is.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-22", "requester": "Chris Yinfoo", "ka": "SewLA5", "area": "Lists & Segments", "summary": "The customer wants to know the origin of a custom property found on profiles page", "tried": ["Checked dev logs; segment key does not appear."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4188820", "replies": 12, "has_files": false, "suggestion_summary": "Chris found the custom property was added via an API call that touched only profile attributes with no visible integration in the dev logs, likely from an automation using a private API key; Alicya recommended checking with the SE team to trace where it originated.", "standardized_area": "Lists & Segments"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "RhX2C9", "area": "Integrations", "summary": "The Shopify Checkout URL does not load checkout page but rather goes to the home page", "tried": ["No Placed Order actioned; pasted URL directly."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189545", "replies": 15, "has_files": false, "suggestion_summary": "Alicya explained this is a known issue where Shopify checkout URLs take about 15 minutes to sync to Klaviyo, so testing immediately after the event shows the homepage instead of the checkout page; she pointed Chris to the internal KB troubleshooting guide for checkout URL redirect issues.", "standardized_area": "Integrations"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "S9Qc5f", "area": "Flows", "summary": "The customer is noticing a number of recipients skipped in a flow due to 'Unable to Send Email'", "tried": ["Debugger"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189533", "replies": 21, "has_files": false, "suggestion_summary": "Chris identified two similar Linear bugs about flow emails skipped due to 'Unable to Send Email'; the team concluded the closest match is FP-3896 (Unable to Send Email due to UNKNOWN_SEND_EXCEPTION).", "standardized_area": "Flows"}, {"date": "2026-09-14", "requester": "Chris Yinfoo", "ka": "V458YQ", "area": "Flows", "summary": "Customer noticed lack of flow emails sending", "tried": ["Debugger shows nothing; no skipped emails."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4174764", "replies": 6, "has_files": false, "suggestion_summary": "Alicya ran Chronosphere queries and found the profiles never entered the date-triggered flow at all (not just delayed), matching a known bug (FP-3599: profiles failing to enter date-triggered flow); she recommended escalating to Backline.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "Vbxg9f", "area": "Flows", "summary": "Flow webhook activity showing many skipped", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya identified the webhook was a non-Klaviyo (customer-owned) webhook, suggesting the skipped activity was likely due to an issue on the receiving end, and recommended checking in with the webhook owner directly.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "ThEqHV", "area": "Sign Up Forms", "summary": "Customer has one Klaviyo parent account with multiple child accounts. WooCommerce child-account setup transitioned to BigCommerce Multi-Storefront; unable to configure flows; sign up form of one brand showing on another brand's site.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Confirmed the JavaScript/integration setup was correct on the parent account, and identified that the customer's sign-up form was missing the targeting needed to limit the Singer form to the Singer site; Alicya and Chris planned to huddle to walk through the full BigCommerce multi-storefront migration (forms, flows, list structure) together.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "PDQku2", "area": "Catalogs & Feeds", "summary": "Unable to save new product feed; existing product feed not available to select when adding a product block into email", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Found a 403 error in the network tab when creating a new product feed and adding a product block to the campaign, which appeared to be unexpected behaviour; Alicya recommended escalating the issue to Backline.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-08", "requester": "Ash Arraiza", "ka": "UJFV9p", "area": "Flows", "summary": "Profiles are processed through the conditional split, but then they aren't being queued for the message afterwards.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya found the split action shared the same action ID as another block, which didn't match any known flow bugs, so she recommended escalating to have engineering create a new bug ticket.", "standardized_area": "Flows"}, {"date": "2026-09-08", "requester": "Meher Gambhir", "ka": "KSMVzB", "area": "Email Deliverability", "summary": "Legitimate profiles are being suppressed by BOT_PROTECTION through consent webhooks from unrelated accounts", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed the profiles were suppressed by subscription protection (visible via Splunk calls from multiple account IDs) and, since the customer confirmed they were legitimate, advised linking the known ICM-1282 bot-protection bug ticket.", "standardized_area": "Email Deliverability"}, {"date": "2026-09-08", "requester": "Chris Yinfoo", "ka": "VyhTNh", "area": "Integrations", "summary": "Prestashop integration is enabled however the customer is not seeing added to cart events", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya found no Klaviyo JS injected on the site at all and pointed to the PrestaShop troubleshooting guide; since the previous agent had already followed it without success, she advised escalating.", "standardized_area": "Integrations"}, {"date": "2026-09-03", "requester": "Ash Arraiza", "ka": "XsDESE", "area": "Templates", "summary": "Smart translation for Swedish and Swiss High German changes complete images in the template during a live send.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya explained that the web view doesn't always reflect what was actually delivered, and pointed Ash to the Staffside template-rendering-artifacts tool (or having the customer forward the actual received email) to confirm which image version was truly sent; since the staff tool failed to load, the plan was to ask the customer to forward screenshots of the received email instead.", "standardized_area": "Templates"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "<https://klaviyo.zendesk.com/agent/tickets/4151819>", "area": "Sign Up Forms", "summary": "The customer is running into HTTP 503 errors when trying to sign up to their pop up form", "tried": ["tried"], "ticket_url": "", "replies": 5, "has_files": false, "suggestion_summary": "Alicya traced the reported 503s to the client/profiles (identify) and onsite/track-analytics calls rather than the client/subscriptions (subscribe) endpoint, and since the team couldn't reproduce the issue and the customer had no screenshot or HAR file confirming the failure, they escalated the ticket to Backline as a sign-up form issue.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "WZcvhJ", "area": "Sign Up Forms", "summary": "Customer is unable to publish their form (There are stats which means it was possible previously)", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4150949", "replies": 5, "has_files": false, "suggestion_summary": "Alicya and Chris found the form also couldn't be cloned and had a buggy image-block deletion, pointing to a broader form-editor bug rather than a config issue, so they escalated to Backline.", "standardized_area": "Sign Up Forms"}, {"date": "2026-08-31", "requester": "Chris Yinfoo", "ka": "XNCrpa", "area": "Catalogs & Feeds", "summary": "The customer has Shopify markets enabled and wants to confirm how to have the correct product URL displayed in their dynamic product feed", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151091", "replies": 5, "has_files": false, "suggestion_summary": "Confirmed the localized product URL/pricing in the dynamic product feed comes from the Shopify Markets integration itself — Smart Translations is not required, since the customer's product titles were already translated separately.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-08-25", "requester": "Ash Arraiza", "ka": "Yr3S6i", "area": "K-Service", "summary": "Helpdesk // Gorgias. Inbound SMS messages sync to Gorgias, but replies sent from Gorgias are not delivered from the Klaviyo toll-free number.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4141388", "replies": 5, "has_files": false, "suggestion_summary": "Inbound SMS replies from Gorgias were not being routed back through Klaviyo's toll-free number to customers even though inbound messages synced correctly; the behavior matched a previously-cancelled Linear ticket (VEX-269) describing the same issue, and the thread ended without a confirmed fix.", "standardized_area": "K-Service"}, {"date": "2026-08-17", "requester": "Ash Arraiza", "ka": "WeEnvL", "area": "Accounts", "summary": "Active profile count is mismatched against the billing page and profile page.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4128222", "replies": 5, "has_files": false, "suggestion_summary": "Team confirmed this is expected: the billing page's active profile count lags behind actual suppressions by up to a few hours, especially after a large suppression. Advised directing the customer to check the Profiles tab instead of the billing page while it catches up.", "standardized_area": "Accounts"}, {"date": "2026-08-14", "requester": "Ash Arraiza", "ka": "SyikaT", "area": "Templates", "summary": "The Instagram logo in the social links block is being replaced by 3 images in the connected instagram account, in live preview sends.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4124848", "replies": 5, "has_files": false, "suggestion_summary": "Alicya and Ash could not replicate the issue themselves, but since two different customers reported the same intermittent Instagram logo replacement bug, they agreed to escalate to Backline and linked a similar Linear issue (EDIT-1347: Received Image within header of a campaign send instead of Text).", "standardized_area": "Templates"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "U8hAjh", "area": "Flows", "summary": "The customer is trying to trigger back in stock flow (BigCommerce). There looks to be issues with how inventory is checked.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Confirmed the SKU's stock had not been resynced from BigCommerce since it went out of stock, matching a known Linear bug (IEC-987) where BigCommerce webhook-triggered variant syncs can return stale cached inventory. Advised escalating to the SE team since it appears linked to an existing ZD ticket on the same issue.", "standardized_area": "Flows"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "VJBf7Z", "area": "Flows", "summary": "The customer has a webhook action; some profiles did not complete (status QUEUED_FROM_MANUAL).", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "QUEUED_FROM_MANUAL means the profile was released from manual review into the sending queue, but that doesn't confirm the message actually sent. The profile had been stuck in that state since Friday with nothing recorded on the webhook side, so this was identified as a likely flow bug and escalated to Backline.", "standardized_area": "Flows"}, {"date": "2026-08-04", "requester": "Ash Arraiza", "ka": "Vh5xLA", "area": "Templates", "summary": "The template preview hides the last 2 blocks in the template editor.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed the missing blocks issue looked unusual/unexpected, but no specific fix or next step had been given yet in the thread.", "standardized_area": "Templates"}, {"date": "2026-08-03", "requester": "Ash Arraiza", "ka": "XSJVww", "area": "Integrations", "summary": "Shopware: customers who are already subscribed are getting multiple double opt in emails; plugin resends full subscriber batch.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "The team found several prior tickets with the same Shopware plugin bug (repeated DOI resends caused by historical_import:false on every call). A fix exists in plugin v1.14.3/1.14.4, so they advised waiting for the customer to update; if the issue persists after updating, the plan is to ask in the #ask-shopware channel for further help.", "standardized_area": "Integrations"}, {"date": "2026-07-31", "requester": "Ash Arraiza", "ka": "UVnXrV", "area": "Templates", "summary": "Two email templates return 422 on every API read; editor still opens/edits them fine.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya used Claude to diagnose that the 422 came from a stale label_color value left on a Social Links block after show_labels was toggled off, which the API validator now rejects on read. She confirmed this looks like a backend/API bug (422 isn't even a documented status code) and told Ash to escalate to SE, flagging that the customer is using the MCP.", "standardized_area": "Templates"}, {"date": "2026-07-30", "requester": "Ash Arraiza", "ka": "SPBxWt", "area": "Flows", "summary": "Flow message analytics shows very little data, despite hundreds of profiles moving through the initial conditional split.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed this matches the known FP-3146 bug (flow A/B test not recording deliveries correctly), the same pattern she'd seen reported by the CNX team, which explains why flow analytics under-report despite messages actually sending.", "standardized_area": "Flows"}, {"date": "2026-07-29", "requester": "Chris Yinfoo", "ka": "WqX2J6", "area": "Integrations", "summary": "Meta Filled Out Lead Ad metric stopped worked", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Team discussed the 403 periodic sync error and confirmed the customer's Meta permissions and TOS acceptance looked fine, so no clear fix was found in-thread. Ash shared that a similar case was resolved by manually restarting the periodic sync via the KB steps, and the team agreed to watch how SE handles this ticket before treating that as a standard practice; ultimately escalated to SE.", "standardized_area": "Integrations"}, {"date": "2026-07-28", "requester": "Ash Arraiza", "ka": "SeZyg2", "area": "Integrations", "summary": "Custom object properties are not updating despite successful 204 API responses.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail, shown highlighted in a screenshot), but no fix or workaround was shared in the thread beyond acknowledging the issue.", "standardized_area": "Integrations"}, {"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "Customer sent multiple campaigns, however the recipient count is significantly lower than the expected count.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Root cause was that the segment definition was changed (grew from ~1.6k to 27k+ profiles) after the campaign was scheduled; since RAST was disabled, the campaign only sent to the segment snapshot taken at schedule time. Recommended verifying timing via the segment growth report and account activity logs, and enabling RAST going forward if audience updates made after scheduling should be captured in the send.", "standardized_area": "Campaigns"}, {"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account has the custom action step but their other account under the same family billing does not", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "Onsite JS crashes on every page load with Error: undefined reading 'customerHubOnboarded'; settings API returns 404.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-24", "requester": "Chris Yinfoo", "ka": "XEPuyw", "area": "Integrations", "summary": "The customer is seeing an old site set up for their WooCommerce integration; wants to know if the new .co.uk site was ever connected.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya suggested using PostmanLite system_status to check the WooCommerce integration URL, which appeared to be pointing to the old .wp1.sh staging site rather than the new .co.uk domain. The recommendation was to advise the customer about the 526 error and suggest removing and re-integrating to fix the URL mismatch.", "standardized_area": "Integrations"}, {"date": "2026-06-23", "requester": "Chris Yinfoo", "ka": "UuFRx3", "area": "Flows", "summary": "Third-party connector Funnel is getting repeated 500 errors from GET /api/flows/{id}/flow-actions/", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya identified the 500 errors from Funnel's GET /api/flows/{id}/flow-actions/ are tied to a known bug (FLOW-660) where emails not being set up causes the endpoint to return 500 instead of returning other flow actions. Chris was advised to comment on the Linear ticket that this customer is also affected.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Chris Yinfoo", "ka": "Rn572y", "area": "Flows", "summary": "'Viewed Product' event is appearing twice for one instance of viewing the item on their site", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya identified the duplicate 'Viewed Product' events as coming from two sources — one client-side via Klaviyo and one server-side via a third-party app (WeTracked). She suggested the customer contact the third-party app to remove their tracking script if they want to eliminate the duplicate events from their flow.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Ash Arraiza", "ka": "UrbgMW", "area": "Templates", "summary": "Previewing the template as your own profile does not show dynamic content (custom properties).", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya explained that simply seeing their name pre-filled in the preview pane doesn't mean their profile is selected — the user needs to actively retype their email address and select it from the dropdown. She recommended Ash create a Loom to demonstrate the correct preview steps to the customer.", "standardized_area": "Templates"}, {"date": "2026-06-10", "requester": "Meher Gambhir", "ka": "an79Sm", "area": "Campaigns", "summary": "CX is concerned the footer banner in many emails renders much wider than expected on desktop in Gmail, Chrome for test sends.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya suggested the issue could be Gmail clipping or related to the new template editor migration, and advised that since the issue could not be replicated on their end, Meher should reply using the Gmail clipping angle.", "standardized_area": "Campaigns"}, {"date": "2026-06-09", "requester": "Ash Arraiza", "ka": "KwJYB2", "area": "Campaigns", "summary": "Customer created an A/B test campaign, however no one received variation B. The A/B test results tab does not show variation B.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya checked the Staffside campaign view and confirmed variation B was never sent, then recommended escalating to Business Licensing as it was unclear whether the issue stemmed from a platform incident or the linked UI bug (EXP-392).", "standardized_area": "Campaigns"}, {"date": "2026-06-04", "requester": "Ash Arraiza", "ka": "tNPZ9N", "area": "Lists & Segments", "summary": "Cloning segments between accounts is successful, however the segment conditions are not copied.", "tried": ["tried"], "ticket_url": "https: he suggested waiting a few hours to see if profiles update, and if still not suppressed, to comment on the related Linear ticket ICM-599. Ash later confirmed profiles were still not suppressed after several hours and added the ticket to Linear.", "standardized_area": "Accounts"}, {"date": "2026-05-26", "requester": "Meher Gambhir", "ka": "Rmwb2z", "area": "K-Social", "summary": "CX is trying to connect their Instagram account to the new Social feature, but the connection is not sticking.", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya suggested verifying the customer has Admin/Editor/Full Control on their Facebook/Meta assets for the Instagram Business account, and asked Meher to collect screenshots of both Facebook Page Advanced Messaging settings (Connected Apps > Klaviyo-IG) and Instagram Website Permissions to confirm all required permissions are enabled. If the issue persists after confirming permissions, the recommendation was to link the similar ticket and escalate to BL.", "standardized_area": "K-Social"}, {"date": "2026-05-18", "requester": "Ash Arraiza", "ka": "V6acte", "area": "Integrations", "summary": "Shopify Added to Cart is not firing on certain profiles", "tried": ["tried"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/0", "replies": 5, "has_files": false, "suggestion_summary": "Alicya tested on desktop and mobile but couldn't replicate the issue, and noted that incognito browsing should always trigger fresh cookie acceptance. She advised telling the customer the issue is likely on their end since it can't be replicated, and to escalate to the BL team.", "standardized_area": "Integrations"}, {"date": "2026-05-14", "requester": "Chris Yinfoo", "ka": "Y9yRLy", "area": "Lists & Segments", "summary": "Segment using custom object (Child) properties shows 0 profiles even though the data appears to be in place.", "tried": ["tried"], "ticket_url": const CHART_COLORS=["#4A154B","#007aff","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#ffcc00","#8e8e93","#30b0c7","#ff2d55","#5856d6"];
function getAreaCounts(){const counts={};QUESTIONS.forEach(q=>{counts[q.area]=(counts[q.area]||0)+1;});return Object.entries(counts).sort((a,b)=>b[1]-a[1]);}
function filterByArea(area){const sel=document.getElementById("areaFilter");sel.value=sel.value===area?"":area;renderTable();}
function renderChart(){
  const counts=getAreaCounts();
  const total=QUESTIONS.length;
  const activeArea=document.getElementById("areaFilter")?document.getElementById("areaFilter").value:"";
  let cumulative=0;
  const gradientParts=counts.map(([area,count],i)=>{
    const pct=total?count/total*100:0;
    const start=cumulative;
    cumulative+=pct;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    return `${color} ${start}% ${cumulative}%`;
  });
  document.getElementById("donutChart").style.background=gradientParts.length?`conic-gradient(${gradientParts.join(",")})`:"#e5e5ea";
  document.getElementById("donutTotal").textContent=total;
  document.getElementById("donutLegend").innerHTML=counts.map(([area,count],i)=>{
    const color=CHART_COLORS[i%CHART_COLORS.length];
    const pct=total?((count/total)*100).toFixed(1):"0.0";
    const isActive=activeArea===area;
    return `<div class="legend-item${isActive?" active":""}" onclick="filterByArea('${area.replace(/'/g,"\\'")}')"><span class="legend-swatch" style="background:${color}"></span><span class="legend-label">${esc(area)}</span><span class="legend-count">${count}</span><span class="legend-pct">${pct}%</span></div>`;
  }).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  renderChart();
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderChart();renderTable();
</script>
</body>
</html>
