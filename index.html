const QUESTIONS=[{"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "S9Qc5f", "area": "Flows", "summary": "The customer is noticing a number of recipients skipped in a flow due to 'Unable to Send Email'  Would like more detail information into the reason for this?", "tried": ["Debugger -", "They are noticing the same in other flows too but we can start here"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189533", "replies": 3, "has_files": true, "suggestion_summary": "Chris identified two similar Linear bugs about flow emails skipped due to 'Unable to Send Email'; the team concluded the closest match is FP-3896 (Unable to Send Email due to UNKNOWN_SEND_EXCEPTION).", "standardized_area": "Flows"}, {"date": "2026-09-14", "requester": "Chris Yinfoo", "ka": "V458YQ", "area": "Flows", "summary": "Customer noticed lack of flow emails sending", "tried": ["Wasn't seeing any results via the debugger (Not sure if date is behind the search timeframe?)", "Couldn't see any skipped emails", "The last profile to receive email 1A in June 2026-"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4174764", "replies": 6, "has_files": true, "suggestion_summary": "Alicya ran Chronosphere queries and found the profiles never entered the date-triggered flow at all (not just delayed), matching a known bug (FP-3599: profiles failing to enter date-triggered flow); she recommended escalating to Backline.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "Vbxg9f", "area": "Flows", "summary": "Flow webhook activity showing many skipped", "tried": ["Tried to compare examples which worked vs didn't but haven't quite found a reason", "When trying the test request, see the following details", "Any other logs we can check or review further?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165180", "replies": 6, "has_files": true, "suggestion_summary": "Alicya identified the webhook was a non-Klaviyo (customer-owned) webhook, suggesting the skipped activity was likely due to an issue on the receiving end, and recommended checking in with the webhook owner directly.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "ThEqHV", "area": "Sign Up Forms", "summary": "Customer has one Klaviyo parent account (SINGER - ThEqHV ) with multiple child accounts.  Their previous WooCommerce child-account setup has transitioned to BigCommerce, and they are unable to configure flows or use Klaviyo for marketing across their BigCommerce Multi-Storefront setup.  • SINGER was the only brand originally on BigCommerce • All our other brands — AccuQuilt, PFAFF, Husqvarna Vikin", "tried": ["The first/second image is for some context on the direction which the migration process is heading", "If we look specifically at their recent sign up form query, they said they saw the SINGER form on the ricoma site. However when checking the form, I'm not seeing any targeting to limit this to Singer only", "I advised they need to have targeting, which they said apparently the did, however in their most recent response  \"The form shown in my screenshot is the correct SINGER form for the SINGER website.\"  I'm not seeing this?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115668", "replies": 12, "has_files": true, "suggestion_summary": "Confirmed the JavaScript/integration setup was correct on the parent account, and identified that the customer's sign-up form was missing the targeting needed to limit the Singer form to the Singer site; Alicya and Chris planned to huddle to walk through the full BigCommerce multi-storefront migration (forms, flows, list structure) together.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "PDQku2", "area": "Catalogs & Feeds", "summary": "• Unable to save new product feed  • Existing product feed is not available to select when adding a product block into email", "tried": ["Tested with a clone campaign and new campaign and no joy", "Not able to replicate in my test account"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4166614", "replies": 20, "has_files": true, "suggestion_summary": "Found a 403 error in the network tab when creating a new product feed and adding a product block to the campaign, which appeared to be unexpected behaviour; Alicya recommended escalating the issue to Backline.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-08", "requester": "Ash Arraiza", "ka": "UJFV9p", "area": "Flows", "summary": "• Profiles are processed through the conditional split, but then they aren't being queued for the message afterwards. See screenshots.", "tried": ["checked skipped messages, email does not appear", "checked scheduled messages, email does not appear", "checked flow debugger, queuing appears complete?", "no filters on the flow", "no previous time delay blocks between the split and the message.", "similar bugs: FP-3307, FP-1698, FP-3700", "Might be this one? FP-3662 but profiles aren't entering the \"waiting\" stage."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164569", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found the split action shared the same action ID as another block, which didn't match any known flow bugs, so she recommended escalating to have engineering create a new bug ticket.", "standardized_area": "Flows"}, {"date": "2026-09-08", "requester": "Meher Gambhir", "ka": "KSMVzB", "area": "Email Deliverability", "summary": "Legitimate profiles are being suppressed by BOT_PROTECTION through consent webhooks from unrelated accounts", "tried": ["CX has a WooCommerce Integration in this acc", "Both profiles had integration consent events with no IP or user agent", "Created segment to unsuppress for CX", "No duplicate integration for this account", "Could it be related to this bug: ICM-1282"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165362", "replies": 2, "has_files": false, "suggestion_summary": "Alicya confirmed the profiles were suppressed by subscription protection (visible via Splunk calls from multiple account IDs) and, since the customer confirmed they were legitimate, advised linking the known ICM-1282 bot-protection bug ticket.", "standardized_area": "Email Deliverability"}, {"date": "2026-09-08", "requester": "Chris Yinfoo", "ka": "VyhTNh", "area": "Integrations", "summary": "Prestashop integration is enabled however the customer is not seeing added to cart events  Klaviyo.js script does not appear to be present however this should be added automatically?", "tried": ["Other events are working", "The customer has navigated to Integrations > Manage Data > Set Up Web Tracking > Add, but nothing happens at all - not even an error message", "Prestashop: 1.7.8.8, Klaviyo module: v1.12.9", "No multi-store, so the API keys are applied at store level", "No integration erros in Staffside", "Modules (no Lightspeed or Cloudflare)"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164460", "replies": 7, "has_files": false, "suggestion_summary": "Alicya found no Klaviyo JS injected on the site at all and pointed to the PrestaShop troubleshooting guide; since the previous agent had already followed it without success, she advised escalating.", "standardized_area": "Integrations"}, {"date": "2026-09-03", "requester": "Ash Arraiza", "ka": "XsDESE", "area": "Templates", "summary": "• Smart translation for Swedish and Swiss High German changes complete images in the template during a live send.  • The customer manually changes images depending on the locale, and saves the template. But when the campaign is sent, the image shown ends up reverting to the original.", "tried": ["I tried looking at the web view for the example profile that received the wrong image, but web view shows the correct images.", "I don't have access to view the translations anymore as access expired, but we were able to capture screenshots of the template images manually set per translation.", "Checked linear for any bugs on this and didn't find any bugs specifically for ST reverting template images.", "Checked this article, and I understand it can be changed if manually set, but the issue is that once she saves the template, the live send does not apply the changes."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4145150", "replies": 14, "has_files": false, "suggestion_summary": "Alicya explained that the web view doesn't always reflect what was actually delivered, and pointed Ash to the Staffside template-rendering-artifacts tool (or having the customer forward the actual received email) to confirm which image version was truly sent; since the staff tool failed to load, the plan was to ask the customer to forward screenshots of the received email instead.", "standardized_area": "Templates"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "TP8tDr", "area": "Sign Up Forms", "summary": "The customer is running into HTTP 503 errors when trying to sign up to their pop up form  (I have not been able to replicate the issue nor did the previous agent)", "tried": ["Tried to replicate but haven't been able to", "Request more information from customer on their experience (Alot of information, please read their latest reply in case)", "They have done the usual other tests and apparently they are experiencing the same", "Their previous case closed without resolution so they would like further look, where possible"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151819", "replies": 23, "has_files": false, "suggestion_summary": "Alicya traced the reported 503s to the client/profiles (identify) and onsite/track-analytics calls rather than the client/subscriptions (subscribe) endpoint, and since the team couldn't reproduce the issue and the customer had no screenshot or HAR file confirming the failure, they escalated the ticket to Backline as a sign-up form issue.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "WZcvhJ", "area": "Sign Up Forms", "summary": "Customer is unable to publish their form (There are stats which means it was possible previously)", "tried": ["During my testing, I also found that I'm unable to clone the form but can for others, so something might be up?", "Ruled out missing side image", "Ruled out probability notification percentage notification", "Anything else to check?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4150949", "replies": 5, "has_files": false, "suggestion_summary": "Alicya and Chris found the form also couldn't be cloned and had a buggy image-block deletion, pointing to a broader form-editor bug rather than a config issue, so they escalated to Backline.", "standardized_area": "Sign Up Forms"}, {"date": "2026-08-31", "requester": "Chris Yinfoo", "ka": "XNCrpa", "area": "Catalogs & Feeds", "summary": "The customer has Shopify markets enabled and wants to confirm how to have the correct product URL displayed in their dynamic product feed  \"Could you please confirm how we can make Klaviyo automatically use the Shopify Markets UK product URLs for UK customers, or whether something is still missing in the market/catalog configuration on our account?\"", "tried": ["Referring to this article, does smart translations need to be turned on for localised content to work ? (The customer currently does not have smart translation)", "When I tested in 'Preview & Test' by selecting different profiles, I did display different pricing and link was different", "Does that mean it works without smart translations and they have everything set up as they need?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151091", "replies": 16, "has_files": false, "suggestion_summary": "Confirmed the localized product URL/pricing in the dynamic product feed comes from the Shopify Markets integration itself — Smart Translations is not required, since the customer's vents is enabled", "Business located in Portugal, falls under EU consent restrictions, customer confirmed accepting cookies before adding to cart."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3957250", "replies": 3, "has_files": false, "suggestion_summary": "Alicya tested on desktop and mobile but couldn't replicate the issue, and noted that incognito browsing should always trigger fresh cookie acceptance. She advised telling the customer the issue is likely on their end since it can't be replicated, and to escalate to the BL team.", "standardized_area": "Integrations"}, {"date": "2026-05-14", "requester": "Chris Yinfoo", "ka": "Y9yRLy", "area": "Lists & Segments", "summary": "Customer wants to show the lifecycle tracked within segments for each 'Child' object, e.g. a segment of 'infants aged 3months-12months'. It showed 0 profiles, even using a segment of having the Child property set. Waited 30+ mins with no updates.", "tried": ["Looks like data is in place but the segment isn't picking this up", "Tried different conditions which match the profile", "Waited some time after creating the segment to see if results were delayed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3962610", "replies": 4, "has_files": false, "suggestion_summary": "Alicya created a test segment and noted it can take up to 20 minutes to populate per the KB. If it still doesn't work, she linked a known Linear issue (GPLAT-425) and advised asking the SA (Bella) to follow up directly in the Linear ticket to flag urgency, since the bug is in backlog with no ETA.", "standardized_area": "Lists & Segments"}, {"date": "2026-05-12", "requester": "Chris Yinfoo", "ka": "VD2Qzs", "area": "Flows", "summary": "The customer has observed that emails are taking longer than 1-2mins to send from the flow (No delay step however maybe conditional split steps)", "tried": ["Previous agent mentioned that flows with many splits and filters take longer since Klaviyo evaluates more decision points before each person continues down the correct path.", "The customer then came back with attached queries"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3954968", "replies": 9, "has_files": false, "suggestion_summary": "Alicya noted she had a similar delay issue that gradually improved, and that 3 minutes is still within the acceptable grace period per an existing Slack thread. She recommended sending the customer David's example response about expected flow send times.", "standardized_area": "Flows"}, {"date": "2026-05-08", "requester": "Meher Gambhir", "ka": "LnETuM", "area": "K-Service", "summary": "The email enquiries@klevarange.com.au is showing as Failed in Klaviyo, but the customer's testing suggests the email flow is working. Test email reached Helpdesk, landed in Spam, and the Helpdesk reply was successfully received at their external address. Trying to understand why status still shows Failed and how to target the issue that emails are going into Helpdesk spam classification.", "tried": ["CX confirmed the Microsoft 365 forwarding rule is set correctly and external forwarding is allowed.", "CX sent a test email, it reached Klaviyo Helpdesk but landed in Spam.", "Also confirmed the reply from Helpdesk made it back to their external address.", "Tried to mark the set up as done but came across error, pending for a while then went back to failed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3952094", "replies": 8, "has_files": false, "suggestion_summary": "Alicya advised following the internal KB troubleshooting steps for 'Failed' vs 'Verified' status, and suggested temporarily changing the forwarding destination to reset the connection. If it still shows Failed after that, escalate to the BL team.", "standardized_area": "K-Service"}, {"date": "2026-05-08", "requester": "Ash Arraiza", "ka": "L2xQqw", "area": "Integrations", "summary": "Customer is trying to track a custom Started Checkout metric via GTM on their Shopify checkout page. However it is not firing.", "tried": ["The Klaviyo SDK is loading and the cookie is being set, but _learnq.push() is returning false and window.klaviyo.track() does not resolve. Checked network requests and no network requests are reaching Klaviyo's servers at all.", "Confirmed metric has never received events in the account", "Tested with test email, went through checkout, no event appeared on test profile", "Confirmed via DevTools that GTM and klaviyo.js are not loading on the Shopify checkout domain", "Researched build-preview paths and confirmed this is normal production versioning, not the cause", "Suspect CSP blocking outbound requests to Klaviyo domains, or consent settings silencing the SDK"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3949525", "replies": 19, "has_files": false, "suggestion_summary": "Alicya found an SA wiki page confirming custom Started Checkout events can work with GTM, and advised gathering more details from the customer (code snippets, exact setup) before escalating to the SE team — including the wiki doc in the escalation note for context.", "standardized_area": "Integrations"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
const CHART_COLORS=["#4A154B","#007aff","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#ffcc00","#8e8e93","#30b0c7","#ff2d55","#5856d6"];
function getAreaCounts(){const counts={};QUESTIONS.forEach(q=>{counts[q.area]=(counts[q.area]||0)+1;});return Object.entries(counts).sort((a,b)=>b[1]-a[1]);}
function filterByArea(area){const sel=document.getElementById("areaFilter");sel.value=sel.value===area?"":area;renderTable();}
function renderChart(){
  const counts=getAreaCounts();
  const total=QUESTIONS.length;
  const activeArea=document.getElementById("areaFilter")?document.getElementById("areaFilter").value:"";
  let cumulative=0;
  const gradientParts=counts.map(([area,count],i)=>{
    const pct=total?count/total*100:0;
    const start=cumulative;
    cumulative+=pct;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    return `${color} ${start}% ${cumulative}%`;
  });
  document.getElementById("donutChart").style.background=gradientParts.length?`conic-gradient(${gradientParts.join(",")})`:"#e5e5ea";
  document.getElementById("donutTotal").textContent=total;
  document.getElementById("donutLegend").innerHTML=counts.map(([area,count],i)=>{
    const color=CHART_COLORS[i%CHART_COLORS.length];
    const pct=total?((count/total)*100).toFixed(1):"0.0";
    const isActive=activeArea===area;
    return `<div class="legend-item${isActive?" active":""}" onclick="filterByArea('${area.replace(/'/g,"\\'")}')"><span class="legend-swatch" style="background:${color}"></span><span class="legend-label">${esc(area)}</span><span class="legend-count">${count}</span><span class="legend-pct">${pct}%</span></div>`;
  }).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  renderChart();
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderChart();renderTable();
</script>
</body>
</html>
