<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; font-size: 14px; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .channel-badge { background: #4A154B; color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; letter-spacing: 0.3px; white-space: nowrap; }
  header h1 { font-size: 16px; font-weight: 700; color: #1d1d1f; }
  .last-updated { font-size: 11px; color: #8e8e93; margin-top: 2px; }
  .main { padding: 20px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 14px 16px; border: 1px solid #e5e5ea; }
  .stat-card .stat-label { font-size: 11px; font-weight: 500; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; line-height: 1; color: #1d1d1f; }
  .stat-card.purple .stat-value { color: #4A154B; }
  .stat-card.green  .stat-value { color: #34c759; }
  .stat-card.orange .stat-value { color: #ff9500; }
  .stat-card.blue   .stat-value { color: #007aff; }
  .filter-bar { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap input { width: 100%; border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px 7px 30px; font-size: 13px; color: #1d1d1f; outline: none; transition: border-color 0.15s; }
  .search-wrap input:focus { border-color: #4A154B; }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #8e8e93; font-size: 13px; }
  .filter-select { border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #1d1d1f; background: #fff; outline: none; cursor: pointer; min-width: 140px; }
  .filter-select:focus { border-color: #4A154B; }
  .filter-count { font-size: 12px; color: #8e8e93; white-space: nowrap; }
  .table-wrap { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #f5f5f7; border-bottom: 1px solid #e5e5ea; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: #4A154B; }
  tbody tr { border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf5fb; }
  tbody tr.expanded-row { background: #faf5fb; }
  td { padding: 11px 14px; vertical-align: top; }
  .td-date { color: #8e8e93; font-size: 12px; white-space: nowrap; }
  .td-requester { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .td-ka { font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: #4A154B; white-space: nowrap; }
  .td-summary { font-size: 13px; color: #3a3a3c; max-width: 320px; line-height: 1.4; }
  .td-summary-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ticket-link { color: #4A154B; text-decoration: none; font-size: 12px; font-weight: 500; }
  .ticket-link:hover { text-decoration: underline; }
  .area-tag { display: inline-block; background: #f0e8f1; color: #4A154B; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 500; max-width: 180px; word-break: break-word; }
  .expand-row td { padding: 0; background: #fdf8fe; border-bottom: 2px solid #e5d6e8; }
  .expand-content { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .expand-section h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #4A154B; margin-bottom: 6px; }
  .expand-section p { font-size: 13px; color: #3a3a3c; line-height: 1.5; }
  .expand-section p + p { margin-top: 3px; }
  .expand-section ul { padding-left: 16px; }
  .expand-section li { font-size: 13px; color: #3a3a3c; line-height: 1.5; margin-bottom: 4px; }
  .expand-full { grid-column: 1 / -1; }
  .expand-suggestion-box { grid-column: 1 / -1; background: #f0faf4; border: 1.5px solid #34c759; border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .expand-suggestion-box .suggestion-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
  .expand-suggestion-box .suggestion-body h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #1a7f37; margin-bottom: 5px; }
  .expand-suggestion-box .suggestion-body p { font-size: 13px; color: #1d3826; line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px; color: #8e8e93; font-size: 13px; }
  .no-suggestions { color: #8e8e93; font-size: 12px; font-style: italic; }
  .chart-section { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .chart-section h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #8e8e93; margin-bottom: 2px; width: 100%; }
  .donut-wrap { position: relative; width: 160px; height: 160px; flex-shrink: 0; }
  .donut-chart { width: 160px; height: 160px; border-radius: 50%; }
  .donut-hole { position: absolute; top: 20px; left: 20px; width: 120px; height: 120px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-hole .donut-total { font-size: 22px; font-weight: 700; color: #1d1d1f; line-height: 1; }
  .donut-hole .donut-total-label { font-size: 10px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
  .donut-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; flex: 1; min-width: 240px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #3a3a3c; cursor: pointer; padding: 3px 6px; border-radius: 6px; transition: background 0.1s; }
  .legend-item:hover { background: #f5f5f7; }
  .legend-item.active { background: #f0e8f1; font-weight: 600; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { font-weight: 700; color: #1d1d1f; }
  .legend-pct { color: #8e8e93; font-size: 11px; }
</style>

<script>
const QUESTIONS=[{"date": "2026-09-23", "requester": "Chris Yinfoo", "ka": "VpVCCs", "area": "Catalogs & Feeds", "summary": "Customer has three Salesforce Commerce Cloud catalog items for the same product, all sharing the same Item ID and SKU.  Their Price Drop email is defaulting to the `Default` catalog item instead of `polk_us`. In the payload they shared, the reduced price appears to be mapped to the Default catalog item's original price, while the original price is mapped to the reduced price for the US catalog.", "tried": ["The customer was told that updating the cartridge would allow Klaviyo to differentiate between catalogs (past ticket: )", "Clarified from the customer \"To clarify, the product wasn't actually discounted down to $405 on our site; the original and reduced-price attributes in the payload were simply incorrect. The price on the website product page was right.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4184010", "replies": 10, "has_files": true, "suggestion_summary": "Alicya explained that Price Drop flows can only source pricing from one catalog and don't pull from the live website; for SFCC, catalog-triggered flows need version 25.4.0+ so a catalog identifier (external id + store id) can distinguish items sharing the same ID across catalogs. She found the correct price was actually set on the variant product rather than the parent product, and suggested asking the customer what that variant product is.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-22", "requester": "Chris Yinfoo", "ka": "SewLA5", "area": "Lists & Segments", "summary": "The customer wants to know the origin of a custom property found on profiles page", "tried": ["Checked dev logs for anything that might have written to the profile (Searched ID, email, phone number)", "Tried to create a segment to see other profiles which might have the property however the key does not appear (Also do not see the property in SS)", "Anywhere else to check or missed? Next, step would be to check in with SE Slack"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4188820", "replies": 12, "has_files": true, "suggestion_summary": "Chris found the custom property was added via an API call that touched only profile attributes with no visible integration in the dev logs, likely from an automation using a private API key; Alicya recommended checking with the SE team to trace where it originated.", "standardized_area": "Lists & Segments"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "RhX2C9", "area": "Integrations", "summary": "The Shopify Checkout URL does not load checkout page but rather goes to the home page  No Placed Order events and checked URL soon after event came through", "tried": ["No Placed Order has been actioned", "Pasted checkout url directly into browser soon after event", "Postman Abandoned URL shows the same URL", "Am I missing something here?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189545", "replies": 15, "has_files": true, "suggestion_summary": "Alicya explained this is a known issue where Shopify checkout URLs take about 15 minutes to sync to Klaviyo, so testing immediately after the event shows the homepage instead of the checkout page; she pointed Chris to the internal KB troubleshooting guide for checkout URL redirect issues.", "standardized_area": "Integrations"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "S9Qc5f", "area": "Flows", "summary": "The customer is noticing a number of recipients skipped in a flow due to 'Unable to Send Email'  Would like more detail information into the reason for this?", "tried": ["Debugger -", "They are noticing the same in other flows too but we can start here"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189533", "replies": 21, "has_files": true, "suggestion_summary": "Chris identified two similar Linear bugs about flow emails skipped due to 'Unable to Send Email'; the team concluded the closest match is FP-3896 (Unable to Send Email due to UNKNOWN_SEND_EXCEPTION).", "standardized_area": "Flows"}, {"date": "2026-09-14", "requester": "Chris Yinfoo", "ka": "V458YQ", "area": "Flows", "summary": "Customer noticed lack of flow emails sending", "tried": ["Wasn't seeing any results via the debugger (Not sure if date is behind the search timeframe?)", "Couldn't see any skipped emails", "The last profile to receive email 1A in June 2026-"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4174764", "replies": 6, "has_files": true, "suggestion_summary": "Alicya ran Chronosphere queries and found the profiles never entered the date-triggered flow at all (not just delayed), matching a known bug (FP-3599: profiles failing to enter date-triggered flow); she recommended escalating to Backline.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "Vbxg9f", "area": "Flows", "summary": "Flow webhook activity showing many skipped", "tried": ["Tried to compare examples which worked vs didn't but haven't quite found a reason", "When trying the test request, see the following details", "Any other logs we can check or review further?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165180", "replies": 6, "has_files": true, "suggestion_summary": "Alicya identified the webhook was a non-Klaviyo (customer-owned) webhook, suggesting the skipped activity was likely due to an issue on the receiving end, and recommended checking in with the webhook owner directly.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "ThEqHV", "area": "Sign Up Forms", "summary": "Customer has one Klaviyo parent account (SINGER - ThEqHV ) with multiple child accounts.  Their previous WooCommerce child-account setup has transitioned to BigCommerce, and they are unable to configure flows or use Klaviyo for marketing across their BigCommerce Multi-Storefront setup.", "tried": ["The first/second image is for some context on the direction which the migration process is heading", "If we look specifically at their recent sign up form query"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115668", "replies": 12, "has_files": true, "suggestion_summary": "Confirmed the JavaScript/integration setup was correct on the parent account, and identified that the customer's sign-up form was missing the targeting needed to limit the Singer form to the Singer site; Alicya and Chris planned to huddle to walk through the full BigCommerce multi-storefront migration (forms, flows, list structure) together.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "PDQku2", "area": "Catalogs & Feeds", "summary": "• Unable to save new product feed  • Existing product feed is not available to select when adding a product block into email", "tried": ["Tested with a clone campaign and new campaign and no joy", "Not able to replicate in my test account"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4166614", "replies": 20, "has_files": false, "suggestion_summary": "Found a 403 error in the network tab when creating a new product feed and adding a product block to the campaign, which appeared to be unexpected behaviour; Alicya recommended escalating the issue to Backline.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-08", "requester": "Ash Arraiza", "ka": "UJFV9p", "area": "Flows", "summary": "• Profiles are processed through the conditional split, but then they aren't being queued for the message afterwards.", "tried": ["checked skipped messages, email does not appear", "checked scheduled messages, email does not appear", "checked flow debugger, queuing appears complete?", "similar bugs: FP-3307, FP-1698, FP-3700, FP-3662"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164569", "replies": 7, "has_files": false, "suggestion_summary": "Alicya found the split action shared the same action ID as another block, which didn't match any known flow bugs, so she recommended escalating to have engineering create a new bug ticket.", "standardized_area": "Flows"}, {"date": "2026-09-08", "requester": "Meher Gambhir", "ka": "KSMVzB", "area": "Email Deliverability", "summary": "Legitimate profiles are being suppressed by BOT_PROTECTION through consent webhooks from unrelated accounts", "tried": ["CX has a WooCommerce Integration in this acc", "Both profiles had integration consent events with no IP or user agent", "Created segment to unsuppress for CX", "No duplicate integration for this account", "Could it be related to bug ICM-1282 (bot protection suppressing legitimate signups)"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165362", "replies": 2, "has_files": false, "suggestion_summary": "Alicya confirmed the profiles were suppressed by subscription protection (visible via Splunk calls from multiple account IDs) and, since the customer confirmed they were legitimate, advised linking the known ICM-1282 bot-protection bug ticket.", "standardized_area": "Email Deliverability"}, {"date": "2026-09-08", "requester": "Chris Yinfoo", "ka": "VyhTNh", "area": "Integrations", "summary": "Prestashop integration is enabled however the customer is not seeing added to cart events. Klaviyo.js script does not appear to be present however this should be added automatically?", "tried": ["Other events are working", "Customer navigated to Integrations > Manage Data > Set Up Web Tracking > Add, but nothing happens", "Prestashop: 1.7.8.8, Klaviyo module: v1.12.9", "No multi-store, so the API keys are applied at store level", "No integration errors in Staffside"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164460", "replies": 7, "has_files": false, "suggestion_summary": "Alicya found no Klaviyo JS injected on the site at all and pointed to the PrestaShop troubleshooting guide; since the previous agent had already followed it without success, she advised escalating.", "standardized_area": "Integrations"}, {"date": "2026-09-03", "requester": "Ash Arraiza", "ka": "XsDESE", "area": "Templates", "summary": "• Smart translation for Swedish and Swiss High German changes complete images in the template during a live send. • The customer manually changes images depending on the locale, and saves the template. But when the campaign is sent, the image shown ends up reverting to the original.", "tried": ["Looked at web view for example profile, web view shows correct images", "No access to view translations anymore, captured screenshots manually", "Checked linear for bugs on ST reverting template images, didn't find any", "Checked help article, issue is once template is saved, live send does not apply changes"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4145150", "replies": 14, "has_files": false, "suggestion_summary": "Alicya explained that the web view doesn't always reflect what was actually delivered, and pointed Ash to the Staffside template-rendering-artifacts tool (or having the customer forward the actual received email) to confirm which image version was truly sent; since the staff tool failed to load, the plan was to ask the customer to forward screenshots of the received email instead.", "standardized_area": "Templates"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "TP8tDr", "area": "Sign Up Forms", "summary": "The customer is running into HTTP 503 errors when trying to sign up to their pop up form. Have not been able to replicate the issue nor did the previous agent.", "tried": ["Tried to replicate but haven't been able to", "Requested more information from customer", "They have done the usual other tests and apparently experiencing the same", "Previous case closed without resolution"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151819", "replies": 23, "has_files": false, "suggestion_summary": "Alicya traced the reported 503s to the client/profiles (identify) and onsite/track-analytics calls rather than the client/subscriptions (subscribe) endpoint, and since the team couldn't reproduce the issue and the customer had no screenshot or HAR file confirming the failure, they escalated the ticket to Backline as a sign-up form issue.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "WZcvhJ", "area": "Sign Up Forms", "summary": "Customer is unable to publish their form (There are stats which means it was possible previously)", "tried": ["During testing, also found unable to clone the form but can for others", "Ruled out missing side image", "Ruled out probability notification percentage notification"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4150949", "replies": 5, "has_files": false, "suggestion_summary": "Alicya and Chris found the form also couldn't be cloned and had a buggy image-block deletion, pointing to a broader form-editor bug rather than a config issue, so they escalated to Backline.", "standardized_area": "Sign Up Forms"}, {"date": "2026-08-31", "requester": "Chris Yinfoo", "ka": "XNCrpa", "area": "Catalogs & Feeds", "summary": "The customer has Shopify markets enabled and wants to confirm how to have the correct product URL displayed in their dynamic product feed for UK customers.", "tried": ["Referring to help doc, does smart translations need to be turned on for localised content to work? (customer doesn't have smart translation)", "When tested in Preview & Test by selecting different profiles, displayed different pricing and link was different", "Does that mean it works without smart translations and they have everything set up as they need?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151091", "replies": 16, "has_files": false, "suggestion_summary": "Confirmed the localized product URL/pricing in the dynamic product feed comes from the Shopify Markets integration itself — Smart Translations is not required, since the customer's product titles were already translated separately.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-08-04", "requester": "Ash Arraiza", "ka": "Vh5xLA", "area": "Templates", "summary": "The template preview hides the last 2 blocks in the template editor.", "tried": ["exported the HTML for the template, and the HTML does not contain the missing blocks", "imported that HTML into test account and verified missing blocks", "verified no display settings enabled for blocks or sections", "rebuilt template from scratch, still seeing issue", "Selecting a preview profile/event makes no difference"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4104767", "replies": 1, "has_files": true, "suggestion_summary": "Alicya confirmed the missing blocks issue looked unusual/unexpected, but no specific fix or next step had been given yet in the thread.", "standardized_area": "Templates"}, {"date": "2026-08-03", "requester": "Ash Arraiza", "ka": "XSJVww", "area": "Integrations", "summary": "Shopware: customers who are already subscribed are getting multiple double opt in emails. historical_import: false on every call, so each resend re-triggers DOI. Shopware plugin resends full subscriber batch to a DOI list every 11 mins.", "tried": ["Found 4 prior Zendesk tickets with same pattern", "Checked plugin changelog, fixes exist for 1.14.3/1.14.4, customer on 1.14.1", "Confirmed DOI sends line up with repeated subscribe job timestamps", "Advised customer to switch list to single opt-in temporarily", "Known Shopware bug, unsure if new linear needed or one exists"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097328", "replies": 9, "has_files": true, "suggestion_summary": "The team found several prior tickets with the same Shopware plugin bug (repeated DOI resends caused by historical_import:false on every call). A fix exists in plugin v1.14.3/1.14.4, so they advised waiting for the customer to update; if the issue persists after updating, the plan is to ask in the #ask-shopware channel for further es correctly), the same pattern she'd seen reported by the CNX team, which explains why flow analytics under-report despite messages actually sending.", "standardized_area": "Flows"}, {"date": "2026-07-29", "requester": "Chris Yinfoo", "ka": "WqX2J6", "area": "Integrations", "summary": "Meta Filled Out Lead Ad metric stopped working", "tried": ["Can see a 403 authorization Unsupported request error for Periodic Sync in SS", "Asked customer to check their permission settings"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4088889", "replies": 29, "has_files": true, "suggestion_summary": "Team discussed the 403 periodic sync error and confirmed the customer's Meta permissions and TOS acceptance looked fine, so no clear fix was found in-thread. Ash shared that a similar case was resolved by manually restarting the periodic sync via the KB steps, and the team agreed to watch how SE handles this ticket before treating that as a standard practice; ultimately escalated to SE.", "standardized_area": "Integrations"}, {"date": "2026-07-28", "requester": "Ash Arraiza", "ka": "SeZyg2", "area": "Integrations", "summary": "Custom object properties are not updating despite successful 204 API responses.", "tried": ["Confirmed 204s in Developer Tools > Logs for affected accounts", "Checked Object Manager > Properties, properties already exist as mapped String properties", "Checked data source's Sample Payload, recognized schema attributes, rules out schema mismatch", "Reviewed Troubleshooting: Custom Objects KB article, doesn't call out this issue", "Previously linked to ACO-25608, customer still reported issues after bug resolved"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4093882", "replies": 9, "has_files": true, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail, shown highlighted in a screenshot), but no fix or workaround was shared in the thread beyond acknowledging the issue.", "standardized_area": "Integrations"}, {"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "Customer sent multiple campaigns, however the recipient count does not match/is significantly lower than the expected count.", "tried": ["Followed IKB on ERC lower than list/segment size", "RAST not enabled", "Smart Sending turned off", "No Excluded segments or lists", "Reputation repair disabled", "No Audience filter applied since not omnichannel campaign", "segment was not newly created", "SS does not show info on dropped profiles, may need Splunk logs"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4082512", "replies": 34, "has_files": true, "suggestion_summary": "Root cause was that the segment definition was changed (grew from ~1.6k to 27k+ profiles) after the campaign was scheduled; since RAST was disabled, the campaign only sent to the segment snapshot taken at schedule time. Recommended verifying timing via the segment growth report and account activity logs, and enabling RAST going forward if audience updates made after scheduling should be captured in the send.", "standardized_area": "Campaigns"}, {"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow", "tried": ["No recent changes to flow", "No filters to trigger or emails", "Fairly straightforward setup", "Debugger suggests its stuck?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4070534", "replies": 9, "has_files": true, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account has the custom action step The Nile AU (VjxEiY), however their other account The Nile NZ (RiJWfQ) does not. They are under the same family billing.", "tried": ["Between the two accounts they have over 400k active profiles", "Came across similar past ticket and slack thread", "What is best way to check an account is on Flows 2"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4071307", "replies": 13, "has_files": true, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "Onsite JS crashes on every page load with Error: undefined reading 'customerHubOnboarded'. Comes from build-preview commit atlas.js. Customer Hub is not enabled on this account. Customer's HAR shows fast.a.klaviyo.com/atlas/api/public/settings returns 404.", "tried": ["Customer requesting a lot of information not sure how to source", "Told customer build-preview/commit path is part of standard rolling deployment process, not beta/preview environment"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": true, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-24", "requeste ces appear in their flow setup when they only expect one", "Confirmed with customer, only recall setting up integration via Klaviyo, never encountered before", "In previous case deemed there were two different scripts, customer instructed to remove duplicate script", "Customer concerned removing it may cause complications"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4020964", "replies": 11, "has_files": true, "suggestion_summary": "Alicya identified the duplicate 'Viewed Product' events as coming from two sources — one client-side via Klaviyo and one server-side via a third-party app (WeTracked). She suggested the customer contact the third-party app to remove their tracking script if they want to eliminate the duplicate events from their flow.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Ash Arraiza", "ka": "UrbgMW", "area": "Templates", "summary": "Previewing the template as your own profile does not show dynamic content. Person A previews with own email, does not see dynamic content. Person B previews same template as Person A, can see Person A's dynamic content.", "tried": ["Had customer clear cache and cookies from all time", "Got them to log out and back in, try private browser, different browser", "Verified working in same account and same template", "Cloned template, still seeing issue", "User is an Admin", "Customer not able to see \"custom properties\" section in preview/test page only when previewing with own test profile"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001172", "replies": 23, "has_files": true, "suggestion_summary": "Alicya explained that simply seeing their name pre-filled in the preview pane doesn't mean their profile is selected — the user needs to actively retype their email address and select it from the dropdown. She recommended Ash create a Loom to demonstrate the correct preview steps to the customer.", "standardized_area": "Templates"}, {"date": "2026-06-10", "requester": "Meher Gambhir", "ka": "an79Sm", "area": "Campaigns", "summary": "CX is concerned the footer banner in many of their emails is rendering much wider than expected on desktop in Gmail, Chrome for test sends. It appears aligned correctly in preview.", "tried": ["CX said emails often clip in Gmail, but no normal footer issues before", "Checked footer table/image sizing, reduced 400px max width to 200 did not resolve", "Ran test with test gmail account through preview and sending clone, could not replicate", "CX plans to send campaign in ~6 hours, wanted to confirm anything else to try"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4012844", "replies": 15, "has_files": true, "suggestion_summary": "Alicya suggested the issue could be Gmail clipping or related to the new template editor migration, and advised that since the issue could not be replicated on their end, Meher should reply using the Gmail clipping angle.", "standardized_area": "Campaigns"}, {"date": "2026-06-09", "requester": "Ash Arraiza", "ka": "KwJYB2", "area": "Campaigns", "summary": "Customer created an A/B test campaign, however no one received variation B. The A/B test results tab does not show variation B at all. Customer now wants to resend variation B.", "tried": ["Created segment for customer, expecting closer to 6k profiles based on previous sends", "Cloning campaign shows 21k estimated recipients, unsure where missing 6k went", "Only 4 skipped and 27 bounced profiles in recipient activity", "Verified campaigns not made recently, consistently used", "Segment for variation B yields 0 profiles, variation A yields 14551 profiles", "Linked related bug EXP-392 for A/B test UI issue"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4010450", "replies": 11, "has_files": true, "suggestion_summary": "Alicya checked the Staffside campaign view and confirmed variation B was never sent, then recommended escalating to Business Licensing as it was unclear whether the issue stemmed from a platform incident or the linked UI bug (EXP-392).", "standardized_area": "Campaigns"}, {"date": "2026-06-04", "requester": "Ash Arraiza", "ka": "tNPZ9N", "area": "Lists & Segments", "summary": "Cloning segments between accounts is successful, however the segment conditions are not copied.", "tried": ["Ensured user is Admin in all accounts", "Ensured matching custom properties exist in UK account", "Checked linear for known bugs", "Checked/followed troubleshooting segments guide"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001556", "replies": 8, "has_files": true, "suggestion_summary": "Alicya clarified that 'contains text' conditions are not necessarily advanced operators, and recommended escalating to Business Licensing for confirmation while also requesting an update to the internal KB article on cross-account segment cloning.", "standardized_area": "Lists & Segments"}, {"date": "2026-06-02", "requester": "Ash Arraiza", "ka": "QCN2d7", "area": "Catalogs & Feeds", "summary": "Back in stock reports tab loads indefinitely.", "tried": ["Did not replicate in 2 test accounts (paid and free)", "User attempting action is an Admin", "Re-attempted from incognito window"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3995864", "replies": 17, "has_files": true, "suggestion_summary": "Alicya confirmed the same 500 internal server error in the customer's account (Back in Stock Reports tab) but could not replicate it in test accounts. She recommended escalating to Business Licensing.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-06-02", "requester": "Meher Gambhir", "ka": "WKMDP9", "area": "Flows", "summary": "Customer states they have not received any internal alert notifications from this flow since 21st May. Alerts should send if more than 20mins since checkout started (amount higher than $1000). Receiving multiple alerts a day on 21 May and prior but it suddenly stopped.", "tried": ["Toggled alert from Live to Draft and back to Live, no other changes made in history", "Appears could be similar to FP-1788 bug (internal alert no longer sending)", "Tried to spot check profiles, could not find example with 20min gap post 21st May"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3991689", "replies": 12, "has_files": true, "suggestion_summary": "Alicya found many recent skips in the flow evaluation due to 'No recipients', visible even on the day of the query. She suggested asking the customer to check their internal alert recipient details (consent status), and linked Linear bug FP-1817 as a likely cause if profiles show a green checkmark but still aren't receiving alerts.", "standardized_area": "Flows"}, {"date": "2026-05-27", "requester": "Ash Arraiza", "ka": "PaDxZ9", "area": "Accounts", "summary": "Customer cannot bulk suppress this segment.", "tried": ["Drafted new segment, found only 99 profiles suppressed in last 90 days", "User is admin, should be able to suppress", "Checked Linear for related tickets"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3985709", "replies": 4, "has_files": true, "suggestion_summary": "Alicya checked Splunk and confirmed the bulk suppression job was accepted but not yet processed; she suggested waiting a few hours to see if profiles update, and if still not suppressed, to comment on the related Linear ticket ICM-599. Ash later confirmed profiles were still not suppressed after several hours and added the ticket to Linear.", "standardized_area": "Accounts"}, {"date": "2026-05-26", "requester": "Meher Gambhir", "ka": "RmwB2z", "area": "K-Social", "summary": "CX is trying to connect their Instagram account to the new Social feature, but the connection is not sticking.", "tried": ["Asked CX to follow reconnect flow, error remained", "Verified Instagram permissions, look good against guide", "Checked Developer Tools logs, no related API errors", "Found similar ticket with Instagram API Error 10 insufficient permissions", "Had CX reauthorise Facebook, worked briefly then kept disconnecting"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3983038", "replies": 10, "has_files": true, "suggestion_summary": "Alicya suggested verifying the customer has Admin/Editor/Full Control on their Facebook/Meta assets for the Instagram Business account, and asked Meher to collect screenshots of both Facebook Page Advanced Messaging settings (Connected Apps > Klaviyo-IG) and Instagram Website Permissions to confirm all required permissions are enabled. If the issue persists after confirming permissions, the recommendation was to link the similar ticket and escalate to BL.", "standardized_area": "K-Social"}, {"date": "2026-05-18", "requester": "Ash Arraiza", "ka": "V6acte", "area": "Integrations", "summary": "Shopify Added to Cart is not firing on certain profiles.", "tried": ["Followed IKB on Shopify New Behavioral Events", "Could not replicate on test accounts", "Ran PostmanLite, response shows CONNECTED", "Fetched customers in SS, appear as they do in Klaviyo", "Ensured Track Behavioural Events is enabled", "Test pixel received product_added_to_cart and page_viewed but now Viewed Collection issues", "Business located in Portugal, EU consent restrictions considered"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3957250", "replies": 3, "has_files": true, "suggestion_summary": "Alicya tested on desktop and mobile but couldn't replicate the issue, and noted that incognito browsing should always trigger fresh cookie acceptance. She advised telling the customer the issue is likely on their end since it can't be replicated, and to escalate to the BL team.", "standardized_area": "Integrations"}, {"date": "2026-05-14", "requester": "Chris Yinfoo", "ka": "Y9yRLy", "area": "Lists & Segments", "summary": "Wants to show lifecycle tracked within segments for each 'Child' custom object (e.g. infants aged 3-12 months). Segment showed 0 profiles, even with Child property set. Waited 30+ mins, no updates.", "tried": ["Data appears in place but segment isn't picking it up", "Tried different conditions matching the profile", "Waited time after creating segment for delayed results"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3962610", "replies": 4, "has_files": true, "suggestion_summary": "Alicya created a test segment and noted it can take up to 20 minutes to populate per the KB. If it still doesn't work, she linked a known Linear issue (GPLAT-425) and advised asking the SA (Bella) to follow up directly in the Linear ticket to flag urgency, since the bug is in backlog with no ETA.", "standardized_area": "Lists & Segments"}, {"date": "2026-05-12", "requester": "Chris Yinfoo", "ka": "VD2Qzs", "area": "Flows", "summary": "Customer observed emails taking longer than 1-2mins to send from flow (no delay step but maybe conditional split steps).", "tried": ["Previous agent explained splits/filters add processing time and re-checking of qualification at each send step", "Customer came back with attached queries"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3954968", "replies": 9, "has_files": true, "suggestion_summary": "Alicya noted she had a similar delay issue that gradually improved, and that 3 minutes is still within the acceptable grace period per an existing Slack thread. She recommended sending the customer David's example response about expected flow send times.", "standardized_area": "Flows"}, {"date": "2026-05-08", "requester": "Meher Gambhir", "ka": "LnETuM", "area": "K-Service", "summary": "Email showing as Failed in Klaviyo, but customer's testing suggests email flow is working. Test email reached Helpdesk, landed in Spam, Helpdesk reply successfully received at external address. Trying to understand why status still shows Failed and target main issue of emails going into Helpdesk spam classification.", "tried": ["CX confirmed Microsoft 365 forwarding rule set correctly, external forwarding allowed", "CX sent test email, reached Klaviyo Helpdesk but lande area": "Compliance"}, {"date": "2026-02-17", "requester": "Chris Yinfoo", "ka": "P47R2f", "area": "Flows", "summary": "Customer recently updated ecomm store from Woo to Shopify. Price drop flow cloned from original one, want to ensure it references Shopify products only.", "tried": ["Clicking Price drop report link, still see woo products", "Tried updating timeframe to see if changed anything, still present", "Woo disabled as of 17th Feb, Shopify active", "Unsure how to confirm it will reference Shopify going forward"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3764988", "replies": 12, "has_files": true, "suggestion_summary": "Alicya found the account was still mapped to the old BigCommerce integration, causing the Price Drop flow to behave unexpectedly. She recommended removing the BigCommerce integration, purging the catalog, and resyncing solely from Shopify.", "standardized_area": "Flows"}, {"date": "2026-02-13", "requester": "Ash Arraiza", "ka": "UksXRm", "area": "Campaigns", "summary": "Cx cannot clone campaign to another account (from AU to NZ accounts).", "tried": ["Confirmed customer is Admin on both accounts", "Cleared cache and tried incognito", "Page gets to loading screen then stays frozen 1+ hours", "Tried adding list into recipients with/without profile", "Cloned campaign for customer to try, issue persists"], "ticket_url": "", "replies": 2, "has_files": true, "suggestion_summary": "The campaign clone freeze between AU and NZ accounts resolved itself without intervention — Ash confirmed it fixed with patience and linked related bug reports BUGPORT-10542 and BUGPORT-10575 for reference.", "standardized_area": "Campaigns"}, {"date": "2026-02-11", "requester": "Chris Yinfoo", "ka": "UxmzeY", "area": "Integrations", "summary": "Historical sync appears stalled at 98%.", "tried": ["Noticed 500 error initially, supplied info", "Progressed but now close to 98%", "Can see failed historical sync with one retry", "Wondering if re-queue would make a difference"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3734262", "replies": 15, "has_files": false, "suggestion_summary": "Alicya suggested increasing the integration's connection_timeout setting (to around 50) to resolve the 503 timeout errors, then waiting until the expected sync completion date to see if it succeeds.", "standardized_area": "Integrations"}, {"date": "2026-02-09", "requester": "Chris Yinfoo", "ka": "TVPP9H", "area": "Lists & Segments", "summary": "Customer believes they meet criteria for CLV however notices a message when looking into a profile.", "tried": ["Checked through Predictive Analytics criteria, looks to be met", "Wondering what might have been missed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3736907", "replies": 9, "has_files": true, "suggestion_summary": "Alicya found the issue was caused by incorrect metric mapping — Placed Order was mapped to an individual item metric, so revenue couldn't be calculated. She recommended the customer remap their metrics following the predictive analysis guide.", "standardized_area": "Lists & Segments"}, {"date": "2026-02-04", "requester": "Chris Yinfoo", "ka": "MBqXVi", "area": "Campaigns", "summary": "Customer would like SMS usage figures for period January - Dec 2025, but current view only does last 12 months.", "tried": ["Checked IKB but not sure that is quite right"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3720575", "replies": 8, "has_files": true, "suggestion_summary": "Alicya suggested escalating to the Billing team to get the customer a usage report, and noted that a custom report on API usage may also be possible.", "standardized_area": "Campaigns"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "VGeZHB", "area": "Integrations", "summary": "Same request works from laptop via curl (HTTP 201 Created), but fails from n8n Cloud with Cloudflare block page.", "tried": ["Asked for more info about API call being blocked"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3688264", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed this is a standard IP whitelisting issue and directed the customer to follow the relevant steps.", "standardized_area": "Integrations"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "Wqcbfr", "area": "Catalogs & Feeds", "summary": "Customer updated inventory for an item, wondering why BIS report still says queued for some products with same name.", "tried": ["Looked through examples in BIS report, SKU ID different from Shopify ID", "Found they have custom catalog sync as well, asked customer if aware", "Customer had no idea about custom catalog, asked to disconnect API catalog"], "ticket_url": "", "replies": 24, "has_files": true, "suggestion_summary": "Alicya walked through the options: either fix the custom catalog feed with developer help, or delete it entirely and resync using the Shopify catalog (noting this would affect Back-in-Stock). She recommended clarifying with the customer which path they prefer.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "X6M5Pn", "area": "Catalogs & Feeds", "summary": "Localised product feed links issue.", "tried": ["Lot of back and forth already, need advice on next best approach"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3642269", "replies": 16, "has_files": false, "suggestion_summary": "Alicya identified that the product URL in the customer's custom catalog feed was syncing with the incorrect URL, and recommended they fix it in their feed. She also suggested looping in the CSM to alert them to the situation.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "sqUwG2", "area": "Integrations", "summary": "Customer's Shopify Onsite Tracking says 'Turned Off', however they see message in Shopify advising it's Activated.", "tried": ["Used Get App Embed Metafields, can see if actually false", "Considering Reset App Embed Metafields steps"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3659792", "replies": 2, "has_files": true, "suggestion_summary": "Alicya suggested following the existing guide carefully and making sure the Save button is clicked, then asking the customer for a screen recording if the issue persists.", "standardized_area": "Integrations"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "3670894", "area": "Integrations", "summary": "Customer has API between custom website and Klaviyo, discount codes all have same expiry date. Need codes for sunset flow to be evergreen with varying time periods. Asking if Klaviyo can tell website how many codes needed and duration via API call.", "tried": ["Still trying to wrap head around their situation"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3670894", "replies": 15, "has_files": false, "suggestion_summary": "Alicya explained that coupon expiry must be set as a fixed date (not a relative period like '14 days'), but leaving it blank defaults to 1-year expiry from when the profile enters the flow. She suggested asking in #ask-apis about adding a relative expiry option.", "standardized_area": "Integrations"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
const CHART_COLORS=["#4A154B","#007aff","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#ffcc00","#8e8e93","#30b0c7","#ff2d55","#5856d6"];
function getAreaCounts(){const counts={};QUESTIONS.forEach(q=>{counts[q.area]=(counts[q.area]||0)+1;});return Object.entries(counts).sort((a,b)=>b[1]-a[1]);}
function filterByArea(area){const sel=document.getElementById("areaFilter");sel.value=sel.value===area?"":area;renderTable();}
function renderChart(){
  const counts=getAreaCounts();
  const total=QUESTIONS.length;
  const activeArea=document.getElementById("areaFilter")?document.getElementById("areaFilter").value:"";
  let cumulative=0;
  const gradientParts=counts.map(([area,count],i)=>{
    const pct=total?count/total*100:0;
    const start=cumulative;
    cumulative+=pct;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    return `${color} ${start}% ${cumulative}%`;
  });
  document.getElementById("donutChart").style.background=gradientParts.length?`conic-gradient(${gradientParts.join(",")})`:"#e5e5ea";
  document.getElementById("donutTotal").textContent=total;
  document.getElementById("donutLegend").innerHTML=counts.map(([area,count],i)=>{
    const color=CHART_COLORS[i%CHART_COLORS.length];
    const pct=total?((count/total)*100).toFixed(1):"0.0";
    const isActive=activeArea===area;
    return `<div class="legend-item${isActive?" active":""}" onclick="filterByArea('${area.replace(/'/g,"\\'")}')"><span class="legend-swatch" style="background:${color}"></span><span class="legend-label">${esc(area)}</span><span class="legend-count">${count}</span><span class="legend-pct">${pct}%</span></div>`;
  }).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  renderChart();
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderChart();renderTable();
</script>
