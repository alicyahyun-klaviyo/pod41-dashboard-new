<style>
  :root { color-scheme: light; }

  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; }

  .area-tag { display: inline-block; background: #f0e8f1; color: #4A154B; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 500; max-width: 180px; word-break: break-word; }
  .expand-row td { padding: 0; background: #fdf8fe; border-bottom: 2px solid #e5d6e8; }

  .expand-section li { font-size: 13px; color: #3a3a3c; line-height: 1.5; margin-bottom: 4px; }

  .expand-suggestion-box .suggestion-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
  .expand-suggestion-box .suggestion-body h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #1a7f37; margin-bottom: 5px; }
  .expand-suggestion-box .suggestion-body p { font-size: 13px; color: #1d3826; line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px; color: #8e8e93; font-size: 13px; }
  .no-suggestions { color: #8e8e93; font-size: 12px; font-style: italic; }

<script>
const QUESTIONS=[{"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow  Debugger - https://www.klaviyo.com/staff/flows/debug/flows2/canvas?fesEndDate=2026-07-15&fesSta[…]2026-06-30&flowId=RDyjaJ&profileId=01KWCK2XW4Y5EMF3ESJC4PZ4ZC", "tried": ["No recent changes to flow", "No filters to trigger or emails", "Fairly straightforward setup", "Debugger suggests its stuck?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4070534", "replies": 9, "has_files": true, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account does have the custom action step The Nile AU (VjxEiY), however their other account The Nile NZ (RiJWfQ) does not  They are under the same family billing", "tried": ["Between the two accounts they have over 400k active profiles", "Came across this, which looks similar and slack thread", "What is the best way to check an account is on Flows 2 and if so, can I give the same explanation as Ellie in the case or should I ask in the slack first?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4071307", "replies": 13, "has_files": true, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "• Onsite JS crashes on every page load on mreatwell.com with the Error: undefined reading 'customerHubOnboarded'. • Comes from build-preview/commit-55449364d6d533811c1ff6d9c2ca2e8339925a83/atlas.js. • Customer Hub is not enabled on this account. • Customer's HAR shows fast.a.klaviyo.com/atlas/api/public/settings/Vdbaf7 returns 404.", "tried": ["this customer is requesting a lot of information that I'm not sure how to source.", "I've already told the customer the `build-preview/commit-{hash}` path is part of our standard rolling deployment process, not a beta or preview environment.", "ty team :sadge-sip:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": true, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-15", "requester": "Chris Yinfoo", "ka": "Rn572y", "area": "Flows", "summary": "It appears 'Viewed Product' log is appearing twice for once instance of viewing the item on their site", "tried": ["The two instances would therefore appear in their flow setup when they only expect one", "Confirmed with the customer, they only recall setting up the integration via Klaviyo and have never encountered this before with other brands", "In this previous case it was deemed that there was two different scripts and the customer was instructed to remove the duplicate script", "However, the customer today mentioned \"I'm concerned that removing it may cause complications or affect other functionalities within the store.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4020964", "replies": 11, "has_files": true, "suggestion_summary": "Alicya identified the duplicate 'Viewed Product' events as coming from two sources — one client-side via Klaviyo and one server-side via a third-party app (WeTracked). She suggested the customer contact the third-party app to remove their tracking script if they want to eliminate the duplicate events from their flow.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Ash Arraiza", "ka": "UrbgMW", "area": "Templates", "summary": "• Previewing the template as your own profile does not show dynamic content. Example: • Person A previews the template with Person A's email. • Person A does not see any dynamic content. • Person B previews the same template as Person A • Person B can see Person A's dynamic content", "tried": ["Had the customer clear cache and cookies from all time", "Got them to log out and log back in", "Got them to try in a private browser", "Got them to try in a different browser (edge and chrome)", "verified we're working in the same account and same template", "Cloned the template and still seeing the issue", "User is an Admin", "I've observed and clarified with the customer, that in the loom, the customer is not able to see the \"custom properties\" section in the preview and test page only when previewing with her own test profile.", "I don't believe that's expected behaviour, however would like to clarify before potentially esco'ing this to :garfield_b: :garfield_l:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001172", "replies": 23, "has_files": true, "suggestion_summary": "Alicya explained that simply seeing their name pre-filled in the preview pane doesn't mean their profile is selected — the user needs to actively retype their email address and select it from the dropdown. She recommended Ash create a Loom to demonstrate the correct preview steps to the customer.", "standardized_area": "Templates"}, {"date": "2026-06-10", "requester": "Meher Gambhir", "ka": "an79Sm", "area": "Campaigns", "summary": "CX is concerned the footer banner in many of their emails is rendering much wider than expected on desktop in Gmail, Chrome for test sends. It appears aligned correctly in preview.", "tried": ["CX said their emails often clip in Gmail, but they have not normally had footer issues from that before, so clipping does not seem to fully explain this case.", "I checked the footer table/ image sizing. The image cell had a 400px max width, but reducing that to 200 did not resolve the issue on CX end.", "Ran a test with my test gmail acc. Both through preview and test option and actually sending a clone of the campaign to myself. Could not replicate issue on my end.", "CX plans to send campaign out in around 6 hours from now, so wanted to confirm if there is anything else I can do for them to try fix this."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4012844", "replies": 15, "has_files": true, "suggestion_summary": "Alicya suggested the issue could be Gmail clipping or related to the new template editor migration, and advised that since the issue could not be replicated on their end, Meher should reply using the Gmail clipping angle.", "standardized_area": "Campaigns"}, {"date": "2026-06-09", "requester": "Ash Arraiza", "ka": "KwJYB2", "area": "Campaigns", "summary": "• Customer created an A/B test campaign, however no one received the variation B. • The A/B test results tab does not show variation B at all.", "tried": ["Created a segment for the customer to use, however they are expecting this to be closer to 6k profiles.", "When I clone the campaign, it shows 21k estimated recipients. So I'm unsure where the missing 6k profiles went.", "there are only 4 skipped profiles and 27 bounced profiles in recipient activity", "verified with customer that the campaigns were not made recently, and she's been using them consistently.", "Creating a segment for profiles who have received variation B yields 0 profiles.", "Creating a segment for profiles who have received variation A yields 14551 profiles.", "Basically, I'm unsure if this is related to the incident this morning.", "I've already linked the bug for the A/B test UI issue."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4010450", "replies": 11, "has_files": true, "suggestion_summary": "Alicya checked the Staffside campaign view and confirmed variation B was never sent, then recommended escalating to Business Licensing as it was unclear whether the issue stemmed from a platform incident or the linked UI bug (EXP-392).", "standardized_area": "Campaigns"}, {"date": "2026-06-04", "requester": "Ash Arraiza", "ka": "tNPZ9N", "area": "Lists & Segments", "summary": "• cloning segments between accounts is successful, however the segment conditions are not copied.", "tried": ["ensured user is an Admin in all accounts.", "ensured the matching custom properties do exist in the UK account", "checked linear for any known bugs.", "checked/followed this guide:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001556", "replies": 8, "has_files": true, "suggestion_summary": "Alicya clarified that 'contains text' conditions are not necessarily advanced operators, and recommended escalating to Business Licensing for confirmation while also requesting an update to the internal KB article on cross-account segment cloning.", "standardized_area": "Lists & Segments"}, {"date": "2026-06-02", "requester": "Ash Arraiza", "ka": "QCN2d7", "area": "Catalogs & Feeds", "summary": "• Back in stock reports tab loads indefinitely.", "tried": ["Did not replicate this issue in 2 test accounts", "*Cecilia's Basecamp* (XDLpgg) paid account, *Ash A Test Account* (UvCpx3) free account", "User attempting the action is an Admin (kate.leveille@bycharlotte.com.au)", "Re-attempted from incognito window.", "Can I esco to BL :eyes2:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3995864", "replies": 17, "has_files": true, "suggestion_summary": "Alicya confirmed the same 500 internal server error in the customer's account (Back in Stock Reports tab) but could not replicate it in test accounts. She recommended escalating to Business Licensing.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-06-02", "requester": "Meher Gambhir", "ka": "WKMDP9", "area": "Flows", "summary": "Customer states they have not received any internal alert notifications from this flow since 21st May. Alerts should be sending if there has been more than 20mins since since checkout started (with amount higher than $1000). They were receiving multiple alerts in a day on the 21st of May and prior but it suddenly stopped.", "tried": ["Toggled the alert from Live to Draft and back to Live. No other changes made in history", "Appears could be similar to FP-1788 bug", "Tried to spot check profiles but could not find an example where there was a 20min gap between checkout started and placed order and it was post 21st May"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3991689", "replies": 12, "has_files": true, "suggestion_summary": "Alicya found many recent skips in the flow evaluation due to 'No recipients', visible even on the day of the query. She suggested asking the customer to check their internal alert recipient details (consent status), and linked Linear bug FP-1817 as a likely cause if profiles show a green checkmark but still aren't receiving alerts.", "standardized_area": "Flows"}, {"date": "2026-05-27", "requester": "Ash Arraiza", "ka": "PaDxZ9", "area": "Accounts", "summary": "• Customer cannot bulk suppress this segment.", "tried": ["Drafted a new segment within their account and found that only 99 profiles were suppressed in the last 90 days.", "User is an admin, so they should be able to suppress this segment.", "Checked Linear for any related tix."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3985709", "replies": 4, "has_files": true, "suggestion_summary": "Alicya checked Splunk and confirmed the bulk suppression job was accepted but not yet processed; she suggested waiting a few hours to see if profiles update, and if still not suppressed, to comment on the related Linear ticket ICM-599. Ash later confirmed profiles were still not suppressed after several hours and added the ticket to Linear.", "standardized_area": "Accounts"}, {"date": "2026-05-26", "requester": "Meher Gambhir", "ka": "Rmwb2z", "area": "K-Social", "summary": "CX is trying to connect their Instagram account to the new Social feature, but the connection is not sticking.", "tried": ["Asked CX to follow the reconnect flow from the Klaviyo error message. They completed it, including the prompt saying they had already connected to Klaviyo and could continue allowing access, but the error remained.", "Verified the Instagram permissions and they look all good against our guide.", "Checked Developer Tools logs and found no related API errors. I also found a similar ticket where Cecilia saw Instagram API Error 10: (#10) Insufficient permissions to access this data. I then had CX reauthorise Facebook. This worked briefly, but kept disconnecting again shortly after. They tried mutiple times after but the disconnection error did not go away."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3983038", "replies": 10, "has_files": true, "suggestion_summary": "Alicya suggested verifying the customer has Admin/Editor/Full Control on their Facebook/Meta assets for the Instagram Business account, and asked Meher to collect screenshots of both Facebook Page Advanced Messaging settings (Connected Apps > Klaviyo-IG) and Instagram Website Permissions to confirm all required permissions are enabled. If the issue persists after confirming permissions, the recommendation was to link the similar ticket and escalate to BL.", "standardized_area": "K-Social"}, {"date": "2026-05-18", "requester": "Ash Arraiza", "ka": "V6acte", "area": "Integrations", "summary": "• Shopify Added to Cart is not firing on certain profiles  • mariana.vasconcelos@piranha.com.pt • ruben.matos@piranha.com.pt", "tried": ["Followed IKB for Shopify New Behavioral Events via Integration", "Could not replicate issue on my test accounts.", "Ran PostmanLite and response shows \"CONNECTED\"", "Fetched both example customers in SS, and both appear as they do in Klaviyo.", "Ensured Track Behavioural Events is enabled", "Sent the advanced steps macro", "When the customer tested the test pixel, they reported product_added_to_cart and page_viewed were received, but are now reporting issues with Viewed Collection.", "Business is located in Portugal and falls under EU consent restrictions, customer confirmed multiple times they accepted cookies before adding to cart.", "Customer still having issues and asking to escalate."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3957250", "replies": 3, "has_files": true, "suggestion_summary": "Alicya tested on desktop and mobile but couldn't replicate the issue, and noted that incognito browsing should always trigger fresh cookie acceptance. She advised telling the customer the issue is likely on their end since it can't be replicated, and to escalate to the BL team.", "standardized_area": "Integrations"}, {"date": "2026-05-14", "requester": "Chris Yinfoo", "ka": "Y9yRLy", "area": "Lists & Segments", "summary": "For context we want to show the lifecycle we'd track within segments for each 'Child' object. E.g., for a segment of 'infants aged 3months-12months' using a segment definition, it showed 0 profiles, so then even using a segment of having the Child property set was showing 0 profiles too. Waited 30+ mins to see if it would populate but no updates.", "tried": ["Looks like data is in place but the segment isn't picking this up", "Tried didn't conditions which match the profile", "Waited some time after creating the segment to see if results were delayed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets  "https://klaviyo.zendesk.com/agent/tickets/3734262", "replies": 15, "has_files": false, "suggestion_summary": "Alicya suggested increasing the integration's connection_timeout setting (to around 50) to resolve the 503 timeout errors, then waiting until the expected sync completion date to see if it succeeds.", "standardized_area": "Integrations"}, {"date": "2026-02-09", "requester": "Chris Yinfoo", "ka": "TVPP9H", "area": "Lists & Segments", "summary": "The customer believes they meet the criteria for CLV however they notice the message when looking into a profile", "tried": ["Checked Predictive Analytics HC article", "Checked through criteria, seems to be the case they meet them", "Question on what might have been missed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3736907", "replies": 9, "has_files": true, "suggestion_summary": "Alicya found the issue was caused by incorrect metric mapping — Placed Order was mapped to an individual item metric, so revenue couldn't be calculated. She recommended the customer remap their metrics following the predictive analysis guide.", "standardized_area": "Lists & Segments"}, {"date": "2026-02-04", "requester": "Chris Yinfoo", "ka": "MBqXVi", "area": "Campaigns", "summary": "The customer would like the figures for the usage graph but for the period January - Dec 2025. The current view only does last 12 months", "tried": ["Checked out IKB, not sure that is quite right"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3720575", "replies": 8, "has_files": true, "suggestion_summary": "Alicya suggested escalating to the Billing team to get the customer a usage report, and noted that a custom report on API usage may also be possible.", "standardized_area": "Campaigns"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "VGeZHB", "area": "Integrations", "summary": "The exact same request works from laptop via curl (HTTP 201 Created), but fails from n8n Cloud with a Cloudflare block page (\"Sorry, you have been blocked / unable to access klaviyo.com\"). Blocked IP shown: 20.79.32.39, Cloudflare Ray ID: 9c3c44510c54367f", "tried": ["Asked for more information about the API call being made, customer provided detail", "Question whether usual for IP to be blocked and anything that can be done"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3688264", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed this is a standard IP whitelisting issue and directed the customer to follow the relevant steps.", "standardized_area": "Integrations"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "Wqcbfr", "area": "Catalogs & Feeds", "summary": "The customer updated their inventory for an item and wondering why the BIS report still says queued for some products with the same name", "tried": ["Looked through examples in BIS Report, noticed SKU ID different from Shopify ID", "Found they have a custom catalog sync as well, asked customer if aware of this/who set it up", "Customer responded unaware of custom catalog, asked if API catalog can be disconnected"], "ticket_url": "", "replies": 24, "has_files": true, "suggestion_summary": "Alicya walked through the options: either fix the custom catalog feed with developer help, or delete it entirely and resync using the Shopify catalog (noting this would affect Back-in-Stock). She recommended clarifying with the customer which path they prefer.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "X6M5Pn", "area": "Catalogs & Feeds", "summary": "• Localised product feed links", "tried": ["A lot of back and forth already, need advice on next best approach"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3642269", "replies": 16, "has_files": false, "suggestion_summary": "Alicya identified that the product URL in the customer's custom catalog feed was syncing with the incorrect URL, and recommended they fix it in their feed. She also suggested let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
