<script>
const QUESTIONS=[{"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "Vbxg9f", "area": "Flows", "summary": "Flow webhook activity showing many skipped", "tried": ["Tried to compare examples which worked vs didn't but haven't quite found a reason", "When trying the test request, see the following details", "Any other logs we can check or review further?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165180", "replies": 6, "has_files": true, "suggestion_summary": "Alicya identified the webhook was a non-Klaviyo (customer-owned) webhook, suggesting the skipped activity was likely due to an issue on the receiving end, and recommended checking in with the webhook owner directly.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "ThEqHV", "area": "Sign Up Forms", "summary": "Customer has one Klaviyo parent account (SINGER - ThEqHV ) with multiple child accounts.  Their previous WooCommerce child-account setup has transitioned to BigCommerce, and they are unable to configure flows or use Klaviyo for marketing across their BigCommerce Multi-Storefront setup.  • SINGER® was the only brand originally on BigCommerce • All our other brands — AccuQuilt, PFAFF, Husqvarna Viki", "tried": ["The first/second image is for some context on the direction which the migration process is heading", "If we look specifically at their recent sign up form query, they said they saw the SINGER form on the ricoma site. However when checking the form, I'm not seeing any targeting to limit this to Singer only", "I advised they need to have targeting, which they said apparently the did, however in their most recent response  \"The form shown in my screenshot is the correct SINGER form for the SINGER website.\"  I'm not seeing this?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115668", "replies": 12, "has_files": true, "suggestion_summary": "Confirmed the JavaScript/integration setup was correct on the parent account, and identified that the customer's sign-up form was missing the targeting needed to limit the Singer form to the Singer site; Alicya and Chris planned to huddle to walk through the full BigCommerce multi-storefront migration (forms, flows, list structure) together.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "PDQku2", "area": "Catalogs & Feeds", "summary": "• Unable to save new product feed • Existing product feed is not available to select when adding a product block into email", "tried": ["Tested with a clone campaign and new campaign and no joy", "Not able to replicate in my test account"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4166614", "replies": 20, "has_files": true, "suggestion_summary": "Found a 403 error in the network tab when creating a new product feed and adding a product block to the campaign, which appeared to be unexpected behaviour; Alicya recommended escalating the issue to Backline.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-08", "requester": "Ash Arraiza", "ka": "UJFV9p", "area": "Flows", "summary": "• Profiles are processed through the conditional split, but then they aren't being queued for the message afterwards. See screenshots.", "tried": ["checked skipped messages, email does not appear", "checked scheduled messages, email does not appear", "checked flow debugger, queuing appears complete?", "no filters on the flow", "no previous time delay blocks between the split and the message.", "similar bugs: , ,", "Might be this one?  but profiles aren't entering the \"waiting\" stage."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164569", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found the split action shared the same action ID as another block, which didn't match any known flow bugs, so she recommended escalating to have engineering create a new bug ticket.", "standardized_area": "Flows"}, {"date": "2026-09-08", "requester": "Meher Gambhir", "ka": "KSMVzB", "area": "Email Deliverability", "summary": "Legitimate profiles are being suppressed by BOT_PROTECTION through consent webhooks from unrelated accounts", "tried": ["CX has a WooCommerce Integration in this acc", "Both profiles had integration consent events with no IP or user agent", "Created segment to unsuppress for CX", "No duplicate integration for this account", "Could it be related to this bug: ICM-1282"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165362", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed the profiles were suppressed by subscription protection (visible via Splunk calls from multiple account IDs) and, since the customer confirmed they were legitimate, advised linking the known ICM-1282 bot-protection bug ticket.", "standardized_area": "Email Deliverability"}, {"date": "2026-09-08", "requester": "Chris Yinfoo", "ka": "VyhTNh", "area": "Integrations", "summary": "Prestashop integration is enabled however the customer is not seeing added to cart events  Klaviyo,js script does not appear to be present however this should be added automatically?", "tried": ["Other events are working", "The customer has navigated to Integrations > Manage Data > Set Up Web Tracking > Add, but nothing happens at all - not even an error message", "Prestashop: 1.7.8.8, Klaviyo module: v1.12.9", "No multi-store, so the API keys are applied at store level", "No integration erros in Staffside", "Modules (no Lightspeed or Cloudflare)"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164460", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found no Klaviyo JS injected on the site at all and pointed to the PrestaShop troubleshooting guide; since the previous agent had already followed it without success, she advised escalating.", "standardized_area": "Integrations"}, {"date": "2026-09-03", "requester": "Ash Arraiza", "ka": "XsDESE", "area": "Templates", "summary": "• Smart translation for Swedish and Swiss High German changes complete images in the template during a live send. • The customer manually changes images depending on the locale, and saves the template. But when the campaign is sent, the image shown ends up reverting to the original.", "tried": ["I tried looking at the web view for the example profile that received the wrong image, but web view shows the correct images.", "I don't have access to view the translations anymore as access expired, but we were able to capture screenshots of the template images manually set per translation.", "Checked linear for any bugs on this and didn't find any bugs specifically for ST reverting template images.", "Checked this article, and I understand it can be changed if manually set, but the issue is that once she saves the template, the live send does not apply the changes."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4145150", "replies": 14, "has_files": true, "suggestion_summary": "Alicya explained that the web view doesn't always reflect what was actually delivered, and pointed Ash to the Staffside template-rendering-artifacts tool (or having the customer forward the actual received email) to confirm which image version was truly sent; since the staff tool failed to load, the plan was to ask the customer to forward screenshots of the received email instead.", "standardized_area": "Templates"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "<https://klaviyo.zendesk.com/agent/tickets/4151819>", "area": "Sign Up Forms", "summary": "The customer is running into HTTP 503 errors when trying to sign up to their pop up form  *(I have not been able to replicate the issue nor did the previous agent*)", "tried": ["Tried to replicate but haven't been able to", "Request more information from customer on their experience (Alot of information, please read their latest reply in case)", "They have done the usual other tests and apparently they are experiencing the same", "Their previous case closed without resolution so they would like further look, where possible"], "ticket_url": "", "replies": 23, "has_files": false, "suggestion_summary": "Alicya traced the reported 503s to the client/profiles (identify) and onsite/track-analytics calls rather than the client/subscriptions (subscribe) endpoint, and since the team couldn't reproduce the issue and the customer had no screenshot or HAR file confirming the failure, they escalated the ticket to Backline as a sign-up form issue.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "WZcvhJ", "area": "Sign Up Forms", "summary": "Customer is unable to publish their form (There are stats which means it was possible previously)", "tried": ["During my testing, I also found that I'm unable to clone the form but can for others, so something might be up?", "Ruled out missing side image", "Ruled out probability notification percentage notification", "Anything else to check?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4150949", "replies": 5, "has_files": false, "suggestion_summary": "Alicya and Chris found the form also couldn't be cloned and had a buggy image-block deletion, pointing to a broader form-editor bug rather than a config issue, so they escalated to Backline.", "standardized_area": "Sign Up Forms"}, {"date": "2026-08-31", "requester": "Chris Yinfoo", "ka": "XNCrpa", "area": "Catalogs & Feeds", "summary": "The customer has Shopify markets enabled and wants to confirm how to have the correct product URL displayed in their dynamic product feed  \"Could you please confirm how we can make Klaviyo automatically use the Shopify Markets UK product URLs for UK customers, or whether something is still missing in the market/catalog configuration on our account?\"", "tried": ["Referring to this - , does smart translations need to be turned on for localised content to work ? (The customer currently does not have smart translation)", "When I tested in 'Preview & Test' by selecting different profiles, I did display different pricing and link was different", "Does that mean it works without smart translations and they have everything set up as they need?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151091", "replies": 16, "has_files": true, "suggestion_summary": "Confirmed the localized product URL/pricing in the dynamic product feed comes from the Shopify Markets integration itself — Smart Translations is not required, since the customer's product titles were already translated separately.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-08-25", "requester": "Ash Arraiza", "ka": "Yr3S6i", "area": "K-Service", "summary": "• Helpdesk // Gorgias • Inbound SMS messages are syncing to Gorgias successfully, but replies sent from Gorgias are not being delivered from the Klaviyo toll-free number. Meaning customers are not receiving the SMS reply sent from Gorgias. • The expected behaviour is for a Gorgias reply to the Klaviyo-originated SMS ticket to be routed through Klaviyo and sent from the same Klaviyo sending number ", "tried": ["Confirmed the customer is replying through Gorgias, not Klaviyo Helpdesk.", "Followed steps in this IKB, and this one. However, no Gorgias - Opened Ticket metrics have fired.", "Confirmed the test customer is sending the inbound message to the Klaviyo SMS number.", "Confirmed the account has an active Klaviyo toll-free number.", "Confirmed inbound SMS messages are appearing in Gorgias.", "Sync text message conversations is enabled.", "Reviewed the Gorgias ticket screenshot. The ticket is titled Klaviyo SMS, contains the customer's phone number, and uses a synthetic`sms-integrations+...@klaviyo.com`address in the email-style thread which I believe is expected?", "The inbound test messages are tagged `Message Type: unrecognized` rather than normal \"SMS\"", "Transactional SMS consent on the profile is not subscribed, would this be related to this issue?", "This is a linear that appears to describe the same behaviour, however, its been cancelled."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4141388", "replies": 2, "has_files": true, "suggestion_summary": "Inbound SMS replies from Gorgias were not being routed back through Klaviyo's toll-free number to customers even though inbound messages synced correctly; the behavior matched a previously-cancelled Linear ticket (VEX-269) describing the same issue, and the thread ended without a confirmed fix.", "standardized_area": "K-Service"}, {"date": "2026-08-17", "requester": "Ash Arraiza", "ka": "WeEnvL", "area": "Accounts", "summary": "• Active profile count is mismatched against the billing page and profile page.", "tried": ["toggling between the beta and old billing layout makes no difference", "reviewed the segment they suppressed, and confirmed those profiles have been successfully suppressed via the growth tab and checking manually suppressed profiles in the last 1 day.", "customer suppressed at around 10am today.", "no active Linears on this so far.", "can I send to BL?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4128222", "replies": 10, "has_files": true, "suggestion_summary": "Team confirmed this is expected: the billing page's active profile count lags behind actual suppressions by up to a few hours, especially after a large suppression. Advised directing the customer to check the Profiles tab instead of the billing page while it catches up.", "standardized_area": "Accounts"}, {"date": "2026-08-14", "requester": "Ash Arraiza", "ka": "SyikaT", "area": "Templates", "summary": "• The Instagram logo in the social links block is being replaced by 3 images in the connected instagram account, in live preview sends.", "tried": ["tried rebuilding the template from scratch", "tried removing Instagram and re-adding it", "tried from private browser", "tried on the Gmail mobile app", "checked linear, no known issues on this so far", ":pingu-huh: v weird"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4124848", "replies": 21, "has_files": true, "suggestion_summary": "Alicya and Ash could not replicate the issue themselves, but since two different customers reported the same intermittent Instagram logo replacement bug, they agreed to escalate to Backline and linked a similar Linear issue (EDIT-1347: Received Image within header of a campaign send instead of Text).", "standardized_area": "Templates"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "U8hAjh", "area": "Flows", "summary": "The customer is trying to trigger back in stock flow (BigCommerce)  There looks to be issues with how inventory is checked, thus affecting the flow  Looking to confirm the below is related?", "tried": ["Came across this linear and sounds related -", "Doesn't appear to be workaround suggestions?", "\"The first SKU (DFLC6766) was manually reduced to zero stock on Friday, but I raised the stock to the full stock count to trigger the back in stock notification. According to Klaviyo, this SKU hasn't updated since it was taken out of stock on Friday\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4100234", "replies": 5, "has_files": true, "suggestion_summary": "Confirmed the SKU's stock had not been resynced from BigCommerce since it went out of stock, matching a known Linear bug (IEC-987) where BigCommerce webhook-triggered variant syncs can return stale cached inventory. Advised escalating to the SE team since it appears linked to an existing ZD ticket on the same issue.", "standardized_area": "Flows"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "VJBf7Z", "area": "Flows", "summary": "The customer has a webhook action", "tried": ["Compared two profiles and it looks like the one that did not complete has a status of 'QUEUED_FROM_MANUAL'", "The first 5 webhook actions do not currently have any needs review actions", "Anything in their order of operations which explains why many did not process?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115517", "replies": 9, "has_files": true, "suggestion_summary": "QUEUED_FROM_MANUAL means the profile was released from manual review into the sending queue, but that doesn't confirm the message actually sent. The profile had been stuck in that state since Friday with nothing recorded on the webhook side, so this was identified as a likely flow bug and escalated to Backline.", "standardized_area": "Flows"}, {"date": "2026-08-04", "requester": "Ash Arraiza", "ka": "Vh5xLA", "area": "Templates", "summary": "• The template preview hides the last 2 blocks in the template editor.", "tried": ["exported the HTML for the template, and the HTML does *not* contain the missing blocks", "imported that HTML into my test account and verified it does not include the missing blocks", "verified there is no display settings enabled for the blocks or sections", "rebuilt the template from scratch and still seeing the issue", "Selecting a preview profile does not make a difference.", "Selecting an event also does not make a difference.", "hmm can I send to backline?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4104767", "replies": 1, "has_files": true, "suggestion_summary": "Alicya confirmed the missing blocks issue looked unusual/unexpected, but no specific fix or next step had been given yet in the thread.", "standardized_area": "Templates"}, {"date": "2026-08-03", "requester": "Ash Arraiza", "ka": "XSJVww", "area": "Integrations", "summary": "*Shopware* • customers who are already subscribed are getting multiple double opt in emails. • Already found the cause: Payload shows `historical_import: false` on every call, so each resend re-triggers DOI. • Shopware plugin resends full subscriber batch to a DOI list every 11 mins. • Call is `/api/profile-subscription-bulk-create-jobs`", "tried": ["Found 4 prior Zendesk tickets with the same pattern.", "Checked plugin changelog. Fixes exist for 1.14.3/1.14.4, customer is n a documented status code) and told Ash to escalate to SE, flagging that the customer is using the MCP.", "standardized_area": "Templates"}, {"date": "2026-07-30", "requester": "Ash Arraiza", "ka": "SPBxWt", "area": "Flows", "summary": "• Flow message analytics shows very little data, despite hundreds of profiles moving through the initial conditional split. • Profiles that qualified for this flow did not enter.", "tried": ["Created a segment which shows 124 profiles received an email from this flow in the last 7 days.", "Flow entry looks normal (Placed Order) and no filters added to the flow.", "No additional filters on the flow messages", "Drafted a segment for \"received this flow's email in the last 7 days\" and got 124 people. So emails are actually sending, the flow's own analytics tab is just reporting it wrong?", "This account has manually ended A/B tests on this flow twice recently (July 20 and July 29) which could be related to these bugs: FP-2813, FP-3146"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097651", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed this matches the known FP-3146 bug (flow A/B test not recording deliveries correctly), the same pattern she'd seen reported by the CNX team, which explains why flow analytics under-report despite messages actually sending.", "standardized_area": "Flows"}, {"date": "2026-07-29", "requester": "Chris Yinfoo", "ka": "WqX2J6", "area": "Integrations", "summary": "Meta Filled Out Lead Ad metric stopped worked", "tried": ["Can see a 403 authorization Unsupported request - method type: get error for Periodic Sync in SS -", "Asked customer to check their permission settings"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4088889", "replies": 29, "has_files": true, "suggestion_summary": "Team discussed the 403 periodic sync error and confirmed the customer's Meta permissions and TOS acceptance looked fine, so no clear fix was found in-thread. Ash shared that a similar case was resolved by manually restarting the periodic sync via the KB steps, and the team agreed to watch how SE handles this ticket before treating that as a standard practice; ultimately escalated to SE.", "standardized_area": "Integrations"}, {"date": "2026-07-28", "requester": "Ash Arraiza", "ka": "SeZyg2", "area": "Integrations", "summary": "• Custom object properties are not updating despite successful 204 API responses.", "tried": ["Confirmed 204s in Developer Tools > Logs for affected accounts", "Checked Object Manager > Properties — Region, CustomerCategory, PreferredTradeCentre already exist as mapped String properties", "Checked the data source's Sample Payload — cx_region/cx_industry/cx_preferred_trade_centre are recognized schema attributes — rules out schema mismatch", "Reviewed Troubleshooting: Custom Objects but does not call out properties unable to record", "Was previously linked to this linear:", "Customer still reported issues after bug was resolved."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4093882,", "replies": 9, "has_files": true, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail, shown highlighted in a screenshot), but no fix or workaround was shared in the thread beyond acknowledging the issue.", "standardized_area": "Integrations"}, {"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "• Customer sent multiple campaigns, however the recipient count does not match/is significantly lower than the expected count.", "tried": ["Followed this IKB", "RAST is not enabled", "Smart Sending turned off", "No Excluded segments or lists", "Reputation repair disabled", "No Audience filter applied since this is not an omnichannel campaign", "segment was not newly created.", "SS does not show any info on the dropped profiles (as far as I can see), may need help with Splunk logs."], "ticket_url": ns) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "• Onsite JS crashes on every page load on mreatwell.com with the Error: undefined reading 'customerHubOnboarded'. • Comes from build-preview/commit-55449364d6d533811c1ff6d9c2ca2e8339925a83/atlas.js. • Customer Hub is not enabled on this account. • Customer's HAR shows fast.a.klaviyo.com/atlas/api/public/settings/Vdbaf7 returns 404.", "tried": ["this customer is requesting a lot of information that I'm not sure how to source.", "I've already told the customer the `build-preview/commit-{hash}` path is part of our standard rolling deployment process, not a beta or preview environment.", "ty team :sadge-sip:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": true, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-24", "requester": "Chris Yinfoo", "ka": "XEPuyw", "area": "Integrations", "summary": "The customer is seeing the site  setup for their integration however they no longer use this and their site is now   Is it possible to see if they did have the .co.uk site there at some point?", "tried": ["Noticed the customer reaching out did make some changes and asked for c pt", "However, the customer today mentioned \"I'm concerned that removing it may cause complications or affect other functionalities within the store.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4020964", "replies": 11, "has_files": true, "suggestion_summary": "Alicya identified the duplicate 'Viewed Product' events as coming from two sources — one client-side via Klaviyo and one server-side via a third-party app (WeTracked). She suggested the customer contact the third-party app to remove their tracking script if they want to eliminate the duplicate events from their flow.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Ash Arraiza", "ka": "UrbgMW", "area": "Templates", "summary": "• Previewing the template as your own profile does not show dynamic content. Example: • Person A previews the template with Person A's email. • Person A does not see any dynamic content. • Person B previews the same template as Person A • Person B can see Person A's dynamic content", "tried": ["Had the customer clear cache and cookies from all time", "Got them to log out and log back in", "Got them to try in a private browser", "Got them to try in a different browser (edge and chrome)", "verified we're working in the same account and same template", "Cloned the template and still seeing the issue", "User is an Admin", "I've observed and clarified with the customer, that in the loom, the customer is not able to see the \"custom properties\" section in the preview and test page only when previewing with her own test profile.", "I don't believe that's expected behaviour, however would like to clarify before potentially esco'ing this to :garfield_b: :garfield_l:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001172", "replies": 23, "has_files": true, "suggestion_summary": "Alicya explained that simply seeing their name pre-filled in the preview pane doesn't mean their profile is selected — the user needs to actively retype their email add able to suppress this segment.", "Checked Linear for any related tix."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3985709", "replies": 4, "has_files": true, "suggestion_summary": "Alicya checked Splunk and confirmed the bulk suppression job was accepted but not yet processed; she suggested waiting a few hours to see if profiles update, and if still not suppressed, to comment on the related Linear ticket ICM-599. Ash later confirmed profiles were still not suppressed after several hours and added the ticket to Linear.", "standardized_area": "Accounts"}, {"date": "2026-05-26", "requester": "Meher Gambhir", "ka": "Rmwb2z", "area": "K-Social", "summary": "CX is trying to connect their Instagram account to the new Social feature, but the connection is not sticking.", "tried": ["Asked CX to follow the reconnect flow from the Klaviyo error message. They completed it, including the prompt saying they had already connected to Klaviyo and could continue allowing access, but the error remained.", "Verified the Instagram permissions and they look all good against our guide.", "Checked Developer Tools logs and found no related API errors. I also found a similar ticket where Cecilia saw Instagram API Error 10: (#10) Insufficient permissions to access this data. I then had CX reauthorise Facebook. This worked briefly, but kept disconnecting again shortly after. They tried mutiple times after but the disconnection error did not go away."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3983038", "replies": 10, "has_files": true, "suggestion_summary": "Alicya suggested verifying the customer has Admin/Editor/Full Control on their Facebook/Meta assets for the Instagram Business account, and asked Meher to collect screenshots of both Facebook Page Advanced Messaging settings (Connected Apps > Klaviyo-IG) and Instagram Website Permissions to confirm all required permissions are enabled. If the issue persists after confirming permissions, the recommendation was d' object. EG., for a segment of 'infants aged 3months-12months' I was using the below segment definition.\"  \"It showed 0 profiles, so then even using a segment of having the Child property set was showing 0 profiles too. We waited 30+ mins to see if it would populate but no updates.\"", "tried": ["Looks like data is in place but the segment isn't picking this up", "Tried didn't conditions which match the profile", "Waited some time after creating the segment to see if results were delayed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3962610", "replies": 4, "has_files": true, "suggestion_summary": "Alicya created a test segment and noted it can take up to 20 minutes to populate per the KB. If it still doesn't work, she linked a known Linear issue (GPLAT-425) and advised asking the SA (Bella) to follow up directly in the Linear ticket to flag urgency, since the bug is in backlog with no ETA.", "standardized_area": "Lists & Segments"}, {"date": "2026-05-12", "requester": "Chris Yinfoo", "ka": "VD2Qzs", "area": "Flows", "summary": "The customer has observed that emails are taking longer than 1-2mins to send from the flow (No delay step however maybe conditional split steps)", "tried": ["Previous agent mentioned \"If a flow includes a number of splits and filters, it can take longer for profiles to move through it because Klaviyo has to evaluate more decision points before each person can continue down the correct path. Conditional splits act as point-in-time evaluations, and recipients wait there until the scheduled evaluation happens.", "Flow filters also add another layer of processing, since they are checked before each message is sent. That means the system is not only queuing the profile through the flow, but also re-checking whether they still qualify at each send step.\"", "The customer then came back with the attached queries"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3954968", "replies": 9, "has_files": true, "suggestion_summary": "Alicya noted she had a similar delay issue that gradually improved, and that 3 minutes is still within the acceptable grace period per an existing Slack thread. She recommended sending the customer David's example response about expected flow send times.", "standardized_area": "Flows"}, {"date": "2026-05-08", "requester": "Meher Gambhir", "ka": "LnETuM", "area": "K-Service", "summary": "The email enquiries@klevarange.com.au is showing as Failed in Klaviyo, but the customer's testing suggests the email flow is working. Their test email reached Helpdesk, landed in Spam, and the Helpdesk reply was successfully received at their external address. I am trying to understand why the status still shows Failed in Klaviyo, what that means for the customer, and how to target the main issue ", "tried": ["CX confirmed the Microsoft 365 forwarding rule is set correctly and external forwarding is allowed.", "CX sent a test email from a personal address to enquiries@klevarange.com.au, email did reach Klaviyo Helpdesk, but it landed in Spam.", "Also confirmed the reply from Helpdesk made it back to their external address.", "To resolve he tried to mark the set up as done but came across error as it was pending for a while but then went back to failed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3952094", "replies": 8, "has_files": true, "suggestion_summary": "Alicya advised following the internal KB troubleshooting steps for 'Failed' vs 'Verified' status, and suggested temporarily changing the forwarding destination to reset the connection. If it still shows Failed after that, escalate to the BL team.", "standardized_area": "K-Service"}, {"date": "2026-05-08", "requester": "Ash Arraiza", "ka": "L2xQqw", "area": "Integrations", "summary": "Customer is trying to track a custom Started Checkout metric via GTM on their Shopify checkout page. However it is not firing.", "tried": ["The Klaviyo SDK is loading and the cookie is being set, but `_learnq.push()` is returning `false` and `window.klaviyo.track()` does not resolve. Checked network requests and no network requests are reaching Klaviyo's servers at all.", "The SDK modules are loading from `/build-preview/commit-e8d40ef5af5b50e43b0d4d90880633d2fd87e3ca/` paths (not really sure what this means tbh)", "Confirmed metric has never received events in the account", "Tested with test email. Clicked welcome email to cookie browser > went through checkout > no event appeared on my test profile", "Confirmed via DevTools that GTM and `klaviyo.js` are not loading on the Shopify checkout domain (separate domain issue)", "Researched build-preview paths and confirmed this is normal production versioning, not the cause (used :claude-explode: here)", "Suspect CSP blocking outbound requests to Klaviyo domains, or consent settings silencing the SDK — but `_learnq.push()` returning `false` is undocumented behaviour and I'd like input before potentially escalating", "Is this still within our jurisdiction to troubleshoot?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3949525", "replies": 19, "has_files": false, "suggestion_summary": "Alicya found an SA wiki page confirming custom Started Checkout events can work with GTM, and advised gathering more details from the customer (code snippets, exact setup) before escalating to the SE team — including the wiki doc in the escalation note for context.", "standardized_area": "Integrations"}, {"date": "2026-04-29", "requester": "Chris Yinfoo", "ka": "LWjHvK", "area": "Lists & Segments", "summary": "The customer noticed a large drop in their segment growth which was out of the norm from their observations", "tried": ["Checked some some profiles from the 24th April and interestingly they are 'Never Subscribed' status", "The first criteria is can receive email marketing because 'Subscribed'", "Cannot see any segment definition changes", "Customer is not aware of any API or external applications which could be make changes", "Not seeing any dev logs for the profiles", "Examples appear to have a subscribed to email marketing event that took place a long time ago"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3930031", "replies": 9, "has_files": true, "suggestion_summary": "Alicya flagged that profiles going from 'Subscribed' to 'Never Subscribed' is unusual and may indicate a bug. She suggested escalating to Business Licensing for further investigation.", "standardized_area": "Lists & Segments"}, {"date": "2026-04-24", "requester": "Ash Arraiza", "ka": "RfkAhB", "area": "Campaigns", "summary": "• Link activity is not showing added params. • Links are being merged as 1 main link that does not contain UTMs or additional params.", "tried": ["Cloned the campaign and verified the issue.", "See screenshots.", "Confirmed each link leads to a page on their website.", "Found possible related bug CAMP-49 - Campaign Link Activity showing multiple pages for same URL, however it doesn't appear to be the same circumstance/situation where the same link routes to different pages.", "Basically want to clarify if this is expected behaviour or whether to send this to BL."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3927296", "replies": 7, "has_files": true, "suggestion_summary": "Ellie confirmed based on the help article that UTM-tracked links and `?link=` links should be tracked separately. She suggested testing with the `?link=` parameter format to verify, and noted it did work when tested.", "standardized_area": "Campaigns"}, {"date": "2026-04-24", "requester": "Ash Arraiza", "ka": "SchJmc", "area": "Integrations", "summary": "Looking for a sanity check on a Cloudflare WAF configuration (*hotlinking*) before sending to a customer. I sent him the steps to from the IKB to make Klaviyo's domain exempt, however they've pushed back since the last time they did this it blocked all visitors from their site.  This is what they had setup: A WAF Custom Rule with `(not http.referer contains \"klaviyo\")` --> *Block*, which ended up ", "tried": ["I was gonna get them to update the rule to a positive match + Skip action:", "*Expression:*`http.referer contains \"klaviyo\"`", "*Action:* Skip --> Scrape Shield (Hotlink Protection)", "*Questions:*", "1. Is `http.referer contains \"klaviyo\"` --> Skip --> Scrape Shield the correct WAF Custom Rule setup for exempting Klaviyo from hotlink protection?", "2. Or is the better path to add the exemption directly in Scrape Shield --> Hotlink Protection settings rather than via WAF Custom Rules?", "is this like, not our jurisdiction anymore? haha - ty fam :yikes_harold:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3924802", "replies": 4, "has_files": false, "suggestion_summary": "Dmytro suggested pointing the customer to Cloudflare's official WAF custom rules guide for hotlink protection, and if their implementation is still causing issues, to contact Cloudflare support directly.", "standardized_area": "Integrations"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
</body>
</html>
