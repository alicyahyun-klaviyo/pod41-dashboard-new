<style>

  .donut-wrap { position: relative; width: 160px; height: 160px; flex-shrink: 0; }

  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #3a3a3c; cursor: pointer; padding: 3px 6px; border-radius: 6px; transition: background 0.1s; }

  .legend-item.active { background: #f0e8f1; font-weight: 600; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .legend-pct { color: #8e8e93; font-size: 11px; }

<script>
const QUESTIONS=[{"date": "2026-09-25", "requester": "Meher Gambhir", "ka": "W4AQdY", "area": "Flows", "summary": "Acc is showing £0 attributed revenue across flows and campaigns for September 16–23, 2026, despite continued Shopify placed order events and normal email activity.", "tried": ["CX recently changed flow logic and moved email templates from full image designs to Custom HTML.", "Shopify integration currently appears fine and recent Placed Order events are syncing.", "Link tracking is working, spot checked this", "Initially saw clicktracking=\"off\" HTML n one template  in a template but when CX checked it was not there (cant see it anymore on my end either).", "Not sure what else I should be checking here, second opinion needed pls!"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4196873", "replies": 37, "has_files": true, "suggestion_summary": "Alicya and Meher found the affected profiles all placed their order before opening or clicking the email, so they didn't meet Klaviyo's attribution rules despite the Placed Order events firing; separately, a click-tracking-off HTML snippet that had appeared in one template seemed to have resolved itself (likely a stale version), and they advised the customer to have their developer double check the custom HTML isn't malformed.", "standardized_area": "Flows"}, {"date": "2026-09-24", "requester": "Meher Gambhir", "ka": "TBT56L", "area": "Campaigns", "summary": "The email template appears shifted to the left in mobile view, with an uneven background strip visible along the right side.", "tried": ["Confirmed the template width is 600 px and mobile optimization is enabled.", "Set mobile margin and content padding to 0 px", "Changed the top margin from 60 px to 0 px", "Matched the template and content background colours (ss attacthed)", "Confirmed the email size is approximately 55 KB, so clipping is not involved.", "Sent real campaign test to myself and reproduced the issue in the mobile preview and Gmail mobile.", "Only affects mobile view", "Looks buggy to me"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4196968", "replies": 1, "has_files": true, "suggestion_summary": "Discussed in the office - turning off mobile optimization on the template resolved the rendering issue better than keeping it enabled.", "standardized_area": "Campaigns"}, {"date": "2026-09-23", "requester": "Chris Yinfoo", "ka": "VpVCCs", "area": "Catalogs & Feeds", "summary": "Customer has three Salesforce Commerce Cloud catalog items for the same product, all sharing the same Item ID and SKU.  Their Price Drop email is defaulting to the `Default` catalog item instead of `polk_us`. In the payload they shared, the reduced price appears to be mapped to the Default catalog item's original price, while the original price is mapped to the reduced price for the US catalog.", "tried": ["The customer was told that updating the cartridge would allow Klaviyo to differentiate between catalogs (past ticket: )", "Clarified from the customer \"To clarify, the product wasn't actually discounted down to $405 on our site; the original and reduced-price attributes in the payload were simply incorrect. The price on the website product page was right.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4184010", "replies": 10, "has_files": true, "suggestion_summary": "Alicya explained that Price Drop flows can only source pricing from one catalog and don't pull from the live website; for SFCC, catalog-triggered flows need version 25.4.0+ so a catalog identifier (external id + store id) can distinguish items sharing the same ID across catalogs. She found the correct price was actually set on the variant product rather than the parent product, and suggested asking the customer what that variant product is.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-22", "requester": "Chris Yinfoo", "ka": "SewLA5", "area": "Lists & Segments", "summary": "The customer wants to know the origin of a custom property found on profiles page", "tried": ["Checked dev logs for anything that might have written to the profile (Searched ID, email, phone number)", "Tried to create a segment to see other profiles which might have the property however the key does not appear (Also do not see the property in SS)", "Anywhere else to check or missed? Next, step would be to check in with SE Slack"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4188820", "replies": 12, "has_files": true, "suggestion_summary": "Chris found the custom property was added via an API call that touched only profile attributes with no visible integration in the dev logs, likely from an automation using a private API key; Alicya recommended checking with the SE team to trace where it originated.", "standardized_area": "Lists & Segments"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "RhX2C9", "area": "Integrations", "summary": "The Shopify Checkout URL does not load checkout page but rather goes to the home page  No Placed Order events and checked URL soon after event came through", "tried": ["No Placed Order has been actioned", "Pasted checkout url directly into browser soon after event", "Postman Abandoned URL shows the same URL", "Am I missing something here?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189545", "replies": 15, "has_files": true, "suggestion_summary": "Alicya explained this is a known issue where Shopify checkout URLs take about 15 minutes to sync to Klaviyo, so testing immediately after the event shows the homepage instead of the checkout page; she pointed Chris to the internal KB troubleshooting guide for checkout URL redirect issues.", "standardized_area": "Integrations"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "S9Qc5f", "area": "Flows", "summary": "The customer is noticing a number of recipients skipped in a flow due to 'Unable to Send Email'  Would like more detail information into the reason for this?", "tried": ["Debugger -", "They are noticing the same in other flows too but we can start here"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189533", "replies": 21, "has_files": true, "suggestion_summary": "Chris identified two similar Linear bugs about flow emails skipped due to 'Unable to Send Email'; the team concluded the closest match is FP-3896 (Unable to Send Email due to UNKNOWN_SEND_EXCEPTION).", "standardized_area": "Flows"}, {"date": "2026-09-14", "requester": "Chris Yinfoo", "ka": "V458YQ", "area": "Flows", "summary": "Customer noticed lack of flow emails sending", "tried": ["Wasn't seeing any results via the debugger (Not sure if date is behind the search timeframe?)", "Couldn't see any skipped emails", "The last profile to receive email 1A in June 2026-"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4174764", "replies": 6, "has_files": true, "suggestion_summary": "Alicya ran Chronosphere queries and found the profiles never entered the date-triggered flow at all (not just delayed), matching a known bug (FP-3599: profiles failing to enter date-triggered flow); she recommended escalating to Backline.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "Vbxg9f", "area": "Flows", "summary": "Flow webhook activity showing many skipped", "tried": ["Tried to compare examples which worked vs didn't but haven't quite found a reason", "When trying the test request, see the following details", "Any other logs we can check or review further?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165180", "replies": 6, "has_files": true, "suggestion_summary": "Alicya identified the webhook was a non-Klaviyo (customer-owned) webhook, suggesting the skipped activity was likely due to an issue on the receiving end, and recommended checking in with the webhook owner directly.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "ThEqHV", "area": "Sign Up Forms", "summary": "Customer has one Klaviyo parent account (SINGER - ThEqHV ) with multiple child accounts.  Their previous WooCommerce child-account setup has transitioned to BigCommerce, and they are unable to configure flows or use Klaviyo for marketing across their BigCommerce Multi-Storefront setup.  • SINGER® was the only brand originally on BigCommerce • All our other brands — AccuQuilt, PFAFF, Husqvarna Viki", "tried": ["The first/second image is for some context on the direction which the migration process is heading", "If we look specifically at their recent sign up form query, they said they saw the SINGER form on the ricoma site. However when checking the form, I'm not seeing any targeting to limit this to Singer only", "I advised they need to have targeting, which they said apparently the did, however in their most recent response  \"The form shown in my screenshot is the correct SINGER form for the SINGER website.\" I'm not seeing this?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115668", "replies": 12, "has_files": true, "suggestion_summary": "Confirmed the JavaScript/integration setup was correct on the parent account, and identified that the customer's sign-up form was missing the targeting needed to limit the Singer form to the Singer site; Alicya and Chris planned to huddle to walk through the full BigCommerce multi-storefront migration (forms, flows, list structure) together.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "PDQku2", "area": "Catalogs & Feeds", "summary": "• Unable to save new product feed  • Existing product feed is not available to select when adding a product block into email", "tried": ["Tested with a clone campaign and new campaign and no joy", "Not able to replicate in my test account"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4166614", "replies": 20, "has_files": true, "suggestion_summary": "Found a 403 error in the network tab when creating a new product feed and adding a product block to the campaign, which appeared to be unexpected behaviour; Alicya recommended escalating the issue to Backline.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-08", "requester": "Ash Arraiza", "ka": "UJFV9p", "area": "Flows", "summary": "• Profiles are processed through the conditional split, but then they aren't being queued for the message afterwards. See screenshots.", "tried": ["checked skipped messages, email does not appear", "checked scheduled messages, email does not appear", "checked flow debugger, queuing appears complete?", "no filters on the flow", "no previous time delay blocks between the split and the message.", "similar bugs: , ,", "Might be this one?  but profiles aren't entering the \"waiting\" stage."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164569", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found the split action shared the same action ID as another block, which didn't match any known flow bugs, so she recommended escalating to have engineering create a new bug ticket.", "standardized_area": "Flows"}, {"date": "2026-09-08", "requester": "Meher Gambhir", "ka": "KSMVzB", "area": "Email Deliverability", "summary": "Legitimate profiles are being suppressed by BOT_PROTECTION through consent webhooks from unrelated accounts", "tried": ["CX has a WooCommerce Integration in this acc", "Both profiles had integration consent events with no IP or user agent", "Created segment to unsuppress for CX", "No duplicate integration for this account", "Could it be related to this bug: ICM-1282"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165362", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed the profiles were suppressed by subscription protection (visible via Splunk calls from multiple account IDs) and, since the customer confirmed they were legitimate, advised linking the known ICM-1282 bot-protection bug ticket.", "standardized_area": "Email Deliverability"}, {"date": "2026-09-08", "requester": "Chris Yinfoo", "ka": "VyhTNh", "area": "Integrations", "summary": "Prestashop integration is enabled however the customer is not seeing added to cart events  Klaviyo,js script does not appear to be present however this should be added automatically?", "tried": ["Other events are working", "The customer has navigated to Integrations > Manage Data > Set Up Web Tracking > Add, but nothing happens at all - not even an error message", "Prestashop: 1.7.8.8, Klaviyo module: v1.12.9", "No multi-store, so the API keys are applied at store level", "No integration erros in Staffside", "Modules (no Lightspeed or Cloudflare)"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164460", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found no Klaviyo JS injected on the site at all and pointed to the PrestaShop troubleshooting guide; since the previous agent had already followed it without success, she advised escalating.", "standardized_area": "Integrations"}, {"date": "2026-09-03", "requester": "Ash Arraiza", "ka": "XsDESE", "area": "Templates", "summary": "• Smart translation for Swedish and Swiss High German changes complete images in the template during a live send.  • The customer manually changes images depending on the locale, and saves the template. But when the campaign is sent, the image shown ends up reverting to the original.", "tried": ["I tried looking at the web view for the example profile that received the wrong image, but web view shows the correct images.", "I don't have access to view the translations anymore as access expired, but we were able to capture screenshots of the template images manually set per translation.", "Checked linear for any bugs on this and didn't find any bugs specifically for ST reverting template images.", "Checked this article, and I understand it can be changed if manually set, but the issue is that once she saves the template, the live send does not apply ed from the Klaviyo toll-free number. Meaning customers are not receiving the SMS reply sent from Gorgias.  • The expected behaviour is for a Gorgias reply to the Klaviyo-originated SMS ticket to be routed through Klaviyo and sent from the same Klaviyo sending number", "tried": ["Confirmed the customer is replying through Gorgias, not Klaviyo Helpdesk.", "Followed steps in this IKB, and this one. However, no Gorgias - Opened Ticket metrics have fired.", "Confirmed the test customer is sending the inbound message to the Klaviyo SMS number.", "Confirmed the account has an active Klaviyo toll-free number.", "Confirmed inbound SMS messages are appearing in Gorgias.", "Sync text message conversations is enabled.", "Reviewed the Gorgias ticket screenshot. The ticket is titled Klaviyo SMS, contains the customer’s phone number, and uses a synthetic`sms-integrations+...@klaviyo.com`address in the email-style thread which I believe is expected?", "The inbound test messages are tagged `Message Type: unrecognized` rather than normal \"SMS\"", "Transactional SMS consent on the profile is not subscribed, would this be related to this issue?", "This is a linear that appears to describe the same behaviour, however, its been cancelled."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4141388", "replies": 2, "has_files": true, "suggestion_summary": "Inbound SMS replies from Gorgias were not being routed back through Klaviyo's toll-free number to customers even though inbound messages synced correctly; the behavior matched a previously-cancelled Linear ticket (VEX-269) describing the same issue, and the thread ended without a confirmed fix.", "standardized_area": "K-Service"}, {"date": "2026-08-17", "requester": "Ash Arraiza", "ka": "WeEnvL", "area": "Accounts", "summary": "• Active profile count is mismatched against the billing page and profile page.", "tried": ["toggling between the beta and old billing layout makes no difference", "reviewed the segment they suppressed, uggestions?", "\"The first SKU (DFLC6766) was manually reduced to zero stock on Friday, but I raised the stock to the full stock count to trigger the back in stock notification. According to Klaviyo, this SKU hasn't updated since it was taken out of stock on Friday\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4100234", "replies": 5, "has_files": true, "suggestion_summary": "Confirmed the SKU's stock had not been resynced from BigCommerce since it went out of stock, matching a known Linear bug (IEC-987) where BigCommerce webhook-triggered variant syncs can return stale cached inventory. Advised escalating to the SE team since it appears linked to an existing ZD ticket on the same issue.", "standardized_area": "Flows"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "VJBf7Z", "area": "Flows", "summary": "The customer has a webhook action", "tried": ["Compared two profiles and it looks like the one that did not complete has a status of 'QUEUED_FROM_MANUAL'", "The first 5 webhook actions do not currently have any needs review actions", "Anything in their order of operations which explains why many did not process?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115517", "replies": 9, "has_files": true, "suggestion_summary": "QUEUED_FROM_MANUAL means the profile was released from manual review into the sending queue, but that doesn't confirm the message actually sent. The profile had been stuck in that state since Friday with nothing recorded on the webhook side, so this was identified as a likely flow bug and escalated to Backline.", "standardized_area": "Flows"}, {"date": "2026-08-04", "requester": "Ash Arraiza", "ka": "Vh5xLA", "area": "Templates", "summary": "• The template preview hides the last 2 blocks in the template editor.", "tried": ["exported the HTML for the template, and the HTML does not contain the missing blocks", "imported that HTML into my test account and verified it does not include the missing blocks", "verified there is no display settings enabled for the blocks or sections", "rebuilt the template from scratch and still seeing the issue", "Selecting a preview profile does not make a difference.", "Selecting an event also does not make a difference.", "can I send to backline?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4104767", "replies": 1, "has_files": false, "suggestion_summary": "Alicya confirmed the missing blocks issue looked unusual/unexpected, but no specific fix or next step had been given yet in the thread.", "standardized_area": "Templates"}, {"date": "2026-08-03", "requester": "Ash Arraiza", "ka": "XSJVww", "area": "Integrations", "summary": "Shopware - customers who are already subscribed are getting multiple double opt in emails. Already found the cause: Payload shows historical_import: false on every call, so each resend re-triggers DOI. Shopware plugin resends full subscriber batch to a DOI list every 11 mins.", "tried": ["Found 4 prior Zendesk tickets with the same pattern.", "Checked plugin changelog. Fixes exist for 1.14.3/1.14.4, customer is on 1.14.1.", "Confirmed DOI sends line up with repeated subscribe job timestamps.", "Advised customer to switch the list to single opt-in temporarily.", "Apparently this is a known Shopware bug, unsure whether a new linear needs to be created or whether one already exists."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097328", "replies": 9, "has_files": false, "suggestion_summary": "The team found several prior tickets with the same Shopware plugin bug (repeated DOI resends caused by historical_import:false on every call). A fix exists in plugin v1.14.3/1.14.4, so they advised waiting for the customer to update; if the issue persists after updating, the plan is to ask in the #ask-shopware channel for further help.", "standardized_area": "Integrations"}, {"date": "2026-07-31", "requester": "Ash Arraiza", "ka": "UVnXrV", "area": "Templates", "summary": "Two email templates return 422 s"}, {"date": "2026-07-29", "requester": "Chris Yinfoo", "ka": "WqX2J6", "area": "Integrations", "summary": "Meta Filled Out Lead Ad metric stopped worked", "tried": ["Can see a 403 authorization Unsupported request error for Periodic Sync in SS", "Asked customer to check their permission settings"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4088889", "replies": 29, "has_files": false, "suggestion_summary": "Team discussed the 403 periodic sync error and confirmed the customer's Meta permissions and TOS acceptance looked fine, so no clear fix was found in-thread. Ash shared that a similar case was resolved by manually restarting the periodic sync via the KB steps, and the team agreed to watch how SE handles this ticket before treating that as a standard practice; ultimately escalated to SE.", "standardized_area": "Integrations"}, {"date": "2026-07-28", "requester": "Ash Arraiza", "ka": "SeZyg2", "area": "Integrations", "summary": "• Custom object properties are not updating despite successful 204 API responses.", "tried": ["Confirmed 204s in Developer Tools > Logs for affected accounts", "Checked Object Manager > Properties already exist as mapped String properties", "Checked the data source's Sample Payload - rules out schema mismatch", "Was previously linked to linear ACO-25608 (custom object stuck in publishing) but customer still reported issues after bug was resolved."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4093882", "replies": 9, "has_files": false, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail, shown highlighted in a screenshot), but no fix or workaround was shared in the thread beyond acknowledging the issue.", "standardized_area": "Integrations"}, {"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "• Customer sent multiple campaigns, however the recipient count does not match/is significantly lower than the expected count.", "tried": ["Followed IKB troubleshooting article", "RAST is not enabled, Smart Sending turned off, no Excluded segments or lists, reputation repair disabled, no Audience filter applied", "segment was not newly created.", "SS does not show any info on the dropped profiles, may need help with Splunk logs."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4082512", "replies": 34, "has_files": false, "suggestion_summary": "Root cause was that the segment definition was changed (grew from ~1.6k to 27k+ profiles) after the campaign was scheduled; since RAST was disabled, the campaign only sent to the segment snapshot taken at schedule time. Recommended verifying timing via the segment growth report and account activity logs, and enabling RAST going forward if audience updates made after scheduling should be captured in the send.", "standardized_area": "Campaigns"}, {"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow", "tried": ["No recent changes to flow", "No filters to trigger or emails", "Fairly straightforward setup", "Debugger suggests its stuck"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4070534", "replies": 9, "has_files": false, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account does have the custom action step The Nile AU (VjxEiY), however their other account The Nile NZ (RiJWfQ) does not. They are under the same family billing", "tried": ["Between the two accounts they have over 400k active profiles", "Came across a similar past ticket and slack thread", "What is the best way to check an account is on Flows 2?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4071307", "replies": 13, "has_files": false, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "• Onsite JS crashes on every page load with the Error: undefined reading 'customerHubOnboarded'. Customer Hub is not enabled on this account. Customer's HAR shows fast.a.klaviyo.com atlas settings endpoint returns 404.", "tried": ["this customer is requesting a lot of information that I'm not sure how to source.", "Already told the customer the build-preview/commit path is part of standard rolling deployment process, not a beta environment."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": false, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-24", "requester": "Chris Yinfoo", "ka": "XEPuyw", "area": "Integrations", "summary": "The customer is seeing an old site set up for their WooCommerce integration however they no longer use this and their site has changed domains. Is it possible to see if they did have the old stomer today is concerned removing it may cause complications"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4020964", "replies": 11, "has_files": false, "suggestion_summary": "Alicya identified the duplicate 'Viewed Product' events as coming from two sources — one client-side via Klaviyo and one server-side via a third-party app (WeTracked). She suggested the customer contact the third-party app to remove their tracking script if they want to eliminate the duplicate events from their flow.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Ash Arraiza", "ka": "UrbgMW", "area": "Templates", "summary": "• Previewing the template as your own profile does not show dynamic content, but another user previewing the same template can see the first person's dynamic content.", "tried": ["Had the customer clear cache and cookies, log out/in, try private browser, try different browser", "verified same account and same template, cloned template still shows issue", "User is an Admin", "Customer cannot see \"custom properties\" section in preview and test page only for her own test profile", "Would like to clarify before potentially escalating"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001172", "replies": 23, "has_files": false, "suggestion_summary": "Alicya explained that simply seeing their name pre-filled in the preview pane doesn't mean their profile is selected — the user needs to actively retype their email address and select it from the dropdown. She recommended Ash create a Loom to demonstrate the correct preview steps to the customer.", "standardized_area": "Templates"}, {"date": "2026-06-10", "requester": "Meher Gambhir", "ka": "an79Sm", "area": "Campaigns", "summary": "CX is concerned the footer banner in many of their emails is rendering much wider than expected on desktop in Gmail, Chrome for test sends. It appears aligned correctly in preview.", "tried": ["CX said emails often clip in Gmail but not normally footer is let sortCol="date",sortDir="desc",expandedIdx=null;
const CHART_COLORS=["#4A154B","#007aff","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#ffcc00","#8e8e93","#30b0c7","#ff2d55","#5856d6"];
function getAreaCounts(){const counts={};QUESTIONS.forEach(q=>{counts[q.area]=(counts[q.area]||0)+1;});return Object.entries(counts).sort((a,b)=>b[1]-a[1]);}
function filterByArea(area){const sel=document.getElementById("areaFilter");sel.value=sel.value===area?"":area;renderTable();}
function renderChart(){
  const counts=getAreaCounts();
  const total=QUESTIONS.length;
  const activeArea=document.getElementById("areaFilter")?document.getElementById("areaFilter").value:"";
  let cumulative=0;
  const gradientParts=counts.map(([area,count],i)=>{
    const pct=total?count/total*100:0;
    const start=cumulative;
    cumulative+=pct;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    return `${color} ${start}% ${cumulative}%`;
  });
  document.getElementById("donutChart").style.background=gradientParts.length?`conic-gradient(${gradientParts.join(",")})`:"#e5e5ea";
  document.getElementById("donutTotal").textContent=total;
  document.getElementById("donutLegend").innerHTML=counts.map(([area,count],i)=>{
    const color=CHART_COLORS[i%CHART_COLORS.length];
    const pct=total?((count/total)*100).toFixed(1):"0.0";
    const isActive=activeArea===area;
    return `<div class="legend-item${isActive?" active":""}" onclick="filterByArea('${area.replace(/'/g,"\\'")}')"><span class="legend-swatch" style="background:${color}"></span><span class="legend-label">${esc(area)}</span><span class="legend-count">${count}</span><span class="legend-pct">${pct}%</span></div>`;
  }).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  renderChart();
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderChart();renderTable();
</script>
</body>
</html>
