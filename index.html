<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; font-size: 14px; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .channel-badge { background: #4A154B; color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; letter-spacing: 0.3px; white-space: nowrap; }
  header h1 { font-size: 16px; font-weight: 700; color: #1d1d1f; }
  .last-updated { font-size: 11px; color: #8e8e93; margin-top: 2px; }
  .main { padding: 20px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 14px 16px; border: 1px solid #e5e5ea; }
  .stat-card .stat-label { font-size: 11px; font-weight: 500; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; line-height: 1; color: #1d1d1f; }
  .stat-card.purple .stat-value { color: #4A154B; }
  .stat-card.green  .stat-value { color: #34c759; }
  .stat-card.orange .stat-value { color: #ff9500; }
  .stat-card.blue   .stat-value { color: #007aff; }
  .filter-bar { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap input { width: 100%; border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px 7px 30px; font-size: 13px; color: #1d1d1f; outline: none; transition: border-color 0.15s; }
  .search-wrap input:focus { border-color: #4A154B; }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #8e8e93; font-size: 13px; }
  .filter-select { border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #1d1d1f; background: #fff; outline: none; cursor: pointer; min-width: 140px; }
  .filter-select:focus { border-color: #4A154B; }
  .filter-count { font-size: 12px; color: #8e8e93; white-space: nowrap; }
  .table-wrap { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #f5f5f7; border-bottom: 1px solid #e5e5ea; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: #4A154B; }
  tbody tr { border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf5fb; }
  tbody tr.expanded-row { background: #faf5fb; }
  td { padding: 11px 14px; vertical-align: top; }
  .td-date { color: #8e8e93; font-size: 12px; white-space: nowrap; }
  .td-requester { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .td-ka { font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: #4A154B; white-space: nowrap; }
  .td-summary { font-size: 13px; color: #3a3a3c; max-width: 320px; line-height: 1.4; }
  .td-summary-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ticket-link { color: #4A154B; text-decoration: none; font-size: 12px; font-weight: 500; }
  .ticket-link:hover { text-decoration: underline; }
  .area-tag { display: inline-block; background: #f0e8f1; color: #4A154B; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 500; max-width: 180px; word-break: break-word; }
  .expand-row td { padding: 0; background: #fdf8fe; border-bottom: 2px solid #e5d6e8; }
  .expand-content { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .expand-section h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #4A154B; margin-bottom: 6px; }
  .expand-section p { font-size: 13px; color: #3a3a3c; line-height: 1.5; }
  .expand-section p + p { margin-top: 3px; }
  .expand-section ul { padding-left: 16px; }
  .expand-section li { font-size: 13px; color: #3a3a3c; line-height: 1.5; margin-bottom: 4px; }
  .expand-full { grid-column: 1 / -1; }
  .expand-suggestion-box { grid-column: 1 / -1; background: #f0faf4; border: 1.5px solid #34c759; border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .expand-suggestion-box .suggestion-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
  .expand-suggestion-box .suggestion-body h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #1a7f37; margin-bottom: 5px; }
  .expand-suggestion-box .suggestion-body p { font-size: 13px; color: #1d3826; line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px; color: #8e8e93; font-size: 13px; }
  .no-suggestions { color: #8e8e93; font-size: 12px; font-style: italic; }
</style>

<script>
const QUESTIONS=[{"date": "2026-08-14", "requester": "Ash Arraiza", "ka": "SyikaT", "area": "Templates", "summary": "• The Instagram logo in the social links block is being replaced by 3 images in the connected instagram account, in live preview sends.", "tried": ["tried rebuilding the template from scratch", "tried removing Instagram and re-adding it", "tried from private browser", "tried on the Gmail mobile app", "checked linear, no known issues on this so far", ":pingu-huh: v weird"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4124848", "replies": 20, "has_files": true, "suggestion_summary": "Alicya and Ash could not replicate the issue themselves, but since two different customers reported the same intermittent Instagram logo replacement bug, they agreed to escalate to Backline and linked a similar Linear issue (EDIT-1347: Received Image within header of a campaign send instead of Text).", "standardized_area": "Templates"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "U8hAjh", "area": "Flows", "summary": "The customer is trying to trigger back in stock flow (BigCommerce)  There looks to be issues with how inventory is checked, thus affecting the flow  Looking to confirm the below is related?", "tried": ["Came across this linear and sounds related -", "Doesn't appear to be workaround suggestions?", "\"The first SKU (DFLC6766) was manually reduced to zero stock on Friday, but I raised the stock to the full stock count to trigger the back in stock notification. According to Klaviyo, this SKU hasn't updated since it was taken out of stock on Friday\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4100234", "replies": 5, "has_files": true, "suggestion_summary": "Confirmed the SKU's stock had not been resynced from BigCommerce since it went out of stock, matching a known Linear bug (IEC-987) where BigCommerce webhook-triggered variant syncs can return stale cached inventory. Advised escalating to the SE team since it appears linked to an existing ZD ticket on the same issue.", "standardized_area": "Flows"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "VJBf7Z", "area": "Flows", "summary": "The customer has a webhook action", "tried": ["Compared two profiles and it looks like the one that did not complete has a status of 'QUEUED_FROM_MANUAL'", "The first 5 webhook actions do not currently have any needs review actions", "Anything in their order of operations which explains why many did not process?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115517", "replies": 9, "has_files": true, "suggestion_summary": "QUEUED_FROM_MANUAL means the profile was released from manual review into the sending queue, but that doesn't confirm the message actually sent. The profile had been stuck in that state since Friday with nothing recorded on the webhook side, so this was identified as a likely flow bug and escalated to Backline.", "standardized_area": "Flows"}, {"date": "2026-08-04", "requester": "Ash Arraiza", "ka": "Vh5xLA", "area": "Templates", "summary": "• The template preview hides the last 2 blocks in the template editor.", "tried": ["exported the HTML for the template, and the HTML does *not* contain the missing blocks", "imported that HTML into my test account and verified it does not include the missing blocks", "verified there is no display settings enabled for the blocks or sections", "rebuilt the template from scratch and still seeing the issue", "Selecting a preview profile does not make a difference.", "Selecting an event also does not make a difference.", "hmm can I send to backline?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4104767", "replies": 1, "has_files": true, "suggestion_summary": "Alicya confirmed the missing blocks issue looked unusual/unexpected, but no specific fix or next step had been given yet in the thread.", "standardized_area": "Templates"}, {"date": "2026-08-03", "requester": "Ash Arraiza", "ka": "XSJVww", "area": "Integrations", "summary": "*Shopware* • customers who are already subscribed are getting multiple double opt in emails. • Already found the cause: Payload shows `historical_import: false` on every call, so each resend re-triggers DOI. • Shopware plugin resends full subscriber batch to a DOI list every 11 mins. • Call is `/api/profile-subscription-bulk-create-jobs`", "tried": ["Found 4 prior Zendesk tickets with the same pattern.", "Checked plugin changelog. Fixes exist for 1.14.3/1.14.4, customer is on 1.14.1.", "Confirmed DOI sends line up with repeated subscribe job timestamps.", "Advised customer to switch the list to single opt-in temporarily.", "Apparently this is a known Shopware bug, I'm just unsure whether a new linear needs to be created or whether one already exists for this?", "Found  but doesn't appear to be for multiple tickets."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097328", "replies": 9, "has_files": true, "suggestion_summary": "The team found several prior tickets with the same Shopware plugin bug (repeated DOI resends caused by historical_import:false on every call). A fix exists in plugin v1.14.3/1.14.4, so they advised waiting for the customer to update; if the issue persists after updating, the plan is to ask in the #ask-shopware channel for further help.", "standardized_area": "Integrations"}, {"date": "2026-07-31", "requester": "Ash Arraiza", "ka": "UVnXrV", "area": "Templates", "summary": "• Two email templates return 422 on every API read; editor still opens/edits them fine. • Template XuXd5H: Header blocks with 'links' desktop layout must not include a logo subblock. This is the flow.  • Shared footer has two overlapping Header bar blocks (desktop + mobile), both disabled in DOM, can't be selected/deleted in editor. • Template UDf3uV: label_color is only valid when show_labels is ", "tried": ["Cross-checked past tickets and found that this has affected multiple accounts.", "Traced to EDIT-1260 identified matching backend cleanup commands already built for both error types.", "Not really sure where to go from here tbh or whether I should esco"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4096027", "replies": 17, "has_files": false, "suggestion_summary": "Alicya used Claude to diagnose that the 422 came from a stale label_color value left on a Social Links block after show_labels was toggled off, which the API validator now rejects on read. She confirmed this looks like a backend/API bug (422 isn't even a documented status code) and told Ash to escalate to SE, flagging that the customer is using the MCP.", "standardized_area": "Templates"}, {"date": "2026-07-30", "requester": "Ash Arraiza", "ka": "SPBxWt", "area": "Flows", "summary": "• Flow message analytics shows very little data, despite hundreds of profiles moving through the initial conditional split.  • Profiles that qualified for this flow did not enter.", "tried": ["Created a segment which shows 124 profiles received an email from this flow in the last 7 days.", "Flow entry looks normal (Placed Order) and no filters added to the flow.", "No additional filters on the flow messages", "So emails are actually sending, the flow's own analytics tab is just reporting it wrong?", "This account has manually ended A/B tests on this flow twice recently which could be related to known bugs FP-2813, FP-3146"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097651", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed this matches the known FP-3146 bug (flow A/B test not recording deliveries correctly), the same pattern she'd seen reported by the CNX team, which explains why flow analytics under-report despite messages actually sending.", "standardized_area": "Flows"}, {"date": "2026-07-29", "requester": "Chris Yinfoo", "ka": "WqX2J6", "area": "Integrations", "summary": "Meta Filled Out Lead Ad metric stopped worked", "tried": ["Can see a 403 authorization Unsupported request - method type: get error for Periodic Sync in SS", "Asked customer to check their permission settings"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4088889", "replies": 29, "has_files": true, "suggestion_summary": "Team discussed the 403 periodic sync error and confirmed the customer's Meta permissions and TOS acceptance looked fine, so no clear fix was found in-thread. Ash shared that a similar case was resolved by manually restarting the periodic sync via the KB steps, and the team agreed to watch how SE handles this ticket before treating that as a standard practice; ultimately escalated to SE.", "standardized_area": "Integrations"}, {"date": "2026-07-28", "requester": "Ash Arraiza", "ka": "SeZyg2", "area": "Integrations", "summary": "• Custom object properties are not updating despite successful 204 API responses.", "tried": ["Confirmed 204s in Developer Tools > Logs for affected accounts", "Checked Object Manager > Properties — Region, CustomerCategory, PreferredTradeCentre already exist as mapped String properties", "Checked the data source's Sample Payload — recognized schema attributes — rules out schema mismatch", "Reviewed troubleshooting KB but does not call out properties unable to record", "Was previously linked to linear ACO-25608 (custom object stuck in publishing)", "Customer still reported issues after bug was resolved."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4093882", "replies": 9, "has_files": true, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail, shown highlighted in a screenshot), but no fix or workaround was shared in the thread beyond acknowledging the issue.", "standardized_area": "Integrations"}, {"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "• Customer sent multiple campaigns, however the recipient count does not match/is significantly lower than the expected count.", "tried": ["Followed internal KB on estimated recipient count troubleshooting", "RAST is not enabled", "Smart Sending turned off", "No Excluded segments or lists", "Reputation repair disabled", "No Audience filter applied since this is not an omnichannel campaign", "segment was not newly created.", "SS does not show any info on the dropped profiles, may need help with Splunk logs."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4082512", "replies": 34, "has_files": true, "suggestion_summary": "Root cause was that the segment definition was changed (grew from ~1.6k to 27k+ profiles) after the campaign was scheduled; since RAST was disabled, the campaign only sent to the segment snapshot taken at schedule time. Recommended verifying timing via the segment growth report and account activity logs, and enabling RAST going forward if audience updates made after scheduling should be captured in the send.", "standardized_area": "Campaigns"}, {"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow", "tried": ["No recent changes to flow", "No filters to trigger or emails", "Fairly straightforward setup", "Debugger suggests its stuck?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4070534", "replies": 9, "has_files": true, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account does have the custom action step The Nile AU (VjxEiY), however their other account The Nile NZ (RiJWfQ) does not. They are under the same family billing.", "tried": ["Between the two accounts they have over 400k active profiles", "Came across a similar ticket and slack thread", "What is the best way to check an account is on Flows 2 and if so, can I give the same explanation as Ellie in the case or should I ask in the slack first?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4071307", "replies": 13, "has_files": true, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "• Onsite JS crashes on every page load on mreatwell.com with the Error: undefined reading 'customerHubOnboarded'. • Comes from build-preview/commit-.../atlas.js. • Customer Hub is not enabled on this account. • Customer's HAR shows fast.a.klaviyo.com/atlas/api/public/settings/Vdbaf7 returns 404.", "tried": ["this customer is requesting a lot of information that I'm not sure how to source.", "I've already told the customer the build-preview/commit-{hash} path is part of our standard rolling deployment process, not a beta or preview environment."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": true, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-24", "requester": "Chris Yinfoo", "ka": "XEPuyw", "area": "Integrations", "summary": "The customer is seeing the site hartleyandnoble.wp1.sh setup for their integration however they no longer use this and their site is now hartleyandnoble.co.uk. Is it possible to see if they did have the .co.uk site there at some point?", "tried": ["Noticed the customer reaching out did make some changes and asked for clarification"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4032066", "replies": 21, "has_files": true, "suggestion_summary": "Alicya suggested using PostmanLite system_status to check the WooCommerce integration URL, which appeared to be pointing to the old .wp1.sh staging site rather than the new .co.uk domain. The recommendation was to advise the customer about the 526 error and suggest removing and re-integrating to fix the URL mismatch.", "standardized_area": "Integrations"}, {"date": "2026-06-23", "requester": "Chris Yinfoo", "ka": "UuFRx3", "area": "Flows", "summary": "The third-party connector Funnel is encountering repeated 500 Internal Server Error responses from Klaviyo when attempting to access GET /api/flows/QYZ4DT/flow-actions/", "tried": ["Flow does exist", "Can see a similar request for a different flow which did work", "Found a related linear issue FLOW-660 (500 response for api flows flow-actions endpoint)", "Anything else to check here?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4035222", "replies": 8, "has_files": true, "suggestion_summary": "Alicya identified the 500 errors from Funnel's GET /api/flows/{id}/flow-actions/ are tied to a known bug (FLOW-660) where emails not being set up causes the endpoint to return 500 instead of returning other flow actions. Chris was advised to comment on the Linear ticket that this customer is also affected.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Chris Yinfoo", "ka": "Rn572y", "area": "Flows", "summary": "It appears 'Viewed Product' log is appearing twice for once instance of viewing the item on their site.", "tried": ["The two instances would therefore appear in their flow setup when they only expect one", "Confirmed with the customer, they only recall setting up the integration via Klaviyo and have never encountered this before with other brands", "In a previous case it was deemed there were two different scripts and the customer was instructed to remove the duplicate script", "However, the customer today mentioned concern that removing it may cause complications or affect other functionalities within the store."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4020964", "replies": 11, "has_files": true, "suggestion_summary": "Alicya identified the duplicate 'Viewed Product' events as coming from two sources — one client-side via Klaviyo and one server-side via a third-party app (WeTracked). She suggested the customer contact the third-party app to remove their tracking script if they want to eliminate the duplicate events from their flow.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Ash Arraiza", "ka": "UrbgMW", "area": "Templates", "summary": "• Previewing the template as your own profile does not show dynamic content. Example: Person A previews the template with Person A's email and does not see any dynamic content; Person B previews the same template as Person A and can see Person A's dynamic content.", "tried": ["Had the customer clear cache and cookies from all time", "Got them to log out and log back in", "Got them to try in a private browser", "Got them to try in a different browser (edge and chrome)", "verified we're working in the same account and same template", "Cloned the template and still seeing the issue", "User is an Admin", "Observed in loom that customer can't see the \"custom properties\" section in preview and test page only when previewing with her own test profile.", "Unsure if that's expected behaviour, wants to clarify before escalating."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001172", "replies": 23, "has_files": true, "suggestion_summary": "Alicya explained that simply seeing their name pre-filled in the preview pane doesn't mean their profile is selected — the user needs to actively retype their email address and select it from the dropdown. She recommended Ash create a Loom to demonstrate the correct preview steps to the customer.", "standardized_area": "Templates"}, {"date": "2026-06-10", "requester": "Meher Gambhir", "ka": "an79Sm", "area": "Campaigns", "summary": "CX is concerned the footer banner in many of their emails is rendering much wider than expected on desktop in Gmail, Chrome for test sends. It appears aligned correctly in preview.", "tried": ["CX said their emails often clip in Gmail, but they have not normally had footer issues from that before, so clipping does not seem to fully explain this case.", "Checked the footer table/image sizing. The image cell had a 400px max width, but reducing that to 200 did not resolve the issue.", "Ran a test with test gmail account through preview, test option, and sending a clone of the campaign. Could not replicate issue.", "CX plans to send campaign out in around 6 hours, wanted to confirm if anything else can be done to try fix this."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4012844", "replies": 15, "has_files": true, "suggestion_summary": "Alicya suggested the issue could be Gmail clipping or related to the new template editor migration, and advised that since the issue could not be replicated on their end, Meher should reply using the Gmail clipping angle.", "standardized_area": "Campaigns"}, {"date": "2026-06-09", "requester": "Ash Arraiza", "ka": "KwJYB2", "area": "Campaigns", "summary": "• Customer created an A/B test campaign, however no one received the variation B. • The A/B test results tab does not show variation B at all. The customer now wants to resend variation B of this campaign.", "tried": ["Created a segment for the customer to use, however they are expecting this to l the expected sync completion date to see if it succeeds.", "standardized_area": "Integrations"}, {"date": "2026-02-09", "requester": "Chris Yinfoo", "ka": "TVPP9H", "area": "Lists & Segments", "summary": "The customer believes they meet the criteria for CLV however they notice a message when looking into a profile.", "tried": ["Checked through the criteria to see if they meet them, which looks to be the case.", "Wondering what might have been missed for this."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3736907", "replies": 9, "has_files": true, "suggestion_summary": "Alicya found the issue was caused by incorrect metric mapping — Placed Order was mapped to an individual item metric, so revenue couldn't be calculated. She recommended the customer remap their metrics following the predictive analysis guide.", "standardized_area": "Lists & Segments"}, {"date": "2026-02-04", "requester": "Chris Yinfoo", "ka": "MBqXVi", "area": "Campaigns", "summary": "The customer would like the figures for a usage graph but for the period January - Dec 2025. The current view only does last 12 months.", "tried": ["Checked out relevant IKB but not sure that is quite right."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3720575", "replies": 8, "has_files": true, "suggestion_summary": "Alicya suggested escalating to the Billing team to get the customer a usage report, and noted that a custom report on API usage may also be possible.", "standardized_area": "Campaigns"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "VGeZHB", "area": "Integrations", "summary": "The exact same request works via curl (HTTP 201 Created), but it fails from n8n Cloud with a Cloudflare block page (\"Sorry, you have been blocked / unable to access klaviyo.com\").", "tried": ["Asked for more information about the API call they are making and they provided details on what is being blocked. Wondering if this is usual for IP to be blocked and what can be done."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3688264", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed this is a standard IP whitelisting issue and directed the customer to follow the relevant steps.", "standardized_area": "Integrations"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "Wqcbfr", "area": "Catalogs & Feeds", "summary": "The customer updated their inventory for an item and is wondering why the BIS report still says queued for some products with the same name.", "tried": ["Looked through examples in the BIS Report, noticed the SKU ID differs from the Shopify ID", "Found they have a custom catalog sync as well, asked customer if aware of this / who set it up", "Customer responded they had no idea why they'd have a custom catalog also, asked if they can disconnect the API catalog."], "ticket_url": "", "replies": 24, "has_files": true, "suggestion_summary": "Alicya walked through the options: either fix the custom catalog feed with developer help, or delete it entirely and resync using the Shopify catalog (noting this would affect Back-in-Stock). She recommended clarifying with the customer which path they prefer.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "X6M5Pn", "area": "Catalogs & Feeds", "summary": "• Localised product feed links", "tried": ["A lot of back and forth already, needs advice on next best approach"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3642269", "replies": 16, "has_files": false, "suggestion_summary": "Alicya identified that the product URL in the customer's custom catalog feed was syncing with the incorrect URL, and recommended they fix it in their feed. She also suggested looping in the CSM to alert them to the situation.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "sqUwG2", "area": "Integrations", "summary": "The customer's Shopify Onsite Tracking says it's 'Turned Off', however they see a message in Shopify to advise it's Activated.", "tried": ["When using 'Get App Embed Metafields', can see if it's actually false", "Can see instructions to \"Reset App Embed Metafields\", wondering if that would be suitable and then ask them to go through the steps again."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3659792", "replies": 2, "has_files": true, "suggestion_summary": "Alicya suggested following the existing guide carefully and making sure the Save button is clicked, then asking the customer for a screen recording if the issue persists.", "standardized_area": "Integrations"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "3670894", "area": "Integrations", "summary": "Customer has an API between their custom website solution and Klaviyo. Their discount codes all have the same expiry date, but for a new sunset flow they need codes uploaded to the API to be evergreen with varying time periods. Asking if Klaviyo can speak to their API and tell the website how many codes are needed and the duration.", "tried": ["Still trying to wrap head around their situation"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3670894", "replies": 15, "has_files": false, "suggestion_summary": "Alicya explained that coupon expiry must be set as a fixed date (not a relative period like '14 days'), but leaving it blank defaults to 1-year expiry from when the profile enters the flow. She suggested asking in #ask-apis about adding a relative expiry option.", "standardized_area": "Integrations"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
</body>
</html>
