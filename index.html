<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; font-size: 14px; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .channel-badge { background: #4A154B; color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; letter-spacing: 0.3px; white-space: nowrap; }
  header h1 { font-size: 16px; font-weight: 700; color: #1d1d1f; }
  .last-updated { font-size: 11px; color: #8e8e93; margin-top: 2px; }
  .main { padding: 20px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 14px 16px; border: 1px solid #e5e5ea; }
  .stat-card .stat-label { font-size: 11px; font-weight: 500; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-card .stat-value { font-size: 26px; font-weight: 700; line-height: 1; color: #1d1d1f; }
  .stat-card.purple .stat-value { color: #4A154B; }
  .stat-card.green  .stat-value { color: #34c759; }
  .stat-card.orange .stat-value { color: #ff9500; }
  .stat-card.blue   .stat-value { color: #007aff; }
  .filter-bar { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap input { width: 100%; border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px 7px 30px; font-size: 13px; color: #1d1d1f; outline: none; transition: border-color 0.15s; }
  .search-wrap input:focus { border-color: #4A154B; }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #8e8e93; font-size: 13px; }
  .filter-select { border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #1d1d1f; background: #fff; outline: none; cursor: pointer; min-width: 140px; }
  .filter-select:focus { border-color: #4A154B; }
  .filter-count { font-size: 12px; color: #8e8e93; white-space: nowrap; }
  .table-wrap { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #f5f5f7; border-bottom: 1px solid #e5e5ea; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: #4A154B; }
  tbody tr { border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf5fb; }
  tbody tr.expanded-row { background: #faf5fb; }
  td { padding: 11px 14px; vertical-align: top; }
  .td-date { color: #8e8e93; font-size: 12px; white-space: nowrap; }
  .td-requester { font-weight: 600; font-size: 13px; white-space: nowrap; }
  .td-ka { font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: #4A154B; white-space: nowrap; }
  .td-summary { font-size: 13px; color: #3a3a3c; max-width: 320px; line-height: 1.4; }
  .td-summary-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ticket-link { color: #4A154B; text-decoration: none; font-size: 12px; font-weight: 500; }
  .ticket-link:hover { text-decoration: underline; }
  .area-tag { display: inline-block; background: #f0e8f1; color: #4A154B; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 500; max-width: 180px; word-break: break-word; }
  .expand-row td { padding: 0; background: #fdf8fe; border-bottom: 2px solid #e5d6e8; }
  .expand-content { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .expand-section h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #4A154B; margin-bottom: 6px; }
  .expand-section p { font-size: 13px; color: #3a3a3c; line-height: 1.5; }
  .expand-section p + p { margin-top: 3px; }
  .expand-section ul { padding-left: 16px; }
  .expand-section li { font-size: 13px; color: #3a3a3c; line-height: 1.5; margin-bottom: 4px; }
  .expand-full { grid-column: 1 / -1; }
  .expand-suggestion-box { grid-column: 1 / -1; background: #f0faf4; border: 1.5px solid #34c759; border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .expand-suggestion-box .suggestion-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
  .expand-suggestion-box .suggestion-body h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #1a7f37; margin-bottom: 5px; }
  .expand-suggestion-box .suggestion-body p { font-size: 13px; color: #1d3826; line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px; color: #8e8e93; font-size: 13px; }
  .no-suggestions { color: #8e8e93; font-size: 12px; font-style: italic; }
  .chart-section { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .chart-section h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #8e8e93; margin-bottom: 2px; width: 100%; }
  .donut-wrap { position: relative; width: 160px; height: 160px; flex-shrink: 0; }
  .donut-chart { width: 160px; height: 160px; border-radius: 50%; }
  .donut-hole { position: absolute; top: 20px; left: 20px; width: 120px; height: 120px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-hole .donut-total { font-size: 22px; font-weight: 700; color: #1d1d1f; line-height: 1; }
  .donut-hole .donut-total-label { font-size: 10px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
  .donut-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; flex: 1; min-width: 240px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #3a3a3c; cursor: pointer; padding: 3px 6px; border-radius: 6px; transition: background 0.1s; }
  .legend-item:hover { background: #f5f5f7; }
  .legend-item.active { background: #f0e8f1; font-weight: 600; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { font-weight: 700; color: #1d1d1f; }
  .legend-pct { color: #8e8e93; font-size: 11px; }
</style>

<script>
const QUESTIONS=[{"date": "2026-10-08", "requester": "Ash Arraiza", "ka": "U22HGZ", "area": "Integrations", "summary": "• Shopify - Klaviyo says the app embed is turned off, but it is on in the customer's Shopify theme.", "tried": ["Followed ALL steps in the IKB guide", "Customer turned the embed off and on in Shopify, saved each time, and clicked Update Settings in Klaviyo. The warning stayed.", "Ran Get App Embed Metafields in Staffside: `inject_via_app_embed` is false and hasn't changed since Oct 21, 2024.", "Ran reset app embed metafields, and no change.", "Live theme ID is 180680130834; Staffside still shows the old theme ID, 180097581330. Ran Update Integration, still old.", "Integration was off Apr 21 to Oct 7, 2026; theme changed Aug 25, 2026, so Klaviyo probably missed the change?", "Can we manually update it in SS or do we need to escalate?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4223308", "replies": 6, "has_files": true, "suggestion_summary": "Advised escalating since manually updating the stale theme ID in Staffside isn't documented and should be automatic; also comment on the similar Linear (IEC-1036). A new Linear, IEC-1543, was created for the same Shopify app embed issue.", "standardized_area": "Integrations"}, {"date": "2026-10-06", "requester": "Ash Arraiza", "ka": "UiVFQf", "area": "Campaigns", "summary": "Customer's SMS campaigns skipped almost all recipients for \"Quiet Hours.\" Both campaigns were sent before Quiet Hours started.", "tried": ["Checked HC article and IKB quiet hours checklist; account uses \"Eastern time zone\" quiet hours setting, not \"Profile location.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4208646", "replies": 13, "has_files": true, "suggestion_summary": "Thread found no clear cause: the customer's 9pm quiet-hours setting appeared to be obeyed alongside the default 8pm smart-sending window, which still doesn't explain why 8:30pm and 8:57pm sends were skipped. Quiet hours were updated on 16 Sept, and the case was escalated.", "standardized_area": "Campaigns"}, {"date": "2026-09-30", "requester": "Chris Yinfoo", "ka": "UhkRaC", "area": "Integrations", "summary": "Wix Ecommerce 'Abandoned Checkout' metric does not work", "tried": ["Anything else to check through before escalation?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4200887", "replies": 11, "has_files": false, "suggestion_summary": "The team suspected the issue stemmed from the customer using a customized Wix checkout rather than Wix's default checkout, since the KB's Splunk check only covers the default flow; advised confirming with the customer whether they use a customized checkout before escalating to SE, and noted the default checkout may be the only supported option.", "standardized_area": "Integrations"}, {"date": "2026-09-29", "requester": "Ash Arraiza", "ka": "Rj7bYZ", "area": "Lists & Segments", "summary": "• Shopify tags are syncing, but there are many that are unable to be used as segment conditions or filters.", "tried": ["tried resyncing the profile; tag exists on profile but not available as segment condition"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4204856", "replies": 55, "has_files": true, "suggestion_summary": "The team traced it to Klaviyo's 512-value display limit for property dropdowns (linked to bug PROPLAT-491) — the Shopify tag values existed on the profile but wouldn't populate in the segment/flow filter dropdown; typing the exact tag text (contains) worked for the segment condition, though the flow trigger profile filter still didn't show it as an option.", "standardized_area": "Lists & Segments"}, {"date": "2026-09-25", "requester": "Meher Gambhir", "ka": "W4AQdY", "area": "Flows", "summary": "Acc is showing £0 attributed revenue across flows and campaigns for September 16–23, 2026, despite continued Shopify placed order events and normal email activity.", "tried": ["Link tracking working; Shopify integration fine."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4196873", "replies": 37, "has_files": true, "suggestion_summary": "Alicya and Meher found the affected profiles all placed their order before opening or clicking the email, so they didn't meet Klaviyo's attribution rules despite the Placed Order events firing; separately, a click-tracking-off HTML snippet that had appeared in one template seemed to have resolved itself (likely a stale version), and they advised the customer to have their developer double check the custom HTML isn't malformed.", "standardized_area": "Flows"}, {"date": "2026-09-24", "requester": "Meher Gambhir", "ka": "TBT56L", "area": "Campaigns", "summary": "The email template appears shifted to the left in mobile view, with an uneven background strip visible along the right side.", "tried": ["Confirmed template width 600px, mobile optimization enabled; only affects mobile view"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4196968", "replies": 1, "has_files": true, "suggestion_summary": "Discussed in the office - turning off mobile optimization on the template resolved the rendering issue better than keeping it enabled.", "standardized_area": "Campaigns"}, {"date": "2026-09-23", "requester": "Chris Yinfoo", "ka": "VpVCCs", "area": "Catalogs & Feeds", "summary": "Customer has three Salesforce Commerce Cloud catalog items for the same product, all sharing the same Item ID and SKU. Their Price Drop email is defaulting to the `Default` catalog item instead of `polk_us`.", "tried": ["Customer was told updating the cartridge would allow differentiation between catalogs"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4184010", "replies": 10, "has_files": true, "suggestion_summary": "Alicya explained that Price Drop flows can only source pricing from one catalog and don't pull from the live website; for SFCC, catalog-triggered flows need version 25.4.0+ so a catalog identifier (external id + store id) can distinguish items sharing the same ID across catalogs. She found the correct price was actually set on the variant product rather than the parent product, and suggested asking the customer what that variant product is.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-22", "requester": "Chris Yinfoo", "ka": "SewLA5", "area": "Lists & Segments", "summary": "The customer wants to know the origin of a custom property found on profiles page", "tried": ["Checked dev logs; segment key does not appear"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4188820", "replies": 12, "has_files": true, "suggestion_summary": "Chris found the custom property was added via an API call that touched only profile attributes with no visible integration in the dev logs, likely from an automation using a private API key; Alicya recommended checking with the SE team to trace where it originated.", "standardized_area": "Lists & Segments"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "RhX2C9", "area": "Integrations", "summary": "The Shopify Checkout URL does not load checkout page but rather goes to the home page", "tried": ["No Placed Order has been actioned"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189545", "replies": 15, "has_files": true, "suggestion_summary": "Alicya explained this is a known issue where Shopify checkout URLs take about 15 minutes to sync to Klaviyo, so testing immediately after the event shows the homepage instead of the checkout page; she pointed Chris to the internal KB troubleshooting guide for checkout URL redirect issues.", "standardized_area": "Integrations"}, {"date": "2026-09-21", "requester": "Chris Yinfoo", "ka": "S9Qc5f", "area": "Flows", "summary": "The customer is noticing a number of recipients skipped in a flow due to 'Unable to Send Email'. Would like more detail information into the reason for this?", "tried": ["Debugger", "They are noticing the same in other flows too but we can start here"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4189533", "replies": 21, "has_files": true, "suggestion_summary": "Chris identified two similar Linear bugs about flow emails skipped due to 'Unable to Send Email'; the team concluded the closest match is FP-3896 (Unable to Send Email due to UNKNOWN_SEND_EXCEPTION).", "standardized_area": "Flows"}, {"date": "2026-09-14", "requester": "Chris Yinfoo", "ka": "V458YQ", "area": "Flows", "summary": "Customer noticed lack of flow emails sending", "tried": ["Wasn't seeing any results via the debugger (Not sure if date is behind the search timeframe?)", "Couldn't see any skipped emails", "The last profile to receive email 1A in June 2026"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4174764", "replies": 6, "has_files": true, "suggestion_summary": "Alicya ran Chronosphere queries and found the profiles never entered the date-triggered flow at all (not just delayed), matching a known bug (FP-3599: profiles failing to enter date-triggered flow); she recommended escalating to Backline.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "Vbxg9f", "area": "Flows", "summary": "Flow webhook activity showing many skipped", "tried": ["Tried to compare examples which worked vs didn't but haven't quite found a reason", "Any other logs we can check or review further?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165180", "replies": 6, "has_files": true, "suggestion_summary": "Alicya identified the webhook was a non-Klaviyo (customer-owned) webhook, suggesting the skipped activity was likely due to an issue on the receiving end, and recommended checking in with the webhook owner directly.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "ThEqHV", "area": "Sign Up Forms", "summary": "Customer has one Klaviyo parent account (SINGER) with multiple child accounts. Their previous WooCommerce child-account setup has transitioned to BigCommerce Multi-Storefront, and they are unable to configure flows or use Klaviyo for marketing across it.", "tried": ["Customer saw the SINGER form on the ricoma site; no targeting limiting it to Singer only", "I advised they need to have targeting"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115668", "replies": 12, "has_files": true, "suggestion_summary": "Confirmed the JavaScript/integration setup was correct on the parent account, and identified that the customer's sign-up form was missing the targeting needed to limit the Singer form to the Singer site; Alicya and Chris planned to huddle to walk through the full BigCommerce multi-storefront migration (forms, flows, list structure) together.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "PDQku2", "area": "Catalogs & Feeds", "summary": "• Unable to save new product feed • Existing product feed is not available to select when adding a product block into email", "tried": ["Tested with a clone campaign and new campaign and no joy", "Not able to replicate in my test account"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4166614", "replies": 20, "has_files": true, "suggestion_summary": "Found a 403 error in the network tab when creating a new product feed and adding a product block to the campaign, which appeared to be unexpected behaviour; Alicya recommended escalating the issue to Backline.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-08", "requester": "Ash Arraiza", "ka": "UJFV9p", "area": "Flows", "summary": "• Profiles are processed through the conditional split, but then they aren't being queued for the message afterwards. See screenshots.", "tried": ["checked skipped and scheduled messages, email does not appear", "checked flow debugger, queuing appears complete?", "no filters on the flow"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164569", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found the split action shared the same action ID as another block, which didn't match any known flow bugs, so she recommended escalating to have engineering create a new bug ticket.", "standardized_area": "Flows"}, {"date": "2026-09-08", "requester": "Meher Gambhir", "ka": "KSMVzB", "area": "Email Deliverability", "summary": "Legitimate profiles are being suppressed by BOT_PROTECTION through consent webhooks from unrelated accounts", "tried": ["CX has a WooCommerce Integration in this acc", "Both profiles had integration consent events with no IP or user agent", "Created segment to unsuppress for CX", "Could it be related to this bug: ICM-1282"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165362", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed the profiles were suppressed by subscription protection (visible via Splunk calls from multiple account IDs) and, since the customer confirmed they were legitimate, advised linking the known ICM-1282 bot-protection bug ticket.", "standardized_area": "Email Deliverability"}, {"date": "2026-09-08", "requester": "Chris Yinfoo", "ka": "VyhTNh", "area": "Integrations", "summary": "Prestashop integration is enabled however the customer is not seeing added to cart events. Klaviyo.js script does not appear to be present however this should be added automatically?", "tried": ["Other events are working", "Customer has navigated to Integrations > Manage Data > Set Up Web Tracking > Add, but nothing happens at all", "Prestashop: 1.7.8.8, Klaviyo module: v1.12.9", "No multi-store; no integration errors in Staffside"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164460", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found no Klaviyo JS injected on the site at all and pointed to the PrestaShop troubleshooting guide; since the previous agent had already followed it without success, she advised escalating.", "standardized_area": "Integrations"}, {"date": "2026-09-03", "requester": "Ash Arraiza", "ka": "XsDESE", "area": "Templates", "summary": "• Smart translation for Swedish and Swiss High German changes complete images in the template during a live send. • The customer manually changes images depending on the locale, and saves the template. But when the campaign is sent, the image shown ends up reverting to the original.", "tried": ["Web view for the example profile shows the correct images.", "Checked linear for any bugs on this and didn't find any", "Checked HC article; once she saves the template, the live send does not apply the changes."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4145150", "replies": 14, "has_files": true, "suggestion_summary": "Alicya explained that the web view doesn't always reflect what was actually delivered, and pointed Ash to the Staffside template-rendering-artifacts tool (or having the customer forward the actual received email) to confirm which image version was truly sent; since the staff tool failed to load, the plan was to ask the customer to forward screenshots of the received email instead.", "standardized_area": "Templates"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "<https://klaviyo.zendesk.com/agent/tickets/4151819>", "area": "Sign Up Forms", "summary": "The customer is running into HTTP 503 errors when trying to sign up to their pop up form", "tried": ["Tried to replicate but haven't been able to", "Request more information from customer on their experience", "Their previous case closed without resolution"], "ticket_url": "", "replies": 23, "has_files": false, "suggestion_summary": "Alicya traced the reported 503s to the client/profiles (identify) and onsite/track-analytics calls rather than the client/subscriptions (subscribe) endpoint, and since the team couldn't reproduce the issue and the customer had no screenshot or HAR file confirming the failure, they escalated the ticket to Backline as a sign-up form issue.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-01", "req iting for the customer to update; if the issue persists after updating, the plan is to ask in the #ask-shopware channel for further help.", "standardized_area": "Integrations"}, {"date": "2026-07-31", "requester": "Ash Arraiza", "ka": "UVnXrV", "area": "Templates", "summary": "• Two email templates return 422 on every API read; editor still opens/edits them fine. • Header blocks with 'links' desktop layout must not include a logo subblock. • Stale `label_color` left over from toggling \"Text labels\"; toggle doesn't clear it. • 422 blocks programmatic reads and updates (update requires reading current definition first).", "tried": ["Cross-checked past tickets and found that this has affected multiple accounts.", "Traced to EDIT-1260 identified matching backend cleanup commands already built for both error types.", "Not really sure where to go from here tbh or whether I should esco"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4096027", "replies": 17, "has_files": false, "suggestion_summary": "Alicya used Claude to diagnose that the 422 came from a stale label_color value left on a Social Links block after show_labels was toggled off, which the API validator now rejects on read. She confirmed this looks like a backend/API bug (422 isn't even a documented status code) and told Ash to escalate to SE, flagging that the customer is using the MCP.", "standardized_area": "Templates"}, {"date": "2026-07-30", "requester": "Ash Arraiza", "ka": "SPBxWt", "area": "Flows", "summary": "• Flow message analytics shows very little data, despite hundreds of profiles moving through the initial conditional split. • Profiles that qualified for this flow did not enter.", "tried": ["Created a segment which shows 124 profiles received an email from this flow in the last 7 days.", "Flow entry looks normal (Placed Order) and no filters added.", "Emails are actually sending, the flow's own analytics tab is just reporting it wrong?", "Account manually ended A/B tests twice recently, could be related to FP-2813, FP-3146"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097651", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed this matches the known FP-3146 bug (flow A/B test not recording deliveries correctly), the same pattern she'd seen reported by the CNX team, which explains why flow analytics under-report despite messages actually sending.", "standardized_area": "Flows"}, {"date": "2026-07-29", "requester": "Chris Yinfoo", "ka": "WqX2J6", "area": "Integrations", "summary": "Meta Filled Out Lead Ad metric stopped worked", "tried": ["Can see a 403 authorization Unsupported request - method type: get error for Periodic Sync in SS", "Asked customer to check their permission settings"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4088889", "replies": 29, "has_files": true, "suggestion_summary": "Team discussed the 403 periodic sync error and confirmed the customer's Meta permissions and TOS acceptance looked fine, so no clear fix was found in-thread. Ash shared that a similar case was resolved by manually restarting the periodic sync via the KB steps, and the team agreed to watch how SE handles this ticket before treating that as a standard practice; ultimately escalated to SE.", "standardized_area": "Integrations"}, {"date": "2026-07-28", "requester": "Ash Arraiza", "ka": "SeZyg2", "area": "Integrations", "summary": "• Custom object properties are not updating despite successful 204 API responses.", "tried": ["Confirmed 204s in Developer Tools > Logs for affected accounts", "Checked Object Manager > Properties; properties already exist as mapped String properties", "Previously linked to ACO-25608; customer still reported issues after bug was resolved."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4093882,", "replies": 9, "has_files": true, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail let sortCol="date",sortDir="desc",expandedIdx=null;
const CHART_COLORS=["#4A154B","#007aff","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#ffcc00","#8e8e93","#30b0c7","#ff2d55","#5856d6"];
function getAreaCounts(){const counts={};QUESTIONS.forEach(q=>{counts[q.area]=(counts[q.area]||0)+1;});return Object.entries(counts).sort((a,b)=>b[1]-a[1]);}
function filterByArea(area){const sel=document.getElementById("areaFilter");sel.value=sel.value===area?"":area;renderTable();}
function renderChart(){
  const counts=getAreaCounts();
  const total=QUESTIONS.length;
  const activeArea=document.getElementById("areaFilter")?document.getElementById("areaFilter").value:"";
  let cumulative=0;
  const gradientParts=counts.map(([area,count],i)=>{
    const pct=total?count/total*100:0;
    const start=cumulative;
    cumulative+=pct;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    return `${color} ${start}% ${cumulative}%`;
  });
  document.getElementById("donutChart").style.background=gradientParts.length?`conic-gradient(${gradientParts.join(",")})`:"#e5e5ea";
  document.getElementById("donutTotal").textContent=total;
  document.getElementById("donutLegend").innerHTML=counts.map(([area,count],i)=>{
    const color=CHART_COLORS[i%CHART_COLORS.length];
    const pct=total?((count/total)*100).toFixed(1):"0.0";
    const isActive=activeArea===area;
    return `<div class="legend-item${isActive?" active":""}" onclick="filterByArea('${area.replace(/'/g,"\\'")}')"><span class="legend-swatch" style="background:${color}"></span><span class="legend-label">${esc(area)}</span><span class="legend-count">${count}</span><span class="legend-pct">${pct}%</span></div>`;
  }).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  renderChart();
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderChart();renderTable();
</script>
</body>
</html>
