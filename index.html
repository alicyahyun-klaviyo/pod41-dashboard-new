<script>
const QUESTIONS=[{"date": "2026-04-29", "requester": "Chris Yinfoo", "ka": "LWjHvK", "area": "Segment Growth / Large Dropped", "summary": "The customer noticed a large drop in their segment growth which was out of the norm from their observations", "tried": ["Checked some some profiles from the 24th April and interestingly they are 'Never Subscribed' status", "The first criteria is can receive email marketing because 'Subscribed'", "Cannot see any segment definition changes", "Customer is not aware of any API or external applications which could be make changes", "Not seeing any dev logs for the profiles", "Examples appear to have a subscribed to email marketing event that took place a long time ago"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3930031", "replies": 9, "has_files": true, "suggestion_summary": "Alicya flagged that profiles going from 'Subscribed' to 'Never Subscribed' is unusual and may indicate a bug. She suggested escalating to Business Licensing for further investigation."}, {"date": "2026-04-24", "requester": "Ash Arraiza", "ka": "RfkAhB", "area": "Campaigns - Link Activity (possible related bug?)", "summary": "• Link activity is not showing added params.  • Links are being merged as 1 main link that does not contain UTMs or additional params.", "tried": ["Cloned the campaign and verified the issue.", "See screenshots.", "Confirmed each link leads to a page on their website.", "Found possible related bug CAMP-49 - Campaign Link Activity showing multiple pages for same URL, however it doesn't appear to be the same circumstance/situation where the same link routes to different pages.", "Basically want to clarify if this is expected behaviour or whether to send this to BL."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3927296", "replies": 7, "has_files": true, "suggestion_summary": "Ellie confirmed based on the help article that UTM-tracked links and `?link=` links should be tracked separately. She suggested testing with the `?link=` parameter format to verify, and noted it did work when tested."}, {"date": "2026-04-24", "requester": "Ash Arraiza", "ka": "SchJmc", "area": "M2 - Hotlinking", "summary": "Looking for a sanity check on a Cloudflare WAF configuration (*hotlinking*) before sending to a customer. I sent him the steps to from the IKB to make Klaviyo's domain exempt, however they've pushed back since the last time they did this it blocked all visitors from their site.  This is what they had setup: A WAF Custom Rule with `(not http.referer contains \"klaviyo\")` --> *Block*, which ended up ", "tried": ["I was gonna get them to update the rule to a positive match + Skip action:", "*Expression:*`http.referer contains \"klaviyo\"`", "*Action:* Skip --> Scrape Shield (Hotlink Protection)", "*Questions:*", "1. Is `http.referer contains \"klaviyo\"` --> Skip --> Scrape Shield the correct WAF Custom Rule setup for exempting Klaviyo from hotlink protection?", "2. Or is the better path to add the exemption directly in Scrape Shield --> Hotlink Protection settings rather than via WAF Custom Rules?", "is this like, not our jurisdiction anymore? haha - ty fam :yikes_harold:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3924802", "replies": 4, "has_files": false, "suggestion_summary": "Dmytro suggested pointing the customer to Cloudflare's official WAF custom rules guide for hotlink protection, and if their implementation is still causing issues, to contact Cloudflare support directly."}, {"date": "2026-04-21", "requester": "Ash Arraiza", "ka": "Je8TME", "area": "Show/Hide", "summary": "• Logic is correct :suscat:  but block stays hidden even if condition is true. • Property is `$loop_active_subscriber` and they want to show the \"It's Back\" block if the value is true", "tried": ["Used segment to confirm data type is Boolean", "Used the following code:", "```person|lookup:'$loop_active_subscriber' == 1 or person|lookup:'$loop_active_subscriber' == 'true' or person|lookup:'$loop_active_subscriber' == 'True'```", "Which was copied straight from this HC:", "Used one condition at a time, block is still hidden."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3920198", "replies": 14, "has_files": true, "suggestion_summary": "Alicya asked about display rules on the template sections. Liam found the section had display logic set on it that was preventing it from showing, which was the root cause."}, {"date": "2026-04-20", "requester": "Chris Yinfoo", "ka": "RxSiLW", "area": "Dynamic Content", "summary": "The customer is using dynamic tags to have the percentage discount display  However, it looks like the base price is pulling in the first item's compare at price rather than the correct variant  This results in a negative discount off", "tried": ["It looks like the current formula is always pulling in the lowest ml compare at price rather than the actual product compare at price", "In this case, it will result in a negative discount, however if the lowest ml is actually chosen then the discount is correct (Navigate through preview examples to see the difference)", "We have advise that \"It would be ideal if the Skio event was able to pass the compare at price.\"", "Customer says they have asked but it's low priority on Skio end"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3914014", "replies": 10, "has_files": true, "suggestion_summary": "Alicya noted the customer is using the correct `item.productVariantPlatformId` variable but the Shopify catalog may not support dynamic variant image lookups. She suggested trying the approach from the related method guide, and asking in #ask-apis if it's achievable."}, {"date": "2026-04-20", "requester": "Chris Yinfoo", "ka": "XNZdR9", "area": "Email Dynamic Content", "summary": "The custom has a Fulfilled Order flow email, where they would like for the dynamic content to display in a 'collage' layout rather than the traditional a single column table (Image LHS and Text RHS)", "tried": ["The previous agent used the HTML block to produce what looks to be the customers want", "However, when you send the email as a preview, no images are actually retained", "Tried to update the code to get it to work however no joy so far", "Need to confirm if what they customer wants can be achieved?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3912407", "replies": 9, "has_files": true, "suggestion_summary": "Alicya suggested not going too deep on the HTML troubleshooting — instead, refer the customer to Klaviyo's product block extension guide or use AI to help achieve the layout, with the vertical display guide as a fallback."}, {"date": "2026-04-20", "requester": "Ash Arraiza", "ka": "QPH4G3", "area": "Sign Up Forms", "summary": "• Sign up form adding profiles to the incorrect list.", "tried": ["tested the form myself and could not replicate issue", "Compared the Form versions with my test accounts and the profile example, same form version ID", "confirmed form was last published live on 17 April", "Confirmed form is adding to correct lists after confirming opt-in and buttons on the form are submitting to the correct lists", "checked the incorrect list's forms and do not see the sign up form (form and incorrect list are not connected)", "Customer advised that the form was cloned from an old sign up form, however they changed the \"Submit to\" lists _before_ publishing live"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3917839", "replies": 30, "has_files": false, "suggestion_summary": "Jeremy suggested the duplicate Shopify integration as a likely cause. Alicya investigated and found the profile was subscribed via Shopify login (triggered by Shopify's webhook), and that a second integration account also had this profile."}, {"date": "2026-04-15", "requester": "Meher Gambhir", "ka": "LtZARu", "area": "API call showing error in response", "summary": "The issue is that the data-privacy-deletion-jobs endpoint only works with a private Klaviyo API key, but the actual requests are still being sent with OAuth Bearer authentication, so they keep getting a 401 authentication_failed error.", "tried": ["Asked them to use a private Klaviyo API key as they were not before", "Confirmed their new request used a private one", "Checked request against this guide (looks all good to me):"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3909623", "replies": 2, "has_files": true, "suggestion_summary": ""}, {"date": "2026-04-15", "requester": "Ash Arraiza", "ka": "V9XDbW", "area": "Integration - Prestashop v9.0.", "summary": "• Customer is encountering this error: \"It appears you are running PHP as a CGI. Please follow the instructions here to ensure Klaviyo can access your API\"", "tried": ["Used one time secret to test API calls in Postman - which returns 200 (see screenshot)", "Followed this guide: PrestaShop Integration Troubleshooting Guide - Could not authenticate/401 Unauthorized", "Did not see any auth issues in postman or staffside", "Looked through past tickets in ZD, and it appears that Prestashop version 9+ is not supported by Klaviyo module. However I'd like clarification on this before getting back to them with a firm answer since this HC article says otherwise.", "Example ZD tix - one, two", "My thinking is to get them to downgrade versions, but any further guidance here would be appreciated. ty x"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3904537", "replies": 13, "has_files": true, "suggestion_summary": "Dmytro confirmed PrestaShop v9.0 is not currently supported by Klaviyo. He suggested posting in the docs channel to get the help article updated, and submitting a feature request for Presta 9 support."}, {"date": "2026-04-10", "requester": "Meher Gambhir", "ka": "XdrVV8", "area": "Metric Triggered Flow", "summary": "Customer’s Shopify Order Confirmation flow is mis-routing one profile based on order count. A profile with only one Placed Order event received the Loyal Customer order confirmation instead of the New Customer version, suggesting the order-count splits were evaluated incorrectly.", "tried": ["Confirmed with customer: other profiles have also received this email incorrectly, the email isn’t duplicated in any other flow, and no one has resent it manually.", "Reviewed flow splits: is configured as expected.", "Used Flow Debugger: consent split evaluated True, but all three order-count splits evaluated False for this profile/event.", "Used Flow Change Log: no structural changes to this flow after the customer entered", "Verified via Recipient Activity + Messages tab that the Loyal Customer email was the one actually sent."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3899295", "replies": 7, "has_files": true, "suggestion_summary": "Cecilia identified a race condition — the flow trigger fires on Shopify Placed Order, but the conditional splits check against a custom Placed Order metric that wasn't recorded yet. She suggested adding a time delay to account for the gap."}, {"date": "2026-04-10", "requester": "Meher Gambhir", "ka": "WV7nVS", "area": "Custom Font", "summary": "CX  is trying to update their existing custom font “Mongoose” from Normal 400 to Medium 500 using but the Fonts UI shows: “One or more font files could not be accessed.*”* The font URL is reachable and downloads fine, and their host has added CORS headers for Klaviyo,  not sure why our fetch is failing.", "tried": ["Opened that exact URL in an incognito window and confirmed it downloads the file", "Customer’s host added CORS headers include `Header always set Access-Control-Allow-Origin`", "Re-tested saving the font in the Klaviyo UI, still seeing “One or more font files could not be accessed.”", "Looks like Klaviyo is still unable to read this font file, so looking for guidance on whether this is expected behaviour, a limitation with this hosting setup, or something we should flag as a bug."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3901722", "replies": 6, "has_files": true, "suggestion_summary": "Ray diagnosed the issue as the customer's strict referrer policy settings blocking the custom font from loading. He recommended having their developers review and adjust the CORS/referrer policy settings."}, {"date": "2026-04-08", "requester": "Ash Arraiza", "ka": "YfrvQB", "area": "metric-triggered flow", "summary": "• Customer is receiving emails 30 mins after triggering the flow. • There are no time delay blocks or filters in the flow.  • Re-entry criteria set to trigger every time the person triggers the metric", "tried": ["Checked dev logs for when the metric was triggered and did not see any difference in time.", "Checked the events on the profile and see no delays when checking against flow debugger"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3897045", "replies": 20, "has_files": false, "suggestion_summary": "Cecilia identified SMS quiet hours as the cause — the account's quiet hours end at 11am, which delayed the flow messages by 30 minutes. She shared a screenshot of the account's quiet hours settings to confirm."}, {"date": "2026-04-01", "requester": "Ash Arraiza", "ka": "U5vf4r", "area": "WooCommerce Historical Sync failure", "summary": "• Running into timeout/server unavailable (10x, 503) for historical syncs", "tried": ["Observed the following information in Staffside:", "Timestamp: March 24, 2026 at 10:09 a.m.", "Issue Type: Timeout/Server Unavailable (10x, 503)", "Description: A socket error has occurred.", "Origin: Historical Sync", "Had customer whitelist IPs and user agent.", "Customer provided third-party plugins,", "No Ray ID seen in the logs", "Tried reducing the `order_batch_size` however still receiving the error", "Claude says I should increase the `connection_timeout` via integration inspector and then re-trigger the historical sync. Just wanted to check here before doing so, since I know historical syncs can cause larger issues.", "thanks team"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3858575", "replies": 6, "has_files": true, "suggestion_summary": "Cecilia spotted socket errors in the periodic syncs and flagged it for Dmytro. Dmytro suggested increasing the `connection_timeout` setting to 90 to resolve the sync failures."}, {"date": "2026-03-30", "requester": "Ash Arraiza", "ka": "SQ8M3K", "area": "Shopify Markets with Product Feeds", "summary": "Price of products within a static product block are not showing the correct compare at price when viewing as an Australian profile", "tried": ["Customer is using Compare at Price and Localize for recipient in this template.", "Verified account is based in NZ", "Initially I thought that the price was due to the price difference between AUD and NZD, however the price of Best Seller Bundle is *higher* than the Full Outfit Rescue Kit, which is *lower* than the account default.", "Checked the compare at price for the products, and noticed `compare_at_price` is not available on all products. The products with null `compare_at_price` has a higher price (), where as the products with the `compare_at_price` has a lower price in the template ().", "Just wondering how would they fix this issue so that the prices are consistently higher or lower in relation to the customer's locale?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3880560", "replies": 4, "has_files": false, "suggestion_summary": "Ray found that `compare_at_price` is not available when using Klaviyo's localise-for-recipient feature, meaning the higher/compare price cannot be shown dynamically to AU recipients."}, {"date": "2026-03-26", "requester": "Ash Arraiza", "ka": "HyAu3m", "area": "Shopify Metric - Confirmed Shipment", "summary": "• Confirmed Shipment is not firing since 18 March 2026.", "tried": ["Confirmed the carriers the customer is using are supported (UPS)", "Reviewed this IKB, where it states `Shopify Confirmed Shipment metric may not always track. The Confirmed Shipment me tom catalog feed was syncing with the incorrect URL, and recommended they fix it in their feed. She also suggested looping in the CSM to alert them to the situation."}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "sqUwG2", "area": "Klaviyo app embed remains off as displayed in Klaviyo", "summary": "The customer's Shopify Onsite Tracking says it's 'Turned Off', however they see a message in Shopify to advise it's Activated", "tried": ["When using 'Get App Embed Metafields', can see if it actually false", "Can see instructions to \"Reset App Embed Metafields\" here, would this be suitable and then ask them to go through the steps again?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3659792", "replies": 2, "has_files": true, "suggestion_summary": "Alicya suggested following the existing guide carefully and making sure the Save button is clicked, then asking the customer for a screen recording if the issue persists."}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "3670894", "area": "Custom website / API / Coupons", "summary": "We have an API between our custom website solution and Klaviyo. With our website when we build out discount codes they all have the same expiry date. For our new sunset flow we need codes that upload to the API to be evergreen and have time periods that are not all the same.  Can Klaviyo speak to our API and tell our website how many codes are needed and the duration of time - like a call to an en", "tried": ["Still trying to wrap my head around their situation"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3670894", "replies": 15, "has_files": false, "suggestion_summary": "Alicya explained that coupon expiry must be set as a fixed date (not a relative period like '14 days'), but leaving it blank defaults to 1-year expiry from when the profile enters the flow. She suggested asking in #ask-apis about adding a relative expiry option."}];
let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
</body>
</html>
