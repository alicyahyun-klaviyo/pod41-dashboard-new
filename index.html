<script>
const QUESTIONS=[{"date": "2026-08-04", "requester": "Ash Arraiza", "ka": "Vh5xLA", "area": "Templates", "summary": "• The template preview hides the last 2 blocks in the template editor.", "tried": ["exported the HTML for the template, and the HTML does *not* contain the missing blocks", "imported that HTML into my test account and verified it does not include the missing blocks", "verified there is no display settings enabled for the blocks or sections", "rebuilt the template from scratch and still seeing the issue", "Selecting a preview profile does not make a difference.", "Selecting an event also does not make a difference.", "hmm can I send to backline?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4104767", "replies": 1, "has_files": true, "suggestion_summary": "Alicya confirmed the missing blocks issue looked unusual/unexpected, but no specific fix or next step had been given yet in the thread.", "standardized_area": "Templates"}, {"date": "2026-08-03", "requester": "Ash Arraiza", "ka": "XSJVww", "area": "Integrations", "summary": "*Shopware* • customers who are already subscribed are getting multiple double opt in emails. • Already found the cause: Payload shows `historical_import: false` on every call, so each resend re-triggers DOI. • Shopware plugin resends full subscriber batch to a DOI list every 11 mins. • Call is `/api/profile-subscription-bulk-create-jobs`", "tried": ["Found 4 prior Zendesk tickets with the same pattern.", "Checked plugin changelog. Fixes exist for 1.14.3/1.14.4, customer is on 1.14.1.", "Confirmed DOI sends line up with repeated subscribe job timestamps.", "Advised customer to switch the list to single opt-in temporarily.", "Apparently this is a known Shopware bug, I'm just unsure whether a new linear needs to be created or whether one already exists for this?", "Found  but doesn't appear to be for multiple tickets."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097328", "replies": 9, "has_files": true, "suggestion_summary": "The team found several prior tickets with the same Shopware plugin bug (repeated DOI resends caused by historical_import:false on every call). A fix exists in plugin v1.14.3/1.14.4, so they advised waiting for the customer to update; if the issue persists after updating, the plan is to ask in the #ask-shopware channel for further help.", "standardized_area": "Integrations"}, {"date": "2026-07-31", "requester": "Ash Arraiza", "ka": "UVnXrV", "area": "Templates", "summary": "• Two email templates return 422 on every API read; editor still opens/edits them fine. • Template XuXd5H: `Header blocks with 'links' desktop layout must not include a logo subblock`. This is the flow. • Shared footer has two overlapping Header bar blocks (desktop + mobile), both disabled in DOM, can't be selected/deleted in editor. • Template UDf3uV: `label_color is only valid when show_labels i", "tried": ["Cross-checked past tickets and found that this has affected multiple accounts.", "Traced to EDIT-1260 identified matching backend cleanup commands already built for both error types.", "Not really sure where to go from here tbh or whether I should esco"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4096027", "replies": 17, "has_files": false, "suggestion_summary": "Alicya used Claude to diagnose that the 422 came from a stale label_color value left on a Social Links block after show_labels was toggled off, which the API validator now rejects on read. She confirmed this looks like a backend/API bug (422 isn't even a documented status code) and told Ash to escalate to SE, flagging that the customer is using the MCP.", "standardized_area": "Templates"}, {"date": "2026-07-30", "requester": "Ash Arraiza", "ka": "SPBxWt", "area": "Flows", "summary": "• Flow message analytics shows very little data, despite hundreds of profiles moving through the initial conditional split. • Profiles that qualified for this flow did not enter.", "tried": ["Created a segment which shows 124 profiles received an email from this flow in the last 7 days.", "Flow entry looks normal (Placed Order) and no filters added to the flow.", "No additional filters on the flow messages", "Drafted a segment for \"received this flow's email in the last 7 days\" and got 124 people. So emails are actually sending, the flow's own analytics tab is just reporting it wrong?", "This account has manually ended A/B tests on this flow twice recently (July 20 and July 29) which could be related to these bugs: FP-2813, FP-3146"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097651", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed this matches the known FP-3146 bug (flow A/B test not recording deliveries correctly), the same pattern she'd seen reported by the CNX team, which explains why flow analytics under-report despite messages actually sending.", "standardized_area": "Flows"}, {"date": "2026-07-29", "requester": "Chris Yinfoo", "ka": "WqX2J6", "area": "Integrations", "summary": "Meta Filled Out Lead Ad metric stopped worked", "tried": ["Can see a 403 authorization Unsupported request - method type: get error for Periodic Sync in SS -", "Asked customer to check their permission settings"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4088889", "replies": 29, "has_files": true, "suggestion_summary": "Team discussed the 403 periodic sync error and confirmed the customer's Meta permissions and TOS acceptance looked fine, so no clear fix was found in-thread. Ash shared that a similar case was resolved by manually restarting the periodic sync via the KB steps, and the team agreed to watch how SE handles this ticket before treating that as a standard practice; ultimately escalated to SE.", "standardized_area": "Integrations"}, {"date": "2026-07-28", "requester": "Ash Arraiza", "ka": "SeZyg2", "area": "Integrations", "summary": "• Custom object properties are not updating despite successful 204 API responses.", "tried": ["Confirmed 204s in Developer Tools > Logs for affected accounts", "Checked Object Manager > Properties — Region, CustomerCategory, PreferredTradeCentre already exist as mapped String properties", "Checked the data source's Sample Payload — cx_region/cx_industry/cx_preferred_trade_centre are recognized schema attributes — rules out schema mismatch", "Reviewed Troubleshooting: Custom Objects but does not call out properties unable to record", "Was previously linked to this linear:", "Customer still reported issues after bug was resolved."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4093882,", "replies": 9, "has_files": true, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail, shown highlighted in a screenshot), but no fix or workaround was shared in the thread beyond acknowledging the issue.", "standardized_area": "Integrations"}, {"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "• Customer sent multiple campaigns, however the recipient count does not match/is significantly lower than the expected count.", "tried": ["Followed this IKB", "RAST is not enabled", "Smart Sending turned off", "No Excluded segments or lists", "Reputation repair disabled", "No Audience filter applied since this is not an omnichannel campaign", "segment was not newly created.", "SS does not show any info on the dropped profiles (as far as I can see), may need help with Splunk logs."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4082512", "replies": 34, "has_files": true, "suggestion_summary": "Root cause was that the segment definition was changed (grew from ~1.6k to 27k+ profiles) after the campaign was scheduled; since RAST was disabled, the campaign only sent to the segment snapshot taken at schedule time. Recommended verifying timing via the segment growth report and account activity logs, and enabling RAST going forward if audience updates made after scheduling should be captured in the send.", "standardized_area": "Campaigns"}, {"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow  Debugger - link", "tried": ["No recent changes to flow", "No filters to trigger or emails", "Fairly straightforward setup", "Debugger suggests its stuck?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4070534", "replies": 9, "has_files": true, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account does have the custom action step The Nile AU (VjxEiY), however their other account The Nile NZ (RiJWfQ) does not  They are under the same family billing", "tried": ["Between the two accounts they have over 400k active profiles", "Came across this, which looks similar and slack thread", "What is the best way to check an account is on Flows 2 and if so, can I give the same explanation as Ellie in the case or should I ask in the slack first?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4071307", "replies": 13, "has_files": true, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "• Onsite JS crashes on every page load on mreatwell.com with the Error: undefined reading 'customerHubOnboarded'. • Comes from build-preview/commit-55449364d6d533811c1ff6d9c2ca2e8339925a83/atlas.js. • Customer Hub is not enabled on this account. • Customer's HAR shows fast.a.klaviyo.com/atlas/api/public/settings/Vdbaf7 returns 404.", "tried": ["this customer is requesting a lot of information that I'm not sure how to source.", "I've already told the customer the `build-preview/commit-{hash}` path is part of our standard rolling deployment process, not a beta or preview environment.", "ty team"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": true, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-15", "requester": "Chris Yinfoo", "ka": "Rn572y", "area": "Flows", "summary": "It appears 'Viewed Product' log is appearing twice for once instance of viewing the item on their site", "tried": ["The two instances would therefore appear in their flow setup when they only expect one", "Confirmed with the customer, they only recall setting up the integration via Klaviyo and have never encountered this before with other brands", "In this previous case it was deemed that there was two different scripts and the customer was instructed to remove the duplicate script", "However, the customer today mentioned \"I'm concerned that removing it may cause complications or affect other functionalities within the store.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4020964", "replies": 11, "has_files": true, "suggestion_summary": "Alicya identified the duplicate 'Viewed Product' events as coming from two sources — one client-side via Klaviyo and one server-side via a third-party app (WeTracked). She suggested the customer contact the third-party app to remove their tracking script if they want to eliminate the duplicate events from their flow.", "standardized_area": "Flows"}, {"date": "2026-06-15", "requester": "Ash Arraiza", "ka": "UrbgMW", "area": "Templates", "summary": "• Previewing the template as your own profile does not show dynamic content. Example: • Person A previews the template with Person A's email. • Person A does not see any dynamic content. • Person B previews the same template as Person A • Person B can see Person A's dynamic content", "tried": ["Had the customer clear cache and cookies from all time", "Got them to log out and log back in", "Got them to try in a private browser", "Got them to try in a different browser (edge and chrome)", "verified we're working in the same account and same template", "Cloned the template and still seeing the issue", "User is an Admin", "I've observed and clarified with the customer, that in the loom, the customer is not able to see the \"custom properties\" section in the preview and test page only when previewing with her own test profile.", "I don't believe that's expected behaviour, however would like to clarify before potentially esco'ing this to :garfield_b: :garfield_l:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001172", "replies": 23, "has_files": true, "suggestion_summary": "Alicya explained that simply seeing their name pre-filled in the preview pane doesn't mean their profile is selected — the user needs to actively retype their email address and select it from the dropdown. She recommended Ash create a Loom to demonstrate the correct preview steps to the customer.", "standardized_area": "Templates"}, {"date": "2026-06-10", "requester": "Meher Gambhir", "ka": "an79Sm", "area": "Campaigns", "summary": "CX is concerned the footer banner in many of their emails is rendering much wider than expected on desktop in Gmail, Chrome for test sends. It appears aligned correctly in preview.", "tried": ["CX said their emails often clip in Gmail, but they have not normally had footer issues from that before, so clipping does not seem to fully explain this case.", "I checked the footer table/ image sizing. The image cell had a 400px max width, but reducing that to 200 did not resolve the issue on CX end.", "Ran a test with my test gmail acc. Both through preview and test option and actually sending a clone of the campaign to myself. Could not replicate issue on my end.", "CX plans to send campaign out in around 6 hours from now, so wanted to confirm if there is anything else I can do for them to try fix this."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4012844", "replies": 15, "has_files": true, "suggestion_summary": "Alicya suggested the issue could be Gmail clipping or related to the new template editor migration, and advised that since the issue could not be replicated on their end, Meher should reply using the Gmail clipping angle.", "standardized_area": "Campaigns"}, {"date": "2026-06-09", "requester": "Ash Arraiza", "ka": "KwJYB2", "area": "Campaigns", "summary": "• Customer created an A/B test campaign, however no one received the variation B. • The A/B test results tab does not show variation B at all.", "tried": ["Created a segment for the customer to use, however they are expecting this to be closer to 6k profiles.", "When I clone the campaign, it shows 21k estimated recipients. So I'm unsure where the missing 6k profiles went.", "there are only 4 skipped profiles and 27 bounced profiles in recipient activity", "verified with customer that the campaigns were not made recently, and she's been using them consistently.", "Creating a segment for profiles who have received variation B yields 0 profiles.", "Creating a segment for profiles who have received variation A yields 14551 profiles.", "Basically, I'm unsure if this is related to the incident this morning.", "I've already linked the bug for the A/B test UI issue."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4010450", "replies": 11, "has_files": true, "suggestion_summary": "Alicya checked the Staffside campaign view and confirmed variation B was never sent, then recommended escalating to Business Licensing as it was unclear whether the issue stemmed from a platform incident or the linked UI bug (EXP-392).", "standardized_area": "Campaigns"}, {"date": "2026-06-04", "requester": "Ash Arraiza", "ka": "tNPZ9N", "area": "Lists & Segments", "summary": "• cloning segments between accounts is successful, however the segment conditions are not copied.", "tried": ["ensured user is an Admin in all accounts.", "ensured the matching custom properties do exist in the UK account", "checked linear for any known bugs.", "checked/followed this guide:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001556", "replies": 8, "has_files": true, "suggestion_summary": "Alicya clarified that 'contains text' conditions are not necessarily advanced operators, and recommended escalating to Business Licensing for confirmation while also requesting an update to the internal KB article on cross-account segment cloning.", "standardized_area": "Lists & Segments"}, {"date": "2026-06-02", "requester": "Ash Arraiza", "ka": "QCN2d7", "area": "Catalogs & Feeds", "summary": "• Back in stock reports tab loads indefinitely.", "tried": ["Did not replicate this issue in 2 test accounts", "*Cecilia's Basecamp* (XDLpgg) paid account, *Ash A Test Account* (UvCpx3) free account", "User attempting the action is an Admin (kate.leveille@bycharlotte.com.au)", "Re-attempted from incognito window.", "Can I esco to BL :eyes2:"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3995864", "replies": 17, "has_files": true, "suggestion_summary": "Alicya confirmed the same 500 internal server error in the customer's account (Back in Stock Reports tab) but could not replicate it in test accounts. She recommended escalating to Business Licensing.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-06-02", "requester": "Meher Gambhir", "ka": "WKMDP9", "area": "Flows", "summary": "Customer states they have not received any internal alert notifications from this flow since 21st May. Alerts should be sending if there has been more than 20mins since since checkout started (with amount higher than $1000). They were receiving multiple alerts in a day on the 21st of May and prior but it suddenly stopped.", "tried": ["Toggled the alert from Live to Draft and back to Live. No other changes made in history", "Appears could be similar to FP-1788 bug", "Tried to spot check profiles but could not find an example where there was a 20min gap between checkout started and placed order and it was post 21st May"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3991689", "replies": 12, "has_files": true, "suggestion_summary": "Alicya found many recent skips in the flow evaluation due to 'No recipients', visible even on the day of the query. She suggested asking the customer to check their internal alert recipient details (consent status), and linked Linear bug FP-1817 as a likely cause if profiles show a green checkmark but still aren't receiving alerts.", "standardized_area": "Flows"}, {"date": "2026-05-27", "requester": "Ash Arraiza", "ka": "PaDxZ9", "area": "Accounts", "summary": "• Customer cannot bulk suppress this segment.", "tried": ["Drafted a new segment within their account and found that only 99 profiles were suppressed in the last 90 days.", "User is an admin, so they should be able to suppress this segment.", "Checked Linear for any related tix."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3985709", "replies": 4, "has_files": true, "suggestion_summary": "Alicya checked Splunk and confirmed the bulk suppression job was e Billing team to get the customer a usage report, and noted that a custom report on API usage may also be possible.", "standardized_area": "Campaigns"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "VGeZHB", "area": "Integrations", "summary": "Exact same request works from laptop via curl, fails from n8n Cloud with Cloudflare block page", "tried": ["Asked for more info about API call, customer provided details on what's being blocked", "Asking if this is usual for IP to be blocked"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3688264", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed this is a standard IP whitelisting issue and directed the customer to follow the relevant steps.", "standardized_area": "Integrations"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "Wqcbfr", "area": "Catalogs & Feeds", "summary": "Customer updated inventory for item, wondering why BIS report still says queued for some products with same name", "tried": ["Looked at examples, SKU ID different from Shopify ID", "Found custom catalog sync also present, asked customer if aware", "Customer had no idea, asked to disconnect API catalog"], "ticket_url": "", "replies": 24, "has_files": false, "suggestion_summary": "Alicya walked through the options: either fix the custom catalog feed with developer help, or delete it entirely and resync using the Shopify catalog (noting this would affect Back-in-Stock). She recommended clarifying with the customer which path they prefer.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "X6M5Pn", "area": "Catalogs & Feeds", "summary": "• Localised product feed links", "tried": ["A lot of back and forth already, need advice on next best approach"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3642269", "replies": 16, "has_files": false, "suggestion_summary": "Alicya identified that the product URL in the customer's custom catalog feed was syncing with the incorrect URL, and recommended they fix it in their feed. She also suggested looping in the CSM to alert them to the situation.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "sqUwG2", "area": "Integrations", "summary": "Customer's Shopify Onsite Tracking says 'Turned Off', but Shopify says Activated", "tried": ["Used 'Get App Embed Metafields', can see actually false", "Considering \"Reset App Embed Metafields\" steps"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3659792", "replies": 2, "has_files": false, "suggestion_summary": "Alicya suggested following the existing guide carefully and making sure the Save button is clicked, then asking the customer for a screen recording if the issue persists.", "standardized_area": "Integrations"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "3670894", "area": "Integrations", "summary": "Custom website API to Klaviyo, discount codes have same expiry date, need evergreen codes with varying time periods for sunset flow. Asking if Klaviyo can tell website how many codes needed and duration via endpoint call.", "tried": ["Still trying to wrap head around their situation"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3670894", "replies": 15, "has_files": false, "suggestion_summary": "Alicya explained that coupon expiry must be set as a fixed date (not a relative period like '14 days'), but leaving it blank defaults to 1-year expiry from when the profile enters the flow. She suggested asking in #ask-apis about adding a relative expiry option.", "standardized_area": "Integrations"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
