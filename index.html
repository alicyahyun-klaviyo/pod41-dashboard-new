<style>

  .donut-wrap { position: relative; width: 160px; height: 160px; flex-shrink: 0; }

  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #3a3a3c; cursor: pointer; padding: 3px 6px; border-radius: 6px; transition: background 0.1s; }

  .legend-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script>
const QUESTIONS=[{"date": "2026-09-14", "requester": "Chris Yinfoo", "ka": "V458YQ", "area": "Flows", "summary": "Customer noticed lack of flow emails sending", "tried": ["Wasn't seeing any results via the debugger (Not sure if date is behind the search timeframe?)", "Couldn't see any skipped emails", "The last profile to receive email 1A in June 2026-"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4174764", "replies": 6, "has_files": true, "suggestion_summary": "Alicya ran Chronosphere queries and found the profiles never entered the date-triggered flow at all (not just delayed), matching a known bug (FP-3599: profiles failing to enter date-triggered flow); she recommended escalating to Backline.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "Vbxg9f", "area": "Flows", "summary": "Flow webhook activity showing many skipped", "tried": ["Tried to compare examples which worked vs didn't but haven't quite found a reason", "When trying the test request, see the following details", "Any other logs we can check or review further?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165180", "replies": 6, "has_files": true, "suggestion_summary": "Alicya identified the webhook was a non-Klaviyo (customer-owned) webhook, suggesting the skipped activity was likely due to an issue on the receiving end, and recommended checking in with the webhook owner directly.", "standardized_area": "Flows"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "ThEqHV", "area": "Sign Up Forms", "summary": "Customer has one Klaviyo parent account (SINGER - ThEqHV ) with multiple child accounts.  Their previous WooCommerce child-account setup has transitioned to BigCommerce, and they are unable to configure flows or use Klaviyo for marketing across their BigCommerce Multi-Storefront setup.", "tried": ["Context on migration direction", "Checked sign up form targeting"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115668", "replies": 12, "has_files": true, "suggestion_summary": "Confirmed the JavaScript/integration setup was correct on the parent account, and identified that the customer's sign-up form was missing the targeting needed to limit the Singer form to the Singer site; Alicya and Chris planned to huddle to walk through the full BigCommerce multi-storefront migration (forms, flows, list structure) together.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-09", "requester": "Chris Yinfoo", "ka": "PDQku2", "area": "Catalogs & Feeds", "summary": "• Unable to save new product feed • Existing product feed is not available to select when adding a product block into email", "tried": ["Tested with a clone campaign and new campaign and no joy", "Not able to replicate in my test account"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4166614", "replies": 20, "has_files": true, "suggestion_summary": "Found a 403 error in the network tab when creating a new product feed and adding a product block to the campaign, which appeared to be unexpected behaviour; Alicya recommended escalating the issue to Backline.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-09-08", "requester": "Ash Arraiza", "ka": "UJFV9p", "area": "Flows", "summary": "• Profiles are processed through the conditional split, but then they aren't being queued for the message afterwards. See screenshots.", "tried": ["checked skipped messages, email does not appear", "checked scheduled messages, email does not appear", "checked flow debugger, queuing appears complete?", "no filters on the flow", "no previous time delay blocks between the split and the message.", "similar bugs referenced (FP-3307, FP-1698, FP-3700, FP-3662)"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164569", "replies": 7, "has_files": true, "suggestion_summary": "Alicya found the split action shared the same action ID as another block, which didn't match any known flow bugs, so she recommended escalating to have engineering create a new bug ticket.", "standardized_area": "Flows"}, {"date": "2026-09-08", "requester": "Meher Gambhir", "ka": "KSMVzB", "area": "Email Deliverability", "summary": "Legitimate profiles are being suppressed by BOT_PROTECTION through consent webhooks from unrelated accounts", "tried": ["CX has a WooCommerce Integration in this acc", "Both profiles had integration consent events with no IP or user agent", "Created segment to unsuppress for CX", "No duplicate integration for this account", "Could it be related to bug ICM-1282 (Bot Protection is suppressing legitimate signups)"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4165362", "replies": 2, "has_files": true, "suggestion_summary": "Alicya confirmed the profiles were suppressed by subscription protection (visible via Splunk calls from multiple account IDs) and, since the customer confirmed they were legitimate, advised linking the known ICM-1282 bot-protection bug ticket.", "standardized_area": "Email Deliverability"}, {"date": "2026-09-08", "requester": "Chris Yinfoo", "ka": "VyhTNh", "area": "Integrations", "summary": "Prestashop integration is enabled however the customer is not seeing added to cart events  Klaviyo.js script does not appear to be present however this should be added automatically?", "tried": ["Other events are working", "The customer navigated to Integrations > Manage Data > Set Up Web Tracking > Add, but nothing happens - not even an error message", "Prestashop: 1.7.8.8, Klaviyo module: v1.12.9", "No multi-store, API keys applied at store level", "No integration errors in Staffside", "Modules checked (no Lightspeed or Cloudflare)"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4164460", "replies": 7, "has_files": false, "suggestion_summary": "Alicya found no Klaviyo JS injected on the site at all and pointed to the PrestaShop troubleshooting guide; since the previous agent had already followed it without success, she advised escalating.", "standardized_area": "Integrations"}, {"date": "2026-09-03", "requester": "Ash Arraiza", "ka": "XsDESE", "area": "Templates", "summary": "• Smart translation for Swedish and Swiss High German changes complete images in the template during a live send. • The customer manually changes images depending on the locale, and saves the template. But when the campaign is sent, the image shown ends up reverting to the original.", "tried": ["Looked at web view for the example profile that received the wrong image, but web view shows the correct images.", "No access to view translations anymore (access expired), but captured screenshots of template images manually set per translation.", "Checked linear for any bugs on this and didn't find any bugs specifically for ST reverting template images.", "Understands image can be changed if manually set, but issue is that once template is saved, the live send does not apply the changes."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4145150", "replies": 14, "has_files": false, "suggestion_summary": "Alicya explained that the web view doesn't always reflect what was actually delivered, and pointed Ash to the Staffside template-rendering-artifacts tool (or having the customer forward the actual received email) to confirm which image version was truly sent; since the staff tool failed to load, the plan was to ask the customer to forward screenshots of the received email instead.", "standardized_area": "Templates"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "TP8tDr", "area": "Sign Up Forms", "summary": "The customer is running into HTTP 503 errors when trying to sign up to their pop up form  (Not been able to replicate the issue nor did the previous agent)", "tried": ["Tried to replicate but haven't been able to", "Requested more information from customer on their experience", "They have done the usual other tests and apparently they are experiencing the same", "Previous case closed without resolution, customer would like further look"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151819", "replies": 23, "has_files": false, "suggestion_summary": "Alicya traced the reported 503s to the client/profiles (identify) and onsite/track-analytics calls rather than the client/subscriptions (subscribe) endpoint, and since the team couldn't reproduce the issue and the customer had no screenshot or HAR file confirming the failure, they escalated the ticket to Backline as a sign-up form issue.", "standardized_area": "Sign Up Forms"}, {"date": "2026-09-01", "requester": "Chris Yinfoo", "ka": "WZcvhJ", "area": "Sign Up Forms", "summary": "Customer is unable to publish their form (There are stats which means it was possible previously)", "tried": ["During testing, also found unable to clone the form but can for others, so something might be up", "Ruled out missing side image", "Ruled out probability notification percentage notification"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4150949", "replies": 5, "has_files": false, "suggestion_summary": "Alicya and Chris found the form also couldn't be cloned and had a buggy image-block deletion, pointing to a broader form-editor bug rather than a config issue, so they escalated to Backline.", "standardized_area": "Sign Up Forms"}, {"date": "2026-08-31", "requester": "Chris Yinfoo", "ka": "XNCrpa", "area": "Catalogs & Feeds", "summary": "The customer has Shopify markets enabled and wants to confirm how to have the correct product URL displayed in their dynamic product feed  \"Could you please confirm how we can make Klaviyo automatically use the Shopify Markets UK product URLs for UK customers, or whether something is still missing in the market/catalog configuration on our account?\"", "tried": ["Referring to help article, does smart translations need to be turned on for localised content to work? (customer currently does not have smart translation)", "When tested in Preview & Test by selecting different profiles, displayed different pricing and link was different", "Does that mean it works without smart translations and they have everything set up as they need?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151091", "replies": 16, "has_files": false, "suggestion_summary": "Confirmed the localized product URL/pricing in the dynamic product feed comes from the Shopify Markets integration itself — Smart Translations is not required, since the customer's product titles were already translated separately.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-08-25", "requester": "Ash Arraiza", "ka": "Yr3S6i", "area": "K-Service", "summary": "• Helpdesk // Gorgias • Inbound SMS messages are syncing to Gorgias successfully, but replies sent from Gorgias are not being delivered from the Klaviyo toll-free number. Customers are not receiving the SMS reply sent from Gorgias. • Expected behaviour: a Gorgias reply to the Klaviyo-originated SMS ticket should be routed through Klaviyo and sent from the same Klaviyo sending number that received ", "tried": ["Confirmed the customer is replying through Gorgias, not Klaviyo Helpdesk.", "Followed IKB troubleshooting steps; no Gorgias - Opened Ticket metrics have fired.", "Confirmed the test customer is sending the inbound message to the Klaviyo SMS number.", "Confirmed the account has an active Klaviyo toll-free number.", "Confirmed inbound SMS messages are appearing in Gorgias.", "Sync text message conversations is enabled.", "Reviewed the Gorgias ticket screenshot; uses a synthetic sms-integrations+...@klaviyo.com address which is believed expected.", "Inbound test messages tagged Message Type: unrecognized rather than normal \"SMS\"", "Transactional SMS consent on the profile is not subscribed - related?", "Similar linear (VEX-269) describes same behaviour but has been cancelled."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4141388", "replies": 2, "has_files": false, "suggestion_summary": "Inbound SMS replies from Gorgias were not being routed back through Klaviyo's toll-free number to customers even though inbound messages synced correctly; the behavior matched a previously-cancelled Linear ticket (VEX-269) describing the same issue, and the thread ended without a confirmed fix.", "standardized_area": "K-Service"}, {"date": "2026-08-17", "requester": "Ash Arraiza", "ka": "WeEnvL", "area": "Accounts", "summary": "• Active profile count is mismatched against the billing page and profile page.", "tried": ["toggling between the beta and old billing layout makes no difference", "reviewed the segment they suppressed, confirmed those profiles successfully suppressed", "customer suppressed at around 10am today.", "no active Linears on this so far.", "can I send to BL?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4128222", "replies": 10, "has_files": false, "suggestion_summary": "Team confirmed this is expected: the billing page's active profile count lags behind actual suppressions by up to a few hours, especially after a large suppression. Advised directing the customer to check the Profiles tab instead of the billing page while it catches up.", "standardized_area": "Accounts"}, {"date": "2026-08-14", "requester": "Ash Arraiza", "ka": "SyikaT", "area": "Templates", "summary": "• The Instagram logo in the social links block is being replaced by 3 images in the connected instagram account, in live preview sends.", "tried": ["tried rebuilding the template from scratch", "tried removing Instagram and re-adding it", "tried from private browser", "tried on the Gmail mobile app", "checked linear, no known issues on this so far"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4124848", "replies": 21, "has_files": false, "suggestion_summary": "Alicya and Ash could not replicate the issue themselves, but since two different customers reported the same intermittent Instagram logo replacement bug, they agreed to escalate to Backline and linked a similar Linear issue (EDIT-1347: Received Image within header of a campaign send instead of Text).", "standardized_area": "Templates"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "U8hAjh", "area": "Flows", "summary": "The customer is trying to trigger back in stock flow (BigCommerce)  There looks to be issues with how inventory is checked, thus affecting the flow", "tried": ["Came across a linear issue (IEC-987: BigCommerce webhook triggered variant sync can return stale cached data) that sounds related.", "Doesn't appear to be workaround suggestions.", "\"The first SKU was manually reduced to zero stock, but stock was raised to trigger back in stock notification. According to Klaviyo, this SKU hasn't updated since it was taken out of stock.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4100234", "replies": 5, "has_files": false, "suggestion_summary": "Confirmed the SKU's stock had not been resynced from BigCommerce since it went out of stock, matching a known Linear bug (IEC-987) where BigCommerce webhook-triggered variant syncs can return stale cached inventory. Advised escalating to the SE team since it appears linked to an existing ZD ticket on the same issue.", "standardized_area": "Flows"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "VJBf7Z", "area": "Flows", "summary": "The customer has a webhook action", "tried": ["Compared two profiles; the one that did not complete has a status of 'QUEUED_FROM_MANUAL'", "The first 5 webhook actions do not currently have any needs review actions", "Anything in their order of operations which explains why many did not process?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115517", "replies": 9, "has_files": false, "suggestion_summary": "QUEUED_FROM_MANUAL means the profile was released from manual review into the sending queue, but that doesn't confirm the message actually sent. The profile had been stuck in that state since Friday with nothing recorded on the webhook side, so this w aused by historical_import:false on every call). A fix exists in plugin v1.14.3/1.14.4, so they advised waiting for the customer to update; if the issue persists after updating, the plan is to ask in the #ask-shopware channel for further help.", "standardized_area": "Integrations"}, {"date": "2026-07-31", "requester": "Ash Arraiza", "ka": "UVnXrV", "area": "Templates", "summary": "• Two email templates return 422 on every API read; editor still opens/edits them fine. • Template XuXd5H: \"Header blocks with 'links' desktop layout must not include a logo subblock\" • Shared footer has two overlapping Header bar blocks (desktop + mobile), both disabled in DOM, can't be selected/deleted in editor. • Template UDf3uV: \"label_color is only valid when show_labels is True\" • Stale lab", "tried": ["Cross-checked past tickets and found this has affected multiple accounts.", "Traced to linear EDIT-1260 (drive block encoding invalidation rate toward zero) with backend cleanup commands already built for both error types.", "Not sure where to go from here or whether to escalate"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4096027", "replies": 17, "has_files": false, "suggestion_summary": "Alicya used Claude to diagnose that the 422 came from a stale label_color value left on a Social Links block after show_labels was toggled off, which the API validator now rejects on read. She confirmed this looks like a backend/API bug (422 isn't even a documented status code) and told Ash to escalate to SE, flagging that the customer is using the MCP.", "standardized_area": "Templates"}, {"date": "2026-07-30", "requester": "Ash Arraiza", "ka": "SPBxWt", "area": "Flows", "summary": "• Flow message analytics shows very little data, despite hundreds of profiles moving through the initial conditional split. • Profiles that qualified for this flow did not enter.", "tried": ["Created a segment which shows 124 profiles received an email from this flow in the last 7 days.", "Flow entry chema mismatch", "Reviewed Troubleshooting: Custom Objects article but doesn't call out properties unable to record", "Previously linked to linear ACO-25608 (custom object stuck in publishing)", "Customer still reported issues after bug was resolved."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4093882", "replies": 9, "has_files": false, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail, shown highlighted in a screenshot), but no fix or workaround was shared in the thread beyond acknowledging the issue.", "standardized_area": "Integrations"}, {"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "• Customer sent multiple campaigns, however the recipient count does not match/is significantly lower than the expected count.", "tried": ["Followed IKB troubleshooting for low estimated recipient count", "RAST is not enabled", "Smart Sending turned off", "No Excluded segments or lists", "Reputation repair disabled", "No Audience filter applied since this is not an omnichannel campaign", "segment was not newly created.", "SS does not show any info on the dropped profiles, may need help with Splunk logs."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4082512", "replies": 34, "has_files": false, "suggestion_summary": "Root cause was that the segment definition was changed (grew from ~1.6k to 27k+ profiles) after the campaign was scheduled; since RAST was disabled, the campaign only sent to the segment snapshot taken at schedule time. Recommended verifying timing via the segment growth report and account activity logs, and enabling RAST going forward if audience updates made after scheduling should be captured in the send.", "standardized_area": "Campaigns"}, {"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow", "tried": ["No recent changes to flow", "No filters to trigger or emails", "Fairly straightforward setup", "Debugger suggests its stuck?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4070534", "replies": 9, "has_files": false, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account has the custom action step The Nile AU (VjxEiY), however their other account The Nile NZ (RiJWfQ) does not. They are under the same family billing.", "tried": ["Between the two accounts they have over 400k active profiles", "Came across a similar past ticket and slack thread", "What is the best way to check an account is on Flows 2, and how to explain to customer?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4071307", "replies": 13, "has_files": false, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "• Onsite JS crashes on every page load on mreatwell.com with the Error: undefined reading 'customerHubOnboarded'. • Comes from a build-preview commit path in atlas.js. • Customer Hub is not enabled on this account. • Customer's HAR shows a public settings endpoint returns 404.", "tried": ["Customer requesting a lot of information not sure how to source.", "Told the customer the build-preview/commit path is part of standard rolling deployment process, not a beta/preview environment."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": false, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-24", "requester": "Chris Yinfoo", "ka": "XEPuyw", "area": "Integrations", "summary": "The customer is seeing a different site set up for their integration however they no longer use this and their site has changed domains. Is it possible to see if they did have the old site there at some point?", "tried": ["Noticed the customer reaching out did make some changes and asked for clarification"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4032066", "replies": 21, "has_files": false, "suggestion_summary": "Alicya suggested using PostmanLite system_status to check the WooCommerce integration URL, which appeared to be pointing to the old .wp1.sh staging site rather than the new .co.uk domain. The recommendation was to advise the customer about the 526 error and suggest removing and re-integrating to fix the URL mismatch.", "standardized_area": "Integrations"}, {"date": "2026-06-23", "requester": "Chris Yinfoo", "ka": "UuFRx3", "area": "Flows", "summary": "The third-party connector Funnel is encountering repeated 500 Internal Server Error responses from Klaviyo when attempting to access GET /api/flows/{id}/flow-actions/", "tried": ["Flow does exist", "Can see a similar request for a different flow which did work", "Found similar linear issue FLOW-660 (500 response 7", "requester": "Ash Arraiza", "ka": "PaDxZ9", "area": "Accounts", "summary": "• Customer cannot bulk suppress a segment.", "tried": ["Drafted a new segment within their account and found that only 99 profiles were suppressed in the last 90 days.", "User is an admin, so should be able to suppress this segment.", "Checked Linear for any related tickets."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3985709", "replies": 4, "has_files": false, "suggestion_summary": "Alicya checked Splunk and confirmed the bulk suppression job was accepted but not yet processed; she suggested waiting a few hours to see if profiles update, and if still not suppressed, to comment on the related Linear ticket ICM-599. Ash later confirmed profiles were still not suppressed after several hours and added the ticket to Linear.", "standardized_area": "Accounts"}, {"date": "2026-05-26", "requester": "Meher Gambhir", "ka": "Rmwb2z", "area": "K-Social", "summary": "CX is trying to connect their Instagram account to the new Social feature, but the connection is not sticking.", "tried": ["Asked CX to follow the reconnect flow from the Klaviyo error message. Completed it including consent prompt, but error remained.", "Verified the Instagram permissions look all good against the guide.", "Checked Developer Tools logs and found no related API errors. Found a similar ticket with Instagram API Error 10 (Insufficient permissions).", "Had CX reauthorise Facebook. Worked briefly, but kept disconnecting again shortly after. Tried multiple times, disconnection error did not go away."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3983038", "replies": 10, "has_files": false, "suggestion_summary": "Alicya suggested verifying the customer has Admin/Editor/Full Control on their Facebook/Meta assets for the Instagram Business account, and asked Meher to collect screenshots of both Facebook Page Advanced Messaging settings (Connected Apps > Klaviyo-IG) and Instagram Website Permissions t ferent conditions matching the profile", "Waited time after creating the segment to see if results were delayed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3962610", "replies": 4, "has_files": false, "suggestion_summary": "Alicya created a test segment and noted it can take up to 20 minutes to populate per the KB. If it still doesn't work, she linked a known Linear issue (GPLAT-425) and advised asking the SA (Bella) to follow up directly in the Linear ticket to flag urgency, since the bug is in backlog with no ETA.", "standardized_area": "Lists & Segments"}, {"date": "2026-05-12", "requester": "Chris Yinfoo", "ka": "VD2Qzs", "area": "Flows", "summary": "The customer has observed that emails are taking longer than 1-2mins to send from the flow (No delay step however maybe conditional split steps)", "tried": ["Previous agent explained that flows with many splits/filters take longer since Klaviyo evaluates more decision points before each person continues; conditional splits are point-in-time evaluations and filters add processing at each send step.", "Customer came back with follow-up queries."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3954968", "replies": 9, "has_files": false, "suggestion_summary": "Alicya noted she had a similar delay issue that gradually improved, and that 3 minutes is still within the acceptable grace period per an existing Slack thread. She recommended sending the customer David's example response about expected flow send times.", "standardized_area": "Flows"}, {"date": "2026-05-08", "requester": "Meher Gambhir", "ka": "LnETuM", "area": "K-Service", "summary": "An email domain is showing as Failed in Klaviyo, but the customer's testing suggests the email flow is working - test email reached Helpdesk, landed in Spam, and Helpdesk reply was successfully received at their external address. Trying to understand why status still shows Failed and how to fix emails going to Helpdesk spam classification.", "tried": ["CX let sortCol="date",sortDir="desc",expandedIdx=null;
const CHART_COLORS=["#4A154B","#007aff","#34c759","#ff9500","#af52de","#ff3b30","#5ac8fa","#ffcc00","#8e8e93","#30b0c7","#ff2d55","#5856d6"];
function getAreaCounts(){const counts={};QUESTIONS.forEach(q=>{counts[q.area]=(counts[q.area]||0)+1;});return Object.entries(counts).sort((a,b)=>b[1]-a[1]);}
function filterByArea(area){const sel=document.getElementById("areaFilter");sel.value=sel.value===area?"":area;renderTable();}
function renderChart(){
  const counts=getAreaCounts();
  const total=QUESTIONS.length;
  const activeArea=document.getElementById("areaFilter")?document.getElementById("areaFilter").value:"";
  let cumulative=0;
  const gradientParts=counts.map(([area,count],i)=>{
    const pct=total?count/total*100:0;
    const start=cumulative;
    cumulative+=pct;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    return `${color} ${start}% ${cumulative}%`;
  });
  document.getElementById("donutChart").style.background=gradientParts.length?`conic-gradient(${gradientParts.join(",")})`:"#e5e5ea";
  document.getElementById("donutTotal").textContent=total;
  document.getElementById("donutLegend").innerHTML=counts.map(([area,count],i)=>{
    const color=CHART_COLORS[i%CHART_COLORS.length];
    const pct=total?((count/total)*100).toFixed(1):"0.0";
    const isActive=activeArea===area;
    return `<div class="legend-item${isActive?" active":""}" onclick="filterByArea('${area.replace(/'/g,"\\'")}')"><span class="legend-swatch" style="background:${color}"></span><span class="legend-label">${esc(area)}</span><span class="legend-count">${count}</span><span class="legend-pct">${pct}%</span></div>`;
  }).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  renderChart();
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderChart();renderTable();
</script>
