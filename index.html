<script>
const QUESTIONS=[{"date": "2026-08-31", "requester": "Chris Yinfoo", "ka": "XNCrpa", "area": "Catalogs & Feeds", "summary": "The customer has Shopify markets enabled and wants to confirm how to have the correct product URL displayed in their dynamic product feed  \"Could you please confirm how we can make Klaviyo automatically use the Shopify Markets UK product URLs for UK customers, or whether something is still missing in the market/catalog configuration on our account?\"", "tried": ["Referring to this - , does smart translations need to be turned on for localised content to work ? (The customer currently does not have smart translation)", "When I tested in 'Preview & Test' by selecting different profiles, I did display different pricing and link was different", "Does that mean it works without smart translations and they have everything set up as they need?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4151091", "replies": 16, "has_files": true, "suggestion_summary": "Confirmed the localized product URL/pricing in the dynamic product feed comes from the Shopify Markets integration itself — Smart Translations is not required, since the customer's product titles were already translated separately.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-08-25", "requester": "Ash Arraiza", "ka": "Yr3S6i", "area": "K-Service", "summary": "• Helpdesk // Gorgias • Inbound SMS messages are syncing to Gorgias successfully, but replies sent from Gorgias are not being delivered from the Klaviyo toll-free number. Meaning customers are not receiving the SMS reply sent from Gorgias. • The expected behaviour is for a Gorgias reply to the Klaviyo-originated SMS ticket to be routed through Klaviyo and sent from the same Klaviyo sending number ", "tried": ["Confirmed the customer is replying through Gorgias, not Klaviyo Helpdesk.", "Followed steps in this IKB, and this one. However, no Gorgias - Opened Ticket metrics have fired.", "Confirmed the test customer is sending the inbound message to the Klaviyo SMS number.", "Confirmed the account has an active Klaviyo toll-free number.", "Confirmed inbound SMS messages are appearing in Gorgias.", "Sync text message conversations is enabled.", "Reviewed the Gorgias ticket screenshot. The ticket is titled Klaviyo SMS, contains the customer's phone number, and uses a synthetic`sms-integrations+...@klaviyo.com`address in the email-style thread which I believe is expected?", "The inbound test messages are tagged `Message Type: unrecognized` rather than normal \"SMS\"", "Transactional SMS consent on the profile is not subscribed, would this be related to this issue?", "This is a linear that appears to describe the same behaviour, however, its been cancelled."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4141388", "replies": 2, "has_files": true, "suggestion_summary": "Inbound SMS replies from Gorgias were not being routed back through Klaviyo's toll-free number to customers even though inbound messages synced correctly; the behavior matched a previously-cancelled Linear ticket (VEX-269) describing the same issue, and the thread ended without a confirmed fix.", "standardized_area": "K-Service"}, {"date": "2026-08-17", "requester": "Ash Arraiza", "ka": "WeEnvL", "area": "Accounts", "summary": "• Active profile count is mismatched against the billing page and profile page.", "tried": ["toggling between the beta and old billing layout makes no difference", "reviewed the segment they suppressed, and confirmed those profiles have been successfully suppressed via the growth tab and checking manually suppressed profiles in the last 1 day.", "customer suppressed at around 10am today.", "no active Linears on this so far.", "can I send to BL?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4128222", "replies": 10, "has_files": true, "suggestion_summary": "Team confirmed this is expected: the billing page's active profile count lags behind actual suppressions by up to a few hours, especially after a large suppression. Advised directing the customer to check the Profiles tab instead of the billing page while it catches up.", "standardized_area": "Accounts"}, {"date": "2026-08-14", "requester": "Ash Arraiza", "ka": "SyikaT", "area": "Templates", "summary": "• The Instagram logo in the social links block is being replaced by 3 images in the connected instagram account, in live preview sends.", "tried": ["tried rebuilding the template from scratch", "tried removing Instagram and re-adding it", "tried from private browser", "tried on the Gmail mobile app", "checked linear, no known issues on this so far", ":pingu-huh: v weird"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4124848", "replies": 21, "has_files": true, "suggestion_summary": "Alicya and Ash could not replicate the issue themselves, but since two different customers reported the same intermittent Instagram logo replacement bug, they agreed to escalate to Backline and linked a similar Linear issue (EDIT-1347: Received Image within header of a campaign send instead of Text).", "standardized_area": "Templates"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "U8hAjh", "area": "Flows", "summary": "The customer is trying to trigger back in stock flow (BigCommerce)  There looks to be issues with how inventory is checked, thus affecting the flow  Looking to confirm the below is related?", "tried": ["Came across this linear and sounds related -", "Doesn't appear to be workaround suggestions?", "\"The first SKU (DFLC6766) was manually reduced to zero stock on Friday, but I raised the stock to the full stock count to trigger the back in stock notification. According to Klaviyo, this SKU hasn't updated since it was taken out of stock on Friday\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4100234", "replies": 5, "has_files": true, "suggestion_summary": "Confirmed the SKU's stock had not been resynced from BigCommerce since it went out of stock, matching a known Linear bug (IEC-987) where BigCommerce webhook-triggered variant syncs can return stale cached inventory. Advised escalating to the SE team since it appears linked to an existing ZD ticket on the same issue.", "standardized_area": "Flows"}, {"date": "2026-08-10", "requester": "Chris Yinfoo", "ka": "VJBf7Z", "area": "Flows", "summary": "The customer has a webhook action", "tried": ["Compared two profiles and it looks like the one that did not complete has a status of 'QUEUED_FROM_MANUAL'", "The first 5 webhook actions do not currently have any needs review actions", "Anything in their order of operations which explains why many did not process?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4115517", "replies": 9, "has_files": true, "suggestion_summary": "QUEUED_FROM_MANUAL means the profile was released from manual review into the sending queue, but that doesn't confirm the message actually sent. The profile had been stuck in that state since Friday with nothing recorded on the webhook side, so this was identified as a likely flow bug and escalated to Backline.", "standardized_area": "Flows"}, {"date": "2026-08-04", "requester": "Ash Arraiza", "ka": "Vh5xLA", "area": "Templates", "summary": "• The template preview hides the last 2 blocks in the template editor.", "tried": ["exported the HTML for the template, and the HTML does not contain the missing blocks", "imported that HTML into test account and verified it does not include the missing blocks", "verified there is no display settings enabled for the blocks or sections", "rebuilt the template from scratch and still seeing the issue", "Selecting a preview profile does not make a difference", "Selecting an event also does not make a difference", "can I send to backline?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4104767", "replies": 1, "has_files": true, "suggestion_summary": "Alicya confirmed the missing blocks issue looked unusual/unexpected, but no specific fix or next step had been given yet in the thread.", "standardized_area": "Templates"}, {"date": "2026-08-03", "requester": "Ash Arraiza", "ka": "XSJVww", "area": "Integrations", "summary": "Shopware — customers who are already subscribed are getting multiple double opt in emails. Already found the cause: Payload shows historical_import: false on every call, so each resend re-triggers DOI. Shopware plugin resends full subscriber batch to a DOI list every 11 mins.", "tried": ["Found 4 prior Zendesk tickets with the same pattern.", "Checked plugin changelog. Fixes exist for 1.14.3/1.14.4, customer is on 1.14.1.", "Confirmed DOI sends line up with repeated subscribe job timestamps.", "Advised customer to switch the list to single opt-in temporarily.", "Unsure whether a new linear needs to be created or whether one already exists."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097328", "replies": 9, "has_files": true, "suggestion_summary": "The team found several prior tickets with the same Shopware plugin bug (repeated DOI resends caused by historical_import:false on every call). A fix exists in plugin v1.14.3/1.14.4, so they advised waiting for the customer to update; if the issue persists after updating, the plan is to ask in the #ask-shopware channel for further help.", "standardized_area": "Integrations"}, {"date": "2026-07-31", "requester": "Ash Arraiza", "ka": "UVnXrV", "area": "Templates", "summary": "• Two email templates return 422 on every API read; editor still opens/edits them fine. • Template XuXd5H: Header blocks with 'links' desktop layout must not include a logo subblock • Shared footer has two overlapping Header bar blocks (desktop + mobile), both disabled in DOM, can't be selected/deleted in editor. • Template UDf3uV: label_color is only valid when show_labels is True • Stale label_c", "tried": ["Cross-checked past tickets and found that this has affected multiple accounts.", "Traced to linear EDIT-1260, identified matching backend cleanup commands already built for both error types.", "Not really sure where to go from here or whether to escalate."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4096027", "replies": 17, "has_files": false, "suggestion_summary": "Alicya used Claude to diagnose that the 422 came from a stale label_color value left on a Social Links block after show_labels was toggled off, which the API validator now rejects on read. She confirmed this looks like a backend/API bug (422 isn't even a documented status code) and told Ash to escalate to SE, flagging that the customer is using the MCP.", "standardized_area": "Templates"}, {"date": "2026-07-30", "requester": "Ash Arraiza", "ka": "SPBxWt", "area": "Flows", "summary": "• Flow message analytics shows very little data, despite hundreds of profiles moving through the initial conditional split. • Profiles that qualified for this flow did not enter.", "tried": ["Created a segment which shows 124 profiles received an email from this flow in the last 7 days.", "Flow entry looks normal (Placed Order) and no filters added to the flow.", "No additional filters on the flow messages", "So emails are actually sending, the flow's own analytics tab is just reporting it wrong?", "This account has manually ended A/B tests on this flow twice recently which could be related to bugs FP-2813, FP-3146"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4097651", "replies": 2, "has_files": false, "suggestion_summary": "Alicya confirmed this matches the known FP-3146 bug (flow A/B test not recording deliveries correctly), the same pattern she'd seen reported by the CNX team, which explains why flow analytics under-report despite messages actually sending.", "standardized_area": "Flows"}, {"date": "2026-07-29", "requester": "Chris Yinfoo", "ka": "WqX2J6", "area": "Integrations", "summary": "Meta Filled Out Lead Ad metric stopped working", "tried": ["Can see a 403 authorization Unsupported request - method type: get error for Periodic Sync in SS", "Asked customer to check their permission settings"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4088889", "replies": 29, "has_files": false, "suggestion_summary": "Team discussed the 403 periodic sync error and confirmed the customer's Meta permissions and TOS acceptance looked fine, so no clear fix was found in-thread. Ash shared that a similar case was resolved by manually restarting the periodic sync via the KB steps, and the team agreed to watch how SE handles this ticket before treating that as a standard practice; ultimately escalated to SE.", "standardized_area": "Integrations"}, {"date": "2026-07-28", "requester": "Ash Arraiza", "ka": "SeZyg2", "area": "Integrations", "summary": "• Custom object properties are not updating despite successful 204 API responses.", "tried": ["Confirmed 204s in Developer Tools > Logs for affected accounts", "Checked Object Manager > Properties — Region, CustomerCategory, PreferredTradeCentre already exist as mapped String properties", "Checked the data source's Sample Payload — recognized schema attributes — rules out schema mismatch", "Reviewed Troubleshooting: Custom Objects KB but does not call out properties unable to record", "Was previously linked to linear ACO-25608 (custom object stuck in publishing)", "Customer still reported issues after bug was resolved."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4093882", "replies": 9, "has_files": false, "suggestion_summary": "The thread confirmed the bug is real (some custom object property mappings save successfully while others silently fail, shown highlighted in a screenshot), but no fix or workaround was shared in the thread beyond acknowledging the issue.", "standardized_area": "Integrations"}, {"date": "2026-07-21", "requester": "Ash Arraiza", "ka": "ULQq44", "area": "Campaigns", "summary": "• Customer sent multiple campaigns, however the recipient count does not match/is significantly lower than the expected count.", "tried": ["Followed IKB troubleshooting campaigns article", "RAST is not enabled", "Smart Sending turned off", "No Excluded segments or lists", "Reputation repair disabled", "No Audience filter applied since this is not an omnichannel campaign", "segment was not newly created.", "SS does not show any info on the dropped profiles, may need help with Splunk logs."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4082512", "replies": 34, "has_files": false, "suggestion_summary": "Root cause was that the segment definition was changed (grew from ~1.6k to 27k+ profiles) after the campaign was scheduled; since RAST was disabled, the campaign only sent to the segment snapshot taken at schedule time. Recommended verifying timing via the segment growth report and account activity logs, and enabling RAST going forward if audience updates made after scheduling should be captured in the send.", "standardized_area": "Campaigns"}, {"date": "2026-07-15", "requester": "Chris Yinfoo", "ka": "T6Gakh", "area": "Flows", "summary": "Profile was not sent email in flow", "tried": ["No recent changes to flow", "No filters to trigger or emails", "Fairly straightforward setup", "Debugger suggests its stuck?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4070534", "replies": 9, "has_files": false, "suggestion_summary": "Alicya identified this was likely the known FP-2122 bug (profile stuck in executing state). Chris planned to ask on the Linear ticket whether the affected profile's flow actions could be pushed through or replayed.", "standardized_area": "Flows"}, {"date": "2026-07-14", "requester": "Chris Yinfoo", "ka": "RiJWfQ", "area": "Flows", "summary": "This account does have the custom action step The Nile AU (VjxEiY), however their other account The Nile NZ (RiJWfQ) does not. They are under the same family billing.", "tried": ["Between the two accounts they have over 400k active profiles", "Came across a similar past ticket and slack thread", "What is the best way to check an account is on Flows 2?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4071307", "replies": 13, "has_files": false, "suggestion_summary": "Checked via Staffside whether each account's flow was on Flows V1 or V2 — AU was on V1 (has Custom Actions) while NZ was on V2 (Custom Actions not yet supported until July). Advised asking in the referenced Slack channel if custom actions could be enabled for the NZ (V2) account rather than sending the same explanation used in a prior case.", "standardized_area": "Flows"}, {"date": "2026-07-13", "requester": "Ash Arraiza", "ka": "Vdbaf7", "area": "K-Service", "summary": "• Onsite JS crashes on every page load on mreatwell.com with the Error: undefined reading 'customerHubOnboarded'. • Comes from build-preview/commit path atlas.js. • Customer Hub is not enabled on this account. • Customer's HAR shows fast.a.klaviyo.com/atlas/api/public/settings/Vdbaf7 returns 404.", "tried": ["this customer is requesting a lot of information that I'm not sure how to source.", "I've already told the customer the build-preview/commit-{hash} path is part of our standard rolling deployment process, not a beta or preview environment."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4068290", "replies": 3, "has_files": false, "suggestion_summary": "Claude-assisted investigation traced the crash to the onsite JS base loader pulling all onsite chunks (atlas, forms, telemetry, product recommendations) from a build-preview/commit path instead of a normal production path; a customerHub config/feature-flag object was never initialized in that build, causing the uncaught 'customerHubOnboarded' error. Recommendation was to escalate to the K-Service engineering team to confirm whether this is expected behavior or a bug.", "standardized_area": "K-Service"}, {"date": "2026-06-24", "requester": "Chris Yinfoo", "ka": "XEPuyw", "area": "Integrations", "summary": "The customer is seeing a site setup for their integration however they no longer use this ction", "Business is located in Portugal, falls under EU consent restrictions; customer confirmed they accept cookies before adding to cart", "Explained the various ways profiles must enter the identity graph, customer still having issues, asking to escalate"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3957250", "replies": 3, "has_files": false, "suggestion_summary": "Alicya tested on desktop and mobile but couldn't replicate the issue, and noted that incognito browsing should always trigger fresh cookie acceptance. She advised telling the customer the issue is likely on their end since it can't be replicated, and to escalate to the BL team.", "standardized_area": "Integrations"}, {"date": "2026-05-14", "requester": "Chris Yinfoo", "ka": "Y9yRLy", "area": "Lists & Segments", "summary": "Customer wants to show the lifecycle they'd track within segments for each 'Child' custom object (e.g. a segment of \"infants aged 3 months-12 months\"). It showed 0 profiles, and even a segment for having the Child property set showed 0 profiles. Waited 30+ mins with no updates.", "tried": ["Looks like data is in place but the segment isn't picking this up", "Tried different conditions which match the profile", "Waited some time after creating the segment to see if results were delayed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3962610", "replies": 4, "has_files": false, "suggestion_summary": "Alicya created a test segment and noted it can take up to 20 minutes to populate per the KB. If it still doesn't work, she linked a known Linear issue (GPLAT-425) and advised asking the SA (Bella) to follow up directly in the Linear ticket to flag urgency, since the bug is in backlog with no ETA.", "standardized_area": "Lists & Segments"}, {"date": "2026-05-12", "requester": "Chris Yinfoo", "ka": "VD2Qzs", "area": "Flows", "summary": "The customer has observed that emails are taking longer than 1-2 mins to send from the flow (no delay step, but maybe conditional ry": "Alicya noted that edit access to the account is required to view the inactive segment — the customer should check if the profile appears there. Liam flagged a potentially related Jeremy ticket on the same issue.", "standardized_area": "Lists & Segments"}, {"date": "2026-02-24", "requester": "Ash Arraiza", "ka": "TdFebw", "area": "Accounts", "summary": "- Customer is stuck in a loop where the page continuously asks to login to continue after session expiration.", "tried": ["- Got customer to clear cache and erase cookies", "- No login errors appearing on the back end and account is not disabled/suspended", "- Using current Chrome version and macOS Monterey", "- Confirmed doesn't log in from any other device or share accounts with anyone"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3749831", "replies": 17, "has_files": false, "suggestion_summary": "Alicya suggested clearing cookies/cache for at least 7 days and having the customer log into Klaviyo directly rather than via Shopify. Stephanie provided context on the 'Session Expired' error behaviour.", "standardized_area": "Accounts"}, {"date": "2026-02-23", "requester": "Meher Gambhir", "ka": "V97Ddi", "area": "Compliance", "summary": "Customer is trying to complete AU branded sender ID registration. After submitting the form they are redirected to a Google Forms page showing \"Something went wrong. Please try again.\" across multiple Chrome logins on both laptop and phone, so the AU sender ID stays Incomplete and they cannot send SMS to AU numbers.", "tried": ["- Confirmed AU branded sender ID is Incomplete under Settings", "- Guided customer to resubmit via Finish registering, still shows error page", "- Confirmed tried multiple Chrome logins on both laptop and phone", "- Asked them to verify website URL/required fields and retry on different network/device", "- Reviewed HC and IKB articles, found no additional frontline fixes for this error"], "ticket_url": "https://klaviyo.zendesk.com/agent/tic rom Shopify.", "standardized_area": "Flows"}, {"date": "2026-02-13", "requester": "Ash Arraiza", "ka": "UksXRm", "area": "Campaigns", "summary": "- CX cannot clone campaign to another account (from AU to NZ accounts)", "tried": ["- Confirmed customer is an Admin on both accounts", "- Cleared cache and tried in incognito", "- Page gets to the loading screen then stays frozen for 1+ hours", "- Tried adding a list into the recipients with and without a profile", "- Cloned the campaign for the customer to try cloning, issue persists"], "ticket_url": "", "replies": 2, "has_files": false, "suggestion_summary": "The campaign clone freeze between AU and NZ accounts resolved itself without intervention — Ash confirmed it fixed with patience and linked related bug reports BUGPORT-10542 and BUGPORT-10575 for reference.", "standardized_area": "Campaigns"}, {"date": "2026-02-11", "requester": "Chris Yinfoo", "ka": "UxmzeY", "area": "Integrations", "summary": "Historical sync appears stalled at 98%.", "tried": ["- When they initially reached out, noticed a 500 error and supplied info", "- Looks to have progressed but now close to 98%", "- Can see a failed historical sync with one retry", "- Considering whether re-queuing again would make a difference"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3734262", "replies": 15, "has_files": false, "suggestion_summary": "Alicya suggested increasing the integration's connection_timeout setting (to around 50) to resolve the 503 timeout errors, then waiting until the expected sync completion date to see if it succeeds.", "standardized_area": "Integrations"}, {"date": "2026-02-09", "requester": "Chris Yinfoo", "ka": "TVPP9H", "area": "Lists & Segments", "summary": "The customer believes they meet the criteria for CLV however they notice a message when looking into a profile suggesting otherwise.", "tried": ["- Reviewed Predictive Analytics HC article", "- Checked through the criteria to see if they meet them, which looks to be the case", "- Unsure what might have been missed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3736907", "replies": 9, "has_files": false, "suggestion_summary": "Alicya found the issue was caused by incorrect metric mapping — Placed Order was mapped to an individual item metric, so revenue couldn't be calculated. She recommended the customer remap their metrics following the predictive analysis guide.", "standardized_area": "Lists & Segments"}, {"date": "2026-02-04", "requester": "Chris Yinfoo", "ka": "MBqXVi", "area": "Campaigns", "summary": "The customer would like the figures for the usage graph but for the period January - Dec 2025. The current view only does last 12 months.", "tried": ["- Checked the Contracted Manual Billing IKB but unsure it's quite right"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3720575", "replies": 8, "has_files": false, "suggestion_summary": "Alicya suggested escalating to the Billing team to get the customer a usage report, and noted that a custom report on API usage may also be possible.", "standardized_area": "Campaigns"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "VGeZHB", "area": "Integrations", "summary": "The exact same request works from a laptop via curl (HTTP 201 Created), but it fails from n8n Cloud with a Cloudflare block page (\"Sorry, you have been blocked / unable to access klaviyo.com\").", "tried": ["- Asked for more information about the API call being made, customer provided detail on what is being blocked", "- Question: is this usual for an IP to be blocked and anything we can do about it?"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3688264", "replies": 5, "has_files": false, "suggestion_summary": "Alicya confirmed this is a standard IP whitelisting issue and directed the customer to follow the relevant steps.", "standardized_area": "Integrations"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "Wqcbfr", "area": "Catalogs & Feeds", "summary": "The customer updated their inventory for an item and is wondering why the BIS report still says queued for some products with the same name.", "tried": ["- Looked through examples in the BIS Report, noticed SKU ID is different from the Shopify ID", "- Found they have a custom catalog sync as well, asked customer if they're aware of who set it up", "- Customer responded they have no idea why they'd have a custom catalog also, and asked if they can disconnect the API catalog"], "ticket_url": "", "replies": 24, "has_files": false, "suggestion_summary": "Alicya walked through the options: either fix the custom catalog feed with developer help, or delete it entirely and resync using the Shopify catalog (noting this would affect Back-in-Stock). She recommended clarifying with the customer which path they prefer.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-27", "requester": "Chris Yinfoo", "ka": "X6M5Pn", "area": "Catalogs & Feeds", "summary": "- Localised product feed links issue.", "tried": ["- A lot of back and forth already, need advice on next best approach"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3642269", "replies": 16, "has_files": false, "suggestion_summary": "Alicya identified that the product URL in the customer's custom catalog feed was syncing with the incorrect URL, and recommended they fix it in their feed. She also suggested looping in the CSM to alert them to the situation.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "sqUwG2", "area": "Integrations", "summary": "The customer's Shopify Onsite Tracking says it's 'Turned Off', however they see a message in Shopify to advise it's Activated.", "tried": ["- Using 'Get App Embed Metafields', can see if it's actually false", "- Considering \"Reset App Embed Metafields\" instructions and asking them to go through the steps again"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3659792", "replies": 2, "has_files": false, "suggestion_summary": "Alicya suggested following the existing guide carefully and making sure the Save button is clicked, then asking the customer for a screen recording if the issue persists.", "standardized_area": "Integrations"}, {"date": "2026-01-22", "requester": "Chris Yinfoo", "ka": "3670894", "area": "Integrations", "summary": "Customer has an API between their custom website solution and Klaviyo. Discount codes built via website all have the same expiry date. For their new sunset flow they need codes uploaded to the API to be evergreen with varying time periods. Asking if Klaviyo can call their API/website endpoint for how many codes are needed and the duration.", "tried": ["- Still trying to wrap head around their situation"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3670894", "replies": 15, "has_files": false, "suggestion_summary": "Alicya explained that coupon expiry must be set as a fixed date (not a relative period like '14 days'), but leaving it blank defaults to 1-year expiry from when the profile enters the flow. She suggested asking in #ask-apis about adding a relative expiry option.", "standardized_area": "Integrations"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
</body>
</html>
