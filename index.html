<style>
  :root { color-scheme: light; }

  .stat-card .stat-label { font-size: 11px; font-weight: 500; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

  .stat-card.blue   .stat-value { color: #007aff; }
  .filter-bar { background: #fff; border: 1px solid #e5e5ea; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }

  .search-wrap input { width: 100%; border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px 7px 30px; font-size: 13px; color: #1d1d1f; outline: none; transition: border-color 0.15s; }

  .filter-select { border: 1px solid #d1d1d6; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #1d1d1f; background: #fff; outline: none; cursor: pointer; min-width: 140px; }

  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; white-space: nowrap; }

  .td-summary-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ticket-link { color: #4A154B; text-decoration: none; font-size: 12px; font-weight: 500; }

  .area-tag { display: inline-block; background: #f0e8f1; color: #4A154B; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 500; max-width: 180px; word-break: break-word; }
  .expand-row td { padding: 0; background: #fdf8fe; border-bottom: 2px solid #e5d6e8; }

  .expand-section ul { padding-left: 16px; }
  .expand-section li { font-size: 13px; color: #3a3a3c; line-height: 1.5; margin-bottom: 4px; }

  .expand-suggestion-box { grid-column: 1 / -1; background: #f0faf4; border: 1.5px solid #34c759; border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .expand-suggestion-box .suggestion-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
  .expand-suggestion-box .suggestion-body h4 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #1a7f37; margin-bottom: 5px; }
  .expand-suggestion-box .suggestion-body p { font-size: 13px; color: #1d3826; line-height: 1.6; }
  .empty-state { text-align: center; padding: 40px; color: #8e8e93; font-size: 13px; }
  .no-suggestions { color: #8e8e93; font-size: 12px; font-style: italic; }

<script>
const QUESTIONS=[{"date": "2026-06-10", "requester": "Meher Gambhir", "ka": "an79Sm", "area": "Campaigns", "summary": "CX is concerned the footer banner in many of their emails is rendering much wider than expected on desktop in Gmail, Chrome for test sends. It appears aligned correctly in preview.", "tried": ["CX said their emails often clip in Gmail, but they have not normally had footer issues from that before, so clipping does not seem to fully explain this case.", "I checked the footer table/ image sizing. The image cell had a 400px max width, but reducing that to 200 did not resolve the issue on CX end.", "Ran a test with my test gmail acc. Both through preview and test option and actually sending a clone of the campaign to myself. Could not replicate issue on my end.", "CX plans to send campaign out in around 6 hours from now, so wanted to confirm if there is anything else I can do for them to try fix this."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4012844", "replies": 15, "has_files": false, "suggestion_summary": "Alicya suggested the issue could be Gmail clipping or related to the new template editor migration, and advised that since the issue could not be replicated on their end, Meher should reply using the Gmail clipping angle.", "standardized_area": "Campaigns"}, {"date": "2026-06-09", "requester": "Ash Arraiza", "ka": "KwJYB2", "area": "Campaigns", "summary": "• Customer created an A/B test campaign, however no one received the variation B. • The A/B test results tab does not show variation B at all.", "tried": ["Created a segment for the customer to use, however they are expecting this to be closer to 6k profiles.", "When I clone the campaign, it shows 21k estimated recipients. So I'm unsure where the missing 6k profiles went.", "there are only 4 skipped profiles and 27 bounced profiles in recipient activity", "verified with customer that the campaigns were not made recently, and she's been using them consistently.", "Creating a segment for profiles who have received variation B yields 0 profiles.", "Creating a segment for profiles who have received variation A yields 14551 profiles.", "Basically, I'm unsure if this is related to the incident this morning.", "I've already linked the bug for the A/B test UI issue."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4010450", "replies": 11, "has_files": false, "suggestion_summary": "Alicya checked the Staffside campaign view and confirmed variation B was never sent, then recommended escalating to Business Licensing as it was unclear whether the issue stemmed from a platform incident or the linked UI bug (EXP-392).", "standardized_area": "Campaigns"}, {"date": "2026-06-04", "requester": "Ash Arraiza", "ka": "tNPZ9N", "area": "Lists & Segments", "summary": "• cloning segments between accounts is successful, however the segment conditions are not copied.", "tried": ["ensured user is an Admin in all accounts.", "ensured the matching custom properties do exist in the UK account", "checked linear for any known bugs.", "checked/followed this guide"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/4001556", "replies": 8, "has_files": false, "suggestion_summary": "Alicya clarified that 'contains text' conditions are not necessarily advanced operators, and recommended escalating to Business Licensing for confirmation while also requesting an update to the internal KB article on cross-account segment cloning.", "standardized_area": "Lists & Segments"}, {"date": "2026-06-02", "requester": "Ash Arraiza", "ka": "QCN2d7", "area": "Catalogs & Feeds", "summary": "• Back in stock reports tab loads indefinitely.", "tried": ["Did not replicate this issue in 2 test accounts", "Cecilia's Basecamp (XDLpgg) paid account, Ash A Test Account (UvCpx3) free account", "User attempting the action is an Admin (kate.leveille@bycharlotte.com.au)", "Re-attempted from incognito window."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3995864", "replies": 17, "has_files": false, "suggestion_summary": "Alicya confirmed the same 500 internal server error in the customer's account (Back in Stock Reports tab) but could not replicate it in test accounts. She recommended escalating to Business Licensing.", "standardized_area": "Catalogs & Feeds"}, {"date": "2026-06-02", "requester": "Meher Gambhir", "ka": "WKMDP9", "area": "Flows", "summary": "Customer states they have not received any internal alert notifications from this flow since 21st May. Alerts should be sending if there has been more than 20mins since since checkout started (with amount higher than $1000). They were receiving multiple alerts in a day on the 21st of May and prior but it suddenly stopped.", "tried": ["Toggled the alert from Live to Draft and back to Live. No other changes made in history", "Appears could be similar to FP-1788 bug", "Tried to spot check profiles but could not find an example where there was a 20min gap between checkout started and placed order and it was post 21st May"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3991689", "replies": 12, "has_files": false, "suggestion_summary": "Alicya found many recent skips in the flow evaluation due to 'No recipients', visible even on the day of the query. She suggested asking the customer to check their internal alert recipient details (consent status), and linked Linear bug FP-1817 as a likely cause if profiles show a green checkmark but still aren't receiving alerts.", "standardized_area": "Flows"}, {"date": "2026-05-27", "requester": "Ash Arraiza", "ka": "PaDxZ9", "area": "Accounts", "summary": "• Customer cannot bulk suppress this segment.", "tried": ["Drafted a new segment within their account and found that only 99 profiles were suppressed in the last 90 days.", "User is an admin, so they should be able to suppress this segment.", "Checked Linear for any related tix."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3985709", "replies": 4, "has_files": false, "suggestion_summary": "Alicya checked Splunk and confirmed the bulk suppression job was accepted but not yet processed; she suggested waiting a few hours to see if profiles update, and if still not suppressed, to comment on the related Linear ticket ICM-599. Ash later confirmed profiles were still not suppressed after several hours and added the ticket to Linear.", "standardized_area": "Accounts"}, {"date": "2026-05-26", "requester": "Meher Gambhir", "ka": "Rmwb2z", "area": "K-Social", "summary": "CX is trying to connect their Instagram account to the new Social feature, but the connection is not sticking.", "tried": ["Asked CX to follow the reconnect flow from the Klaviyo error message. They completed it, including the prompt saying they had already connected to Klaviyo and could continue allowing access, but the error remained.", "Verified the Instagram permissions and they look all good against our guide.", "Checked Developer Tools logs and found no related API errors. Found similar ticket where Cecilia saw Instagram API Error 10: (#10) Insufficient permissions to access this data. Then had CX reauthorise Facebook. This worked briefly, but kept disconnecting again shortly after."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3983038", "replies": 10, "has_files": false, "suggestion_summary": "Alicya suggested verifying the customer has Admin/Editor/Full Control on their Facebook/Meta assets for the Instagram Business account, and asked Meher to collect screenshots of both Facebook Page Advanced Messaging settings (Connected Apps > Klaviyo-IG) and Instagram Website Permissions to confirm all required permissions are enabled. If the issue persists after confirming permissions, the recommendation was to link the similar ticket and escalate to BL.", "standardized_area": "K-Social"}, {"date": "2026-05-18", "requester": "Ash Arraiza", "ka": "V6acte", "area": "Integrations", "summary": "• Shopify Added to Cart is not firing on certain profiles  • mariana.vasconcelos@piranha.com.pt • ruben.matos@piranha.com.pt", "tried": ["Followed relevant IKB", "Could not replicate issue on test accounts.", "Ran PostmanLite, response shows \"CONNECTED\"", "Fetched both example customers in SS, appear as they do in Klaviyo.", "Ensured Track Behavioural Events is enabled", "Sent the macro for advanced steps to confirm add to cart pixel fire", "When customer tested pixel, reported product_added_to_cart and page_viewed were received, but now reporting issues with Viewed Collection.", "Business is in Portugal, falls under EU consent restrictions, they confirmed accepting cookies before adding to cart.", "Explained various ways profiles must enter the identity graph, but customer still having issues and asking to escalate."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3957250", "replies": 3, "has_files": false, "suggestion_summary": "Alicya tested on desktop and mobile but couldn't replicate the issue, and noted that incognito browsing should always trigger fresh cookie acceptance. She advised telling the customer the issue is likely on their end since it can't be replicated, and to escalate to the BL team.", "standardized_area": "Integrations"}, {"date": "2026-05-14", "requester": "Chris Yinfoo", "ka": "Y9yRLy", "area": "Lists & Segments", "summary": "\"For context we want to show the lifecycle we'd track within segments for each 'Child' object. EG., for a segment of 'infants aged 3months-12months' I was using the below segment definition.\"  \"It showed 0 profiles, so then even using a segment of having the Child property set was showing 0 profiles too. We waited 30+ mins to see if it would populate but no updates.\"", "tried": ["Looks like data is in place but the segment isn't picking this up", "Tried didn't conditions which match the profile", "Waited some time after creating the segment to see if results were delayed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3962610", "replies": 4, "has_files": false, "suggestion_summary": "Alicya created a test segment and noted it can take up to 20 minutes to populate per the KB. If it still doesn't work, she linked a known Linear issue (GPLAT-425) and advised asking the SA (Bella) to follow up directly in the Linear ticket to flag urgency, since the bug is in backlog with no ETA.", "standardized_area": "Lists & Segments"}, {"date": "2026-05-12", "requester": "Chris Yinfoo", "ka": "VD2Qzs", "area": "Flows", "summary": "The customer has observed that emails are taking longer than 1-2mins to send from the flow (No delay step however maybe conditional split steps)", "tried": ["Previous agent mentioned conditional splits and flow filters add processing time. The customer then came back with additional queries."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3954968", "replies": 9, "has_files": false, "suggestion_summary": "Alicya noted she had a similar delay issue that gradually improved, and that 3 minutes is still within the acceptable grace period per an existing Slack thread. She recommended sending the customer David's example response about expected flow send times.", "standardized_area": "Flows"}, {"date": "2026-05-08", "requester": "Meher Gambhir", "ka": "LnETuM", "area": "K-Service", "summary": "The email enquiries@klevarange.com.au is showing as Failed in Klaviyo, but the customer's testing suggests the email flow is working. Their test email reached Helpdesk, landed in Spam, and the Helpdesk reply was successfully received at their external address.", "tried": ["CX confirmed the Microsoft 365 forwarding rule is set correctly and external forwarding is allowed.", "CX sent a test email from personal address to enquiries@klevarange.com.au, email did reach Klaviyo Helpdesk, but it landed in Spam.", "Also confirmed the reply from Helpdesk made it back to their external address.", "To resolve he tried to mark the set up as done but came across error as it was pending for a while but then went back to failed"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3952094", "replies": 8, "has_files": false, "suggestion_summary": "Alicya advised following the internal KB troubleshooting steps for 'Failed' vs 'Verified' status, and suggested temporarily changing the forwarding destination to reset the connection. If it still shows Failed after that, escalate to the BL team.", "standardized_area": "K-Service"}, {"date": "2026-05-08", "requester": "Ash Arraiza", "ka": "L2xQqw", "area": "Integrations", "summary": "Customer is trying to track a custom Started Checkout metric via GTM on their Shopify checkout page. However it is not firing.", "tried": ["The Klaviyo SDK is loading and the cookie is being set, but _learnq.push() is returning false and window.klaviyo.track() does not resolve. Checked network requests and no network requests are reaching Klaviyo's servers at all.", "Confirmed metric has never received events in the account", "Tested with test email. Clicked welcome email to cookie browser > went through checkout > no event appeared on test profile", "Confirmed via DevTools that GTM and klaviyo.js are not loading on the Shopify checkout domain (separate domain issue)", "Suspect CSP blocking outbound requests to Klaviyo domains, or consent settings silencing the SDK"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3949525", "replies": 19, "has_files": false, "suggestion_summary": "Alicya found an SA wiki page confirming custom Started Checkout events can work with GTM, and advised gathering more details from the customer (code snippets, exact setup) before escalating to the SE team — including the wiki doc in the escalation note for context.", "standardized_area": "Integrations"}, {"date": "2026-04-29", "requester": "Chris Yinfoo", "ka": "LWjHvK", "area": "Lists & Segments", "summary": "The customer noticed a large drop in their segment growth which was out of the norm from their observations", "tried": ["Checked some profiles from the 24th April and interestingly they are 'Never Subscribed' status", "The first criteria is can receive email marketing because 'Subscribed'", "Cannot see any segment definition changes", "Customer is not aware of any API or external applications which could be making changes", "Not seeing any dev logs for the profiles", "Examples appear to have a subscribed to email marketing event that took place a long time ago"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3930031", "replies": 9, "has_files": false, "suggestion_summary": "Alicya flagged that profiles going from 'Subscribed' to 'Never Subscribed' is unusual and may indicate a bug. She suggested escalating to Business Licensing for further investigation.", "standardized_area": "Lists & Segments"}, {"date": "2026-04-24", "requester": "Ash Arraiza", "ka": "RfkAhB", "area": "Campaigns", "summary": "• Link activity is not showing added params.  • Links are being merged as 1 main link that does not contain UTMs or additional params.", "tried": ["Cloned the campaign and verified the issue.", "Found possible related bug CAMP-49 - Campaign Link Activity showing multiple pages for same URL", "Basically want to clarify if this is expected behaviour or whether to send this to BL."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3927296", "replies": 7, "has_files": false, "suggestion_summary": "Ellie confirmed based on the help article that UTM-tracked links and `?link=` links should be tracked separately. She suggested testing with the `?link=` parameter format to verify, and noted it did work when tested.", "standardized_area": "Campaigns"}, {"date": "2026-04-24", "requester": "Ash Arraiza", "ka": "SchJmc", "area": "Integrations", "summary": "Looking for a sanity check on a Cloudflare WAF configuration (hotlinking) before sending to a customer. The IKB steps were provided but customer pushed back since the last time they did this it blocked all visitors from their site.", "tried": ["Planning to get them to update the rule to a positive match + Skip action using http.referer contains \"klaviyo\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3924802", "replies": 4, "has_files": false, "suggestion_summary": "Dmytro suggested pointing the customer to Cloudflare's official WAF custom rules guide for hotlink protection, and if their implementation is still causing issues, to contact Cloudflare support directly.", "standardized_area": "Integrations"}, {"date": "2026-04-21", "requester": "Ash Arraiza", "ka": "Je8TME", "area": "Templates", "summary": "• Logic is correct but block stays hidden even if condition is true. • Property is $loop_active_subscriber and they want to show the \"It's Back\" block if the value is true", "tried": ["Used segment to confirm data type is Boolean", "Used code from HC article, block is still hidden using one condition at a time"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3920198", "replies": 14, "has_files": false, "suggestion_summary": "Alicya asked about display rules on the template sections. Liam found the section had display logic set on it that was preventing it from showing, which was the root cause.", "standardized_area": "Templates"}, {"date": "2026-04-20", "requester": "Chris Yinfoo", "ka": "RxSiLW", "area": "Templates", "summary": "The customer is using dynamic tags to have the percentage discount display. However, it looks like the base price is pulling in the first item's compare at price rather than the correct variant, resulting in a negative discount.", "tried": ["It looks like the current formula is always pulling in the lowest ml compare at price rather than the actual product compare at price", "Customer says Skio event passing compare at price is low priority on Skio end"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3914014", "replies": 10, "has_files": false, "suggestion_summary": "Alicya noted the customer is using the correct `item.productVariantPlatformId` variable but the Shopify catalog may not support dynamic variant image lookups. She suggested trying the approach from the related method guide, and asking in #ask-apis if it's achievable.", "standardized_area": "Templates"}, {"date": "2026-04-20", "requester": "Chris Yinfoo", "ka": "XNZdR9", "area": "Templates", "summary": "The customer has a Fulfilled Order flow email, where they would like dynamic content to display in a 'collage' layout rather than a single column table.", "tried": ["The previous agent used the HTML block to produce what looks to be the customers want", "However, when you send the email as a preview, no images are actually retained", "Tried to update the code to get it to work however no joy so far"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3912407", "replies": 9, "has_files": false, "suggestion_summary": "Alicya suggested not going too deep on the HTML troubleshooting — instead, refer the customer to Klaviyo's product block extension guide or use AI to help achieve the layout, with the vertical display guide as a fallback.", "standardized_area": "Templates"}, {"date": "2026-04-20", "requester": "Ash Arraiza", "ka": "QPH4G3", "area": "Sign Up Forms", "summary": "• Sign up form adding profiles to the incorrect list.", "tried": ["tested the form myself and could not replicate issue", "Compared the Form versions with test accounts and the profile example, same form version ID", "confirmed form was last published live on 17 April", "confirmed form is adding to correct lists after confirming opt-in", "checked the incorrect list's forms and do not see the sign up form", "Customer advised that the form was cloned from an old sign up form, however they changed the \"Submit to\" lists before publishing live"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3917839", "replies": 30, "has_files": false, "suggestion_summary": "Jeremy suggested the duplicate Shopify integration as a likely cause. Alicya investigated and found the profile was subscribed via Shopify login (trigg ardized_area": "Integrations"}, {"date": "2026-04-10", "requester": "Meher Gambhir", "ka": "XdrVV8", "area": "Flows", "summary": "Customer's Shopify Order Confirmation flow is mis-routing one profile based on order count. A profile with only one Placed Order event received the Loyal Customer order confirmation instead of the New Customer version.", "tried": ["Confirmed with customer: other profiles have also received this email incorrectly", "Reviewed flow splits: is configured as expected", "Used Flow Debugger: consent split evaluated True, but all three order-count splits evaluated False for this profile/event", "Used Flow Change Log: no structural changes to this flow after the customer entered", "Verified via Recipient Activity + Messages tab that the Loyal Customer email was the one actually sent"], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3899295", "replies": 7, "has_files": false, "suggestion_summary": "Cecilia identified a race condition — the flow trigger fires on Shopify Placed Order, but the conditional splits check against a custom Placed Order metric that wasn't recorded yet. She suggested adding a time delay to account for the gap.", "standardized_area": "Flows"}, {"date": "2026-04-10", "requester": "Meher Gambhir", "ka": "WV7nVS", "area": "Templates", "summary": "CX is trying to update their existing custom font \"Mongoose\" from Normal 400 to Medium 500 but the Fonts UI shows: \"One or more font files could not be accessed.\" The font URL is reachable and downloads fine, and their host has added CORS headers for Klaviyo.", "tried": ["Opened that exact URL in an incognito window and confirmed it downloads the file", "Customer's host added CORS headers include Header always set Access-Control-Allow-Origin", "Re-tested saving the font in the Klaviyo UI, still seeing \"One or more font files could not be accessed.\""], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3901722", "replies": 6, "has_files": false, "suggestion_summary"  is using custom integration."], "ticket_url": "https://klaviyo.zendesk.com/agent/tickets/3838412", "replies": 17, "has_files": false, "suggestion_summary": "Alicya provided the correct Jinja loop syntax — `{% for item in event.Items %}{% catalog item.SKU %}` — to dynamically look up catalog items, and recommended using a text block rather than an image block for better control of the layout.", "standardized_area": "Templates"}];
let sortCol="date",sortDir="desc",expandedIdx=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtDate(s){const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}
function buildFilters(){
  const req=[...new Set(QUESTIONS.map(q=>q.requester))].sort();
  const areas=[...new Set(QUESTIONS.map(q=>q.area))].sort();
  const months=[...new Set(QUESTIONS.map(q=>q.date.slice(0,7)))].sort().reverse();
  document.getElementById("requesterFilter").innerHTML='<option value="">All Requesters</option>'+req.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  document.getElementById("areaFilter").innerHTML='<option value="">All Product Areas</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  document.getElementById("monthFilter").innerHTML='<option value="">All Months</option>'+months.map(m=>{const d=new Date(m+"-01T00:00:00");return`<option value="${m}">${d.toLocaleDateString("en-AU",{month:"long",year:"numeric"})}</option>`;}).join("");
}
function updateStats(){
  document.getElementById("statTotal").textContent=QUESTIONS.length;
  document.getElementById("statAreas").textContent=new Set(QUESTIONS.map(q=>q.area)).size;
  document.getElementById("statAsh").textContent=QUESTIONS.filter(q=>q.requester==="Ash Arraiza").length;
  document.getElementById("statChris").textContent=QUESTIONS.filter(q=>q.requester==="Chris Yinfoo").length;
  document.getElementById("statMeher").textContent=QUESTIONS.filter(q=>q.requester==="Meher Gambhir").length;
}
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const req=document.getElementById("requesterFilter").value;
  const area=document.getElementById("areaFilter").value;
  const month=document.getElementById("monthFilter").value;
  return QUESTIONS.filter(q=>{
    if(req&&q.requester!==req)return false;
    if(area&&q.area!==area)return false;
    if(month&&!q.date.startsWith(month))return false;
    if(s){const hay=[q.requester,q.area,q.summary,q.ka,...q.tried,q.suggestion_summary||""].join(" ").toLowerCase();if(!hay.includes(s))return false;}
    return true;
  });
}
function sortRows(rows){return[...rows].sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(va<vb)return sortDir==="asc"?-1:1;if(va>vb)return sortDir==="asc"?1:-1;return 0;});}
function handleSort(col){if(sortCol===col)sortDir=sortDir==="asc"?"desc":"asc";else{sortCol=col;sortDir="desc";}renderTable();}
function si(col){return sortCol===col?(sortDir==="asc"?"↑":"↓"):'<span style="opacity:0.35">↕</span>';}
function renderSuggestions(s){
  if(!s)return'<p class="no-suggestions">No summary available</p>';
  return`<p>${esc(s)}</p>`;
}
function renderTable(){
  const filtered=sortRows(getFiltered());
  document.getElementById("filterCount").textContent=`Showing ${filtered.length} of ${QUESTIONS.length}`;
  const c=document.getElementById("tableContainer");
  if(!filtered.length){c.innerHTML='<div class="empty-state">No questions match your filters.</div>';return;}
  let html=`<table><thead><tr><th onclick="handleSort('date')" class="${sortCol==='date'?'sorted':''}">Date ${si('date')}</th><th onclick="handleSort('requester')" class="${sortCol==='requester'?'sorted':''}">Requester ${si('requester')}</th><th>KA</th><th onclick="handleSort('area')" class="${sortCol==='area'?'sorted':''}">Product Area ${si('area')}</th><th>Issue Summary</th><th>Ticket</th></tr></thead><tbody>`;
  filtered.forEach(q=>{
    const oi=QUESTIONS.indexOf(q),isExp=expandedIdx===oi;
    html+=`<tr onclick="toggleExpand(${oi})" class="${isExp?'expanded-row':''}"><td class="td-date">${fmtDate(q.date)}</td><td class="td-requester">${esc(q.requester)}</td><td class="td-ka">${esc(q.ka)}</td><td><span class="area-tag">${esc(q.area)}</span></td><td class="td-summary"><div class="td-summary-text">${esc(q.summary)}</div></td><td>${q.ticket_url?`<a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank" onclick="event.stopPropagation()">View ↗</a>`:'<span style="color:#c7c7cc;font-size:12px">–</span>'}</td></tr>`;
    if(isExp)html+=`<tr class="expand-row"><td colspan="6"><div class="expand-content">`
      +`<div class="expand-section expand-full"><h4>Issue Summary</h4><p>${esc(q.summary)}</p></div>`
      +`<div class="expand-section"><h4>What Has Been Tried</h4>${q.tried.length?'<ul>'+q.tried.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p style="color:#c7c7cc">No steps recorded</p>'}</div>`
      +`<div class="expand-section"><h4>Details</h4><p><strong>KA:</strong> ${esc(q.ka)}</p><p><strong>Requester:</strong> ${esc(q.requester)}</p><p><strong>Date:</strong> ${fmtDate(q.date)}</p>${q.has_files?'<p><strong>Attachments:</strong> ✓ Files attached</p>':''}${q.ticket_url?`<p><strong>Ticket:</strong> <a class="ticket-link" href="${esc(q.ticket_url)}" target="_blank">Open in Zendesk ↗</a></p>`:''}</div>`
      +`<div class="expand-suggestion-box"><span class="suggestion-icon">✅</span><div class="suggestion-body"><h4>What Was Suggested</h4>${renderSuggestions(q.suggestion_summary)}</div></div>`
      +`</div></td></tr>`;
  });
  html+="</tbody></table>";
  c.innerHTML=html;
}
function toggleExpand(idx){expandedIdx=expandedIdx===idx?null:idx;renderTable();}
buildFilters();updateStats();renderTable();
</script>
